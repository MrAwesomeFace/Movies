<style>
  /*
    Layout concept: a dense, poster-free ledger of classics grouped
    by year, 3x5 per year, check-and-forget. Reached only by
    double-clicking the π easter egg on the main site - not linked
    from anywhere, no nav back required.
  */
  :root{
    --bg: #0b1526;
    --bg-raised: #101d33;
    --bg-card: #14213b;
    --line: rgba(212, 175, 96, 0.18);
    --line-strong: rgba(212, 175, 96, 0.35);
    --text: #e9edf5;
    --text-dim: #8993a8;
    --gold: #d4af60;
    --gold-bright: #f0cd82;
    --watched: #4a5568;
    --ww-flag: #c1664a;
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Oswald', system-ui, sans-serif;
    padding-inline: 20px;
    padding-block: 28px;
    max-width: 900px;
    margin: 0 auto;
  }

  h1, h2, h3{ text-wrap: balance; margin: 0; }

  .top-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Oswald', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--gold);
    text-decoration: none;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 7px 12px;
  }

  .back-link:hover{
    background: var(--bg-raised);
  }

  .sync-controls{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #sync-status{
    font-size: 11.5px;
    color: var(--text-dim);
    max-width: 22ch;
    text-align: right;
  }

  #backfill-button{
    font-family: 'Oswald', system-ui, sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
    white-space: nowrap;
  }

  #backfill-button:hover{
    color: var(--gold);
    border-color: var(--line-strong);
  }

  #backfill-button:disabled{
    opacity: 0.5;
    cursor: default;
  }

  /* ---------------- Classics page ---------------- */

  .page-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }

  .page-head h1{
    font-family: 'Iceland', system-ui, sans-serif;
    font-size: 34px;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
  }

  .progress{
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .progress b{ color: var(--gold); font-weight: 400; }

  /* ---------------- Decades (collapsible) ---------------- */

  .decade{
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    background: var(--bg-raised);
    overflow: hidden;
  }

  .decade summary{
    list-style: none;
    cursor: pointer;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
  }

  .decade summary::-webkit-details-marker{ display: none; }

  .decade summary .chevron{
    font-family: 'VT323', monospace;
    color: var(--gold);
    font-size: 16px;
    transform: rotate(-90deg);
    transition: transform 0.18s ease;
    flex-shrink: 0;
    width: 1em;
  }

  .decade[open] summary .chevron{
    transform: rotate(0deg);
  }

  .decade summary .decade-label{
    font-family: 'Iceland', system-ui, sans-serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
  }

  .decade summary .decade-meta{
    margin-left: auto;
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .decade-body{
    padding: 4px 16px 16px;
    border-top: 1px solid var(--line);
  }

  .decade-empty{
    padding: 14px 2px 6px;
    color: var(--text-dim);
    font-size: 13.5px;
    font-style: italic;
  }

  .search-bar{
    margin: 4px 0 14px;
  }

  .search-bar input{
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    font-family: 'Oswald', system-ui, sans-serif;
    font-size: 15px;
  }

  .search-bar input:focus{
    outline: none;
    border-color: var(--gold);
  }

  .search-bar input::placeholder{
    color: var(--text-dim);
  }

  .year-block{
    margin-top: 22px;
  }

  .year-block:first-child{
    margin-top: 18px;
  }

  .year-heading{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .year-heading .year{
    font-family: 'Iceland', system-ui, sans-serif;
    font-size: 24px;
    color: var(--gold);
    min-width: 4ch;
  }

  .year-heading .rule{
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .year-heading .year-count{
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }

  .title-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 18px;
  }

  .title-row{
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 5px 2px;
    border-radius: 5px;
    min-width: 0;
  }

  .title-row input[type="checkbox"]{
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin-top: 2px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--bg-card);
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
  }

  .title-row input[type="checkbox"]:checked{
    background: var(--gold);
    border-color: var(--gold);
  }

  .title-row input[type="checkbox"]:checked::after{
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .title-row label{
    font-size: 14.5px;
    line-height: 1.35;
    min-width: 0;
    cursor: pointer;
  }

  .title-row .star{
    color: var(--gold);
    font-size: 12px;
    margin-left: 4px;
    white-space: nowrap;
  }

  .title-row.watched label{
    color: var(--watched);
    text-decoration: line-through;
  }

  .title-row.watched .star{
    color: var(--watched);
  }

  .title-row .ww-flag{
    color: var(--ww-flag);
    font-size: 12px;
    margin-left: 4px;
    white-space: nowrap;
  }

  .title-row.watched .ww-flag{
    color: var(--watched);
  }

  .title-row.ww label{
    color: var(--ww-flag);
  }

  .title-row.ww.watched label{
    color: var(--watched);
  }

  .legend{
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 6px;
    margin-bottom: 26px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .legend span{ color: var(--gold); }

  .legend span.legend-ww{ color: var(--ww-flag); }

  @media (max-width: 560px){
    .title-grid{
      grid-template-columns: repeat(2, 1fr);
    }
    .page-head h1{ font-size: 27px; }
  }

  @media (max-width: 400px){
    .title-grid{
      grid-template-columns: 1fr;
    }
  }
</style>

  var API_BASE = "https://movie-reservations.iconedge.workers.dev";

  /*
   * `watched` is an in-memory mirror of the classics_watched table -
   * the checked-off state is the only thing this page persists on
   * the server (the 1,455 titles above ship with the page itself,
   * same as the rest of the site's no-metadata approach). It starts
   * empty so the page renders instantly, then gets filled in once
   * GET /classics-watched resolves (see loadWatchedFromServer below)
   * and the page re-renders with the real state.
   */
  var watched = {};

  function keyFor(year, title){
    return year + "::" + title;
  }

  function setSyncStatus(text){
    var el = document.getElementById("sync-status");
    if (el) el.textContent = text;
  }

  function loadWatchedFromServer(){
    return fetch(API_BASE + "/classics-watched")
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(rows){
        watched = {};
        rows.forEach(function(row){
          watched[keyFor(row.year, row.title)] = true;
        });
        render();
        setSyncStatus("Synced.");
      })
      .catch(function(err){
        console.error("Failed to load classics-watched:", err);
        setSyncStatus("Couldn't reach the server - checking things off won't be saved right now.");
      });
  }

  function postWatched(year, title, isWatched){
    var url = API_BASE + "/classics-watched";
    var options = isWatched
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ year: year, title: title }) }
      : { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ year: year, title: title }) };

    return fetch(url, options)
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
      })
      .catch(function(err){
        console.error("Failed to save watched state for", title, err);
        setSyncStatus("Couldn't save that last change - it may not stick after a refresh.");
      });
  }

  function updateProgress(){
    var total = 0, done = 0;
    DECADES.forEach(function(d){
      d.years.forEach(function(y){
        y.titles.forEach(function(item){
          total++;
          if (watched[keyFor(y.year, item.t)]) done++;
        });
      });
    });
    document.getElementById("total-count").textContent = total;
    document.getElementById("watched-count").textContent = done;

    decadeMetaRefs.forEach(function(ref){
      ref.el.textContent = decadeMetaText(ref.d);
    });
  }

  // Filters title rows by a case-insensitive substring match,
  // hiding empty years/decades and auto-expanding decades that
  // still have a match. Clearing the box restores everything to
  // its normal collapsed state.
  function applySearch(rawQuery){
    var query = rawQuery.trim().toLowerCase();
    searchActive = query.length > 0;

    document.querySelectorAll("details.decade").forEach(function(details){
      var decadeHasMatch = false;

      details.querySelectorAll(".year-block").forEach(function(yearBlock){
        var yearHasMatch = false;

        yearBlock.querySelectorAll(".title-row").forEach(function(row){
          var label = row.querySelector("label");
          var text = label ? label.textContent.toLowerCase() : "";
          var isMatch = !searchActive || text.indexOf(query) !== -1;
          row.style.display = isMatch ? "" : "none";
          if (isMatch) yearHasMatch = true;
        });

        yearBlock.style.display = (!searchActive || yearHasMatch) ? "" : "none";
        if (yearHasMatch) decadeHasMatch = true;
      });

      if (searchActive){
        details.style.display = decadeHasMatch ? "" : "none";
        details.open = decadeHasMatch;
      } else {
        details.style.display = "";
        details.open = false;
      }
    });
  }

  var searchInput = document.getElementById("title-search");
  if (searchInput){
    searchInput.addEventListener("input", function(){
      applySearch(searchInput.value);
    });
  }

  function buildYearBlock(y){
    var block = document.createElement("div");
    block.className = "year-block";

    var heading = document.createElement("div");
    heading.className = "year-heading";
    heading.innerHTML =
      '<span class="year">' + y.year + '</span>' +
      '<span class="rule"></span>' +
      '<span class="year-count">' + y.titles.length + ' titles</span>';
    block.appendChild(heading);

    var grid = document.createElement("div");
    grid.className = "title-grid";

    y.titles.forEach(function(item, idx){
      var id = "cb-" + y.year + "-" + idx;
      var row = document.createElement("div");
      row.className = "title-row";

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = id;
      var k = keyFor(y.year, item.t);
      cb.checked = !!watched[k];
      if (cb.checked) row.classList.add("watched");

      cb.addEventListener("change", function(){
        if (cb.checked){
          watched[k] = true;
        } else {
          delete watched[k];
        }
        row.classList.toggle("watched", cb.checked);
        updateProgress();
        postWatched(y.year, item.t, cb.checked);
      });

      if (item.ww){
        row.classList.add("ww");
      }

      var label = document.createElement("label");
      label.setAttribute("for", id);
      label.textContent = item.t;
      if (item.oscar){
        var star = document.createElement("span");
        star.className = "star";
        star.textContent = "★";
        label.appendChild(star);
      }
      if (item.ww){
        var wwFlag = document.createElement("span");
        wwFlag.className = "ww-flag";
        wwFlag.textContent = "⚔";
        label.appendChild(wwFlag);
      }

      row.appendChild(cb);
      row.appendChild(label);
      grid.appendChild(row);
    });

    block.appendChild(grid);
    return block;
  }

  function decadeTitleCount(d){
    var count = 0;
    d.years.forEach(function(y){ count += y.titles.length; });
    return count;
  }

  function decadeWatchedCount(d){
    var done = 0;
    d.years.forEach(function(y){
      y.titles.forEach(function(item){
        if (watched[keyFor(y.year, item.t)]) done++;
      });
    });
    return done;
  }

  function decadeMetaText(d){
    var total = decadeTitleCount(d);
    if (total === 0) return "not filled in yet";
    return decadeWatchedCount(d) + " of " + total + " watched";
  }

  // Refs to each decade's meta span, refreshed by updateProgress()
  // whenever a checkbox changes, so the collapsed summary line
  // stays accurate without a full re-render.
  var decadeMetaRefs = [];

  // True while the search box has text in it - lets the toggle
  // listener below know to leave multiple decades open together
  // (search results) instead of enforcing the normal one-at-a-time
  // accordion behavior.
  var searchActive = false;

  function render(){
    var container = document.getElementById("year-container");
    container.innerHTML = "";
    decadeMetaRefs = [];

    DECADES.forEach(function(d){
      var details = document.createElement("details");
      details.className = "decade";

      var summary = document.createElement("summary");
      summary.innerHTML =
        '<span class="chevron">▸</span>' +
        '<span class="decade-label">' + d.label + '</span>';

      var meta = document.createElement("span");
      meta.className = "decade-meta";
      meta.textContent = decadeMetaText(d);
      summary.appendChild(meta);
      decadeMetaRefs.push({ d: d, el: meta });

      details.appendChild(summary);

      var body = document.createElement("div");
      body.className = "decade-body";

      if (d.years.length > 0){
        d.years.forEach(function(y){
          body.appendChild(buildYearBlock(y));
        });
      } else {
        var empty = document.createElement("div");
        empty.className = "decade-empty";
        empty.textContent = d.note || "Not filled in yet.";
        body.appendChild(empty);
      }

      /*
       * Accordion behavior: opening one decade closes any other
       * open decade, so only one is ever expanded at a time.
       * The "toggle" event fires whenever [open] changes, in
       * either direction, so this only acts when THIS details
       * just opened (not on every one closing).
       */
      details.addEventListener("toggle", function(){
        if (!details.open) return;
        if (searchActive) return;
        container.querySelectorAll("details.decade[open]").forEach(function(other){
          if (other !== details) other.open = false;
        });
      });

      details.appendChild(body);
      container.appendChild(details);
    });

    updateProgress();
  }

  render();
  loadWatchedFromServer();

  /*
   * One-time backfill — walks every title in DECADES in batches of
   * 40 (matched to the Worker's per-request cap in
   * POST /classics-backfill-batch), asking it to cross-reference
   * each one against the Letterboxd-synced watched list. Safe to
   * click more than once (it only ever adds matches), but there's
   * no need to run it again after the first pass unless a lot of
   * new titles get added to the list later.
   */

  var BACKFILL_BATCH_SIZE = 40;

  function flattenAllTitles(){
    var all = [];
    DECADES.forEach(function(d){
      d.years.forEach(function(y){
        y.titles.forEach(function(item){
          all.push({ year: y.year, title: item.t });
        });
      });
    });
    return all;
  }

  function runBackfill(){
    var allTitles = flattenAllTitles();
    var batches = [];
    for (var i = 0; i < allTitles.length; i += BACKFILL_BATCH_SIZE){
      batches.push(allTitles.slice(i, i + BACKFILL_BATCH_SIZE));
    }

    var backfillButton = document.getElementById("backfill-button");
    backfillButton.disabled = true;

    var checked = 0;
    var totalMatched = 0;

    function runNextBatch(index){
      if (index >= batches.length){
        setSyncStatus(
          "Backfill complete — checked " + checked + " titles, matched " + totalMatched + " against your watched list."
        );
        backfillButton.disabled = false;
        loadWatchedFromServer();
        return;
      }

      var batch = batches[index];
      setSyncStatus(
        "Backfilling… " + checked + " / " + allTitles.length + " checked so far"
      );

      fetch(API_BASE + "/classics-backfill-batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: batch })
      })
        .then(function(res){
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(result){
          checked += batch.length;
          totalMatched += (result.matched || []).length;
          runNextBatch(index + 1);
        })
        .catch(function(err){
          console.error("Backfill batch failed:", err);
          setSyncStatus(
            "Backfill stopped early after an error — checked " + checked + " of " + allTitles.length + " so far. Safe to try again."
          );
          backfillButton.disabled = false;
        });
    }

    runNextBatch(0);
  }

  document.getElementById("backfill-button").addEventListener("click", runBackfill);
})();
</script>
</body>
</html>
