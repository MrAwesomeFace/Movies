          }}

          .candidate {{
            padding: 8px 10px;
            border-bottom: 1px solid #e5e7eb;
          }}

          .candidate:last-child {{
            border-bottom: 0;
          }}

          .candidate strong {{
            display: block;
          }}

          .candidate span {{
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-top: 2px;
          }}

          .decision {{
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 20px;
          }}

          .accept {{
            background: #16a34a;
            color: white;
          }}

          .reject {{
            background: #dc2626;
            color: white;
          }}

          .manual {{
            background: #f59e0b;
            color: white;
          }}

          .decision-label {{
            margin-left: 8px;
            font-weight: 700;
          }}

          .empty {{
            text-align: center;
            padding: 50px;
            color: #6b7280;
          }}

          @media (max-width: 700px) {{
            .proposal {{
              grid-template-columns: 1fr;
            }}

            .arrow {{
              transform: rotate(90deg);
              text-align: center;
            }}
          }}
          </style>
          </head>

          <body>

          <header>
            <h1>Inventory Cleanup Review</h1>
            <p>
              Review proposed TMDB matches before anything
              is added to movies.js.
            </p>

            <div class="toolbar">
              <button onclick="acceptAllMatches()">
                Accept All High-Confidence Matches
              </button>

              <button
                class="warning"
                onclick="clearAll()">
                Clear Decisions
              </button>

              <button
                class="primary"
                onclick="downloadApproved()">
                Export Approved Changes
              </button>
            </div>
          </header>

          <div id="summary"></div>

          <main>
            {''.join(html_items)}
          </main>

          <script>

          const items = {data_json};

          const decisions = {{}};

          items.forEach((item, index) => {{
            if (item.default_decision === "ACCEPT") {{
              decisions[index] = "ACCEPT";
            }}
          }});

          function setDecision(index, decision) {{
            decisions[index] = decision;

            const item =
              document.querySelector(
                '[data-index="' + index + '"]'
              );

            const label =
              document.getElementById(
                "decision-" + index
              );

            item.classList.remove(
              "accepted",
              "rejected",
              "manual"
            );

            if (decision === "ACCEPT") {{
              item.classList.add("accepted");
              label.textContent = "✓ ACCEPTED";
              label.style.color = "#166534";
            }}

            else if (decision === "REJECT") {{
              item.classList.add("rejected");
              label.textContent = "✕ REJECTED";
              label.style.color = "#991b1b";
            }}

            else {{
              item.classList.add("manual");
              label.textContent =
                "? MANUAL REVIEW";
              label.style.color = "#92400e";
            }}

            updateSummary();
          }}


          function acceptAllMatches() {{
            items.forEach((item, index) => {{
              if (
                item.status === "MATCH" &&
                item.tmdbId !== null
              ) {{
                setDecision(
                  index,
                  "ACCEPT"
                );
              }}
            }});
          }}


          function clearAll() {{
            Object.keys(decisions).forEach(
              key => delete decisions[key]
            );

            items.forEach((item, index) => {{
              const el =
                document.querySelector(
                  '[data-index="' + index + '"]'
                );

              const label =
                document.getElementById(
                  "decision-" + index
                );

              el.classList.remove(
                "accepted",
                "rejected",
                "manual"
              );

              label.textContent = "";
            }});

            updateSummary();
          }}


          function updateSummary() {{

            let accepted = 0;
            let rejected = 0;
            let manual = 0;
            let undecided = 0;

            items.forEach((item, index) => {{

              const decision =
                decisions[index];

              if (decision === "ACCEPT")
                accepted++;

              else if (decision === "REJECT")
                rejected++;

              else if (
                decision === "MANUAL_REVIEW"
              )
                manual++;

              else
                undecided++;
            }});

            document.getElementById(
              "summary"
            ).textContent =
              "Total: " + items.length +
              " · Accepted: " + accepted +
              " · Rejected: " + rejected +
              " · Manual Review: " + manual +
              " · Undecided: " + undecided;
          }}


          function downloadApproved() {{

            const approved = [];

            items.forEach((item, index) => {{

              if (
                decisions[index] === "ACCEPT"
              ) {{

                approved.push({{
                  source_title:
                    item.source_title,

                  format:
                    item.format,

                  special:
                    item.special || null,

                  tmdbId:
                    item.tmdbId,

                  tmdbTitle:
                    item.tmdbTitle,

                  type:
                    item.type,

                  action:
                    item.action,

                  score:
                    item.score
                }});
              }}
            }});

            const output = {{
              generated_at:
                new Date().toISOString(),

              approved_count:
                approved.length,

              approved:
                approved
            }};

            const blob =
              new Blob(
                [
                  JSON.stringify(
                    output,
                    null,
                    2
                  )
                ],
                {{
                  type:
                    "application/json"
                }}
              );

            const url =
              URL.createObjectURL(blob);

            const a =
              document.createElement("a");

            a.href = url;

            a.download =
              "inventory_cleanup_approved.json";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);
          }}

          updateSummary();

          </script>

          </body>
          </html>
          """

          HTML_FILE.write_text(
              review_html,
              encoding="utf-8"
          )


          # =========================================================
          # FINAL CONSOLE OUTPUT
          # =========================================================

          print("")
          print("=" * 60)
          print("INVENTORY CLEANUP REVIEW COMPLETE")
          print("=" * 60)
          print("")
          print(
              f"Processed {len(addition_matches)} "
              f"inventory additions."
          )
          print("")
          print(
              "Created:"
          )
          print(
              "  inventory_cleanup_report.md"
          )
          print(
              "  inventory_cleanup_results.json"
          )
          print(
              "  inventory_cleanup_review.html"
          )
          print("")
          print(
              "No changes were made to movies.js."
          )
          print("")


      - name: Upload cleanup review files
        uses: actions/upload-artifact@v4
        with:
          name: inventory-cleanup-review
          path: |
            inventory_cleanup_report.md
            inventory_cleanup_results.json
            inventory_cleanup_review.html

