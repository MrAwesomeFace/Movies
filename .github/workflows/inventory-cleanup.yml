name: Inventory Cleanup - TMDB Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run inventory cleanup review
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python <<'PYTHON'
          import json
          import re
          import os
          import html
          import requests
          from difflib import SequenceMatcher
          from pathlib import Path
          from datetime import datetime, timezone

          TMDB_API_KEY = os.environ["TMDB_API_KEY"]

          MOVIES_FILE = Path("movies.js")
          INPUT_FILE = Path("inventory_cleanup.json")

          REPORT_FILE = Path("inventory_cleanup_report.md")
          RESULTS_FILE = Path("inventory_cleanup_results.json")
          HTML_FILE = Path("inventory_cleanup_review.html")

          API_BASE = "https://api.themoviedb.org/3"

          headers = {
              "Authorization": f"Bearer {TMDB_API_KEY}",
              "accept": "application/json"
          }

          session = requests.Session()
          session.headers.update(headers)

          # =========================================================
          # HELPERS
          # =========================================================

          def normalize(text):
              if not text:
                  return ""

              text = str(text).lower()

              text = text.replace("&", " and ")
              text = text.replace("’", "'")
              text = text.replace("–", "-")
              text = text.replace("—", "-")

              text = re.sub(r"[^a-z0-9]+", " ", text)

              return " ".join(text.split())


          def similarity(a, b):
              return SequenceMatcher(
                  None,
                  normalize(a),
                  normalize(b)
              ).ratio()


          def clean_title(title):
              title = title.strip()

              if title.lower().startswith("the "):
                  return title[4:] + ", The"

              return title


          def load_movies():
              text = MOVIES_FILE.read_text(encoding="utf-8")

              start = text.find("[")
              end = text.rfind("]")

              if start == -1 or end == -1:
                  raise RuntimeError(
                      "Could not locate movies array in movies.js"
                  )

              return json.loads(text[start:end + 1])


          def tmdb_get(endpoint, params=None):
              url = f"{API_BASE}{endpoint}"

              response = session.get(
                  url,
                  params=params or {},
                  timeout=30
              )

              response.raise_for_status()

              return response.json()


          def tmdb_search_movie(title):
              data = tmdb_get(
                  "/search/movie",
                  {
                      "query": title,
                      "include_adult": "false",
                      "language": "en-US"
                  }
              )

              return data.get("results", [])


          def tmdb_search_tv(title):
              data = tmdb_get(
                  "/search/tv",
                  {
                      "query": title,
                      "include_adult": "false",
                      "language": "en-US"
                  }
              )

              return data.get("results", [])


          def tmdb_movie_details(tmdb_id):
              try:
                  return tmdb_get(
                      f"/movie/{tmdb_id}",
                      {
                          "language": "en-US"
                      }
                  )
              except Exception:
                  return {}


          def tmdb_tv_details(tmdb_id):
              try:
                  return tmdb_get(
                      f"/tv/{tmdb_id}",
                      {
                          "language": "en-US"
                      }
                  )
              except Exception:
                  return {}


          def tmdb_tv_season(tmdb_id, season_number):
              try:
                  return tmdb_get(
                      f"/tv/{tmdb_id}/season/{season_number}",
                      {
                          "language": "en-US"
                      }
                  )
              except Exception:
                  return None


          # =========================================================
          # TITLE / SEASON PARSING
          # =========================================================

          SEASON_PATTERNS = [
              re.compile(
                  r"^(.*?)[\s\-_:]*(?:season|s)\s*0*(\d+)\s*$",
                  re.IGNORECASE
              ),
              re.compile(
                  r"^(.*?)\s+(\d+)\s*$",
                  re.IGNORECASE
              )
          ]


          def parse_tv_season(title):
              """
              Detect common forms such as:

                  Friends Season 4
                  Friends season 04
                  Friends S4
                  Friends S04
                  Friends - Season 4
                  Friends 4

              The bare-number form is only treated as a season when
              the surrounding title strongly resembles a TV show.
              """

              original = title.strip()

              for pattern in SEASON_PATTERNS[:1]:
                  match = pattern.match(original)

                  if match:
                      show_title = match.group(1).strip()
                      season_number = int(match.group(2))

                      if show_title:
                          return {
                              "is_tv_season": True,
                              "show_title": show_title,
                              "season": season_number
                          }

              return {
                  "is_tv_season": False,
                  "show_title": original,
                  "season": None
              }


          # =========================================================
          # MATCH SCORING
          # =========================================================

          def candidate_score(source_title, result, media_type="movie"):
              if media_type == "tv":
                  result_title = (
                      result.get("name")
                      or result.get("original_name")
                      or ""
                  )
              else:
                  result_title = (
                      result.get("title")
                      or result.get("original_title")
                      or ""
                  )

              source_normalized = normalize(source_title)
              result_normalized = normalize(result_title)

              score = similarity(
                  source_title,
                  result_title
              )

              # Exact normalized title.
              if source_normalized == result_normalized:
                  score += 0.40

              # One title containing the other is useful, but not enough
              # to guarantee a match.
              elif (
                  source_normalized in result_normalized
                  or result_normalized in source_normalized
              ):
                  score += 0.08

              return min(score, 1.0)


          def result_title(result, media_type):
              if media_type == "tv":
                  return (
                      result.get("name")
                      or result.get("original_name")
                      or ""
                  )

              return (
                  result.get("title")
                  or result.get("original_title")
                  or ""
              )


          def release_date(result, media_type):
              if media_type == "tv":
                  return result.get("first_air_date") or ""

              return result.get("release_date") or ""


          def prepare_movie_candidates(title, special=None):
              results = tmdb_search_movie(title)

              scored = []

              for result in results:
                  result = dict(result)

                  result["_match_score"] = candidate_score(
                      title,
                      result,
                      "movie"
                  )

                  scored.append(result)

              scored.sort(
                  key=lambda x: x["_match_score"],
                  reverse=True
              )

              # Keep enough candidates for human selection.
              return scored[:8]


          def prepare_tv_candidates(show_title):
              results = tmdb_search_tv(show_title)

              scored = []

              for result in results:
                  result = dict(result)

                  result["_match_score"] = candidate_score(
                      show_title,
                      result,
                      "tv"
                  )

                  scored.append(result)

              scored.sort(
                  key=lambda x: x["_match_score"],
                  reverse=True
              )

              return scored[:8]


          def determine_status(candidates, special=None):
              if not candidates:
                  return "NO_RESULTS"

              best = candidates[0]

              threshold = 0.78

              if special:
                  threshold = 0.82

              if best["_match_score"] < threshold:
                  return "REVIEW"

              if len(candidates) > 1:
                  gap = (
                      best["_match_score"]
                      - candidates[1]["_match_score"]
                  )

                  # Small score gaps are deliberately treated as
                  # ambiguous instead of automatically accepted.
                  if gap < 0.10:
                      return "REVIEW"

              return "MATCH"


          # =========================================================
          # LOAD DATA
          # =========================================================

          print("Loading movies.js...")
          movies = load_movies()

          print(f"Loaded {len(movies)} catalog records.")

          print("Loading inventory cleanup instructions...")

          instructions = json.loads(
              INPUT_FILE.read_text(encoding="utf-8")
          )

          additions = instructions.get("add", [])
          removals = instructions.get("remove", [])
          the_fixes = instructions.get("move_the_to_end", [])
          tmdb_corrections = instructions.get(
              "tmdb_corrections",
              []
          )

          print(f"Additions: {len(additions)}")
          print(f"Removals: {len(removals)}")
          print(f"The fixes: {len(the_fixes)}")
          print(f"TMDB corrections: {len(tmdb_corrections)}")


          # =========================================================
          # EXISTING CATALOG INDEXES
          # =========================================================

          by_tmdb = {}

          for movie in movies:
              tmdb_id = movie.get("tmdbId")

              if tmdb_id is not None:
                  by_tmdb.setdefault(
                      str(tmdb_id),
                      []
                  ).append(movie)


          # =========================================================
          # MACHINE-READABLE REVIEW DATA
          # =========================================================

          review_items = []

          item_counter = 0

          def next_item_id():
              global item_counter
              item_counter += 1
              return f"review-{item_counter:04d}"


          # =========================================================
          # ADDITIONS
          # =========================================================

          print("")
          print("=" * 60)
          print("PROCESSING ADDITIONS")
          print("=" * 60)

          for index, item in enumerate(additions, 1):

              source_title = item["title"]
              fmt = item.get("format", "")
              special = item.get("special")

              print(
                  f"[ADD {index}/{len(additions)}] "
                  f"{source_title} ({fmt})"
              )

              parsed = parse_tv_season(source_title)

              # -----------------------------------------------------
              # TV SEASON
              # -----------------------------------------------------

              if parsed["is_tv_season"]:

                  show_title = parsed["show_title"]
                  season_number = parsed["season"]

                  candidates = prepare_tv_candidates(
                      show_title
                  )

                  status = determine_status(
                      candidates,
                      special
                  )

                  enriched_candidates = []

                  for candidate in candidates:

                      candidate_id = candidate.get("id")

                      details = tmdb_tv_details(
                          candidate_id
                      )

                      number_of_seasons = details.get(
                          "number_of_seasons"
                      )

                      season = tmdb_tv_season(
                          candidate_id,
                          season_number
                      )

                      season_exists = season is not None

                      c = {
                          "tmdbId": candidate_id,
                          "tmdbTitle": result_title(
                              candidate,
                              "tv"
                          ),
                          "type": "tv",
                          "score": candidate["_match_score"],
                          "first_air_date": release_date(
                              candidate,
                              "tv"
                          ),
                          "number_of_seasons":
                              number_of_seasons,
                          "season": season_number,
                          "season_exists": season_exists
                      }

                      # A candidate that does not contain the
                      # requested season should not be treated as a
                      # valid automatic match.
                      if not season_exists:
                          c["invalid_for_requested_season"] = True

                      enriched_candidates.append(c)

                  valid_candidates = [
                      c
                      for c in enriched_candidates
                      if not c.get(
                          "invalid_for_requested_season"
                      )
                  ]

                  if not valid_candidates:
                      status = "REVIEW"

                  elif len(valid_candidates) > 1:
                      best = valid_candidates[0]

                      if (
                          best["score"]
                          - valid_candidates[1]["score"]
                          < 0.10
                      ):
                          status = "REVIEW"

                  best = (
                      valid_candidates[0]
                      if valid_candidates
                      else None
                  )

                  action = (
                      "ADD_FORMAT_TO_EXISTING"
                      if best
                      and str(best["tmdbId"]) in by_tmdb
                      else "CREATE_NEW_RECORD"
                  )

                  review_items.append({
                      "id": next_item_id(),
                      "category": "addition",
                      "source_title": source_title,
                      "format": fmt,
                      "special": special,
                      "type": "tv",
                      "season": season_number,
                      "show_title": show_title,
                      "status": status,
                      "action": action,
                      "selected": (
                          best["tmdbId"]
                          if best
                          else None
                      ),
                      "selected_tmdbTitle": (
                          best["tmdbTitle"]
                          if best
                          else None
                      ),
                      "selected_score": (
                          best["score"]
                          if best
                          else 0
                      ),
                      "candidates": enriched_candidates
                  })

                  continue

              # -----------------------------------------------------
              # MOVIE
              # -----------------------------------------------------

              candidates = prepare_movie_candidates(
                  source_title,
                  special
              )

              status = determine_status(
                  candidates,
                  special
              )

              enriched_candidates = []

              for candidate in candidates:

                  tmdb_id = candidate.get("id")

                  details = tmdb_movie_details(
                      tmdb_id
                  )

                  c = {
                      "tmdbId": tmdb_id,
                      "tmdbTitle": result_title(
                          candidate,
                          "movie"
                      ),
                      "type": "movie",
                      "score": candidate["_match_score"],
                      "release_date": release_date(
                          candidate,
                          "movie"
                      ),
                      "overview": (
                          details.get("overview")
                          or candidate.get("overview")
                          or ""
                      )
                  }

                  enriched_candidates.append(c)

              best = (
                  enriched_candidates[0]
                  if enriched_candidates
                  else None
              )

              action = (
                  "ADD_FORMAT_TO_EXISTING"
                  if best
                  and str(best["tmdbId"]) in by_tmdb
                  else "CREATE_NEW_RECORD"
              )

              review_items.append({
                  "id": next_item_id(),
                  "category": "addition",
                  "source_title": source_title,
                  "format": fmt,
                  "special": special,
                  "type": "movie",
                  "season": None,
                  "show_title": None,
                  "status": status,
                  "action": action,
                  "selected": (
                      best["tmdbId"]
                      if best
                      else None
                  ),
                  "selected_tmdbTitle": (
                      best["tmdbTitle"]
                      if best
                      else None
                  ),
                  "selected_score": (
                      best["score"]
                      if best
                      else 0
                  ),
                  "candidates": enriched_candidates
              })


          # =========================================================
          # EXISTING CATALOG TITLE INDEX
          # =========================================================

          normalized_catalog_titles = [
              (
                  movie,
                  normalize(movie.get("title", "")),
                  normalize(movie.get("tmdbTitle", ""))
              )
              for movie in movies
          ]


          # =========================================================
          # REMOVALS
          # =========================================================

          removal_results = []

          for title in removals:

              target = normalize(title)

              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                      or similarity(
                          title,
                          movie.get("title", "")
                      ) >= 0.92
                  ):
                      matches.append(movie)

              if len(matches) == 1:
                  status = "MATCH"
              elif len(matches) > 1:
                  status = "REVIEW"
              else:
                  status = "NO_RESULTS"

              removal_results.append({
                  "title": title,
                  "status": status,
                  "matches": [
                      {
                          "title": m.get("title"),
                          "tmdbId": m.get("tmdbId")
                      }
                      for m in matches
                  ]
              })


          # =========================================================
          # THE FIXES
          # =========================================================

          the_results = []

          for title in the_fixes:

              target = normalize(title)

              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                  ):
                      matches.append(movie)

              new_title = clean_title(title)

              if len(matches) == 1:
                  status = "MATCH"
              elif len(matches) > 1:
                  status = "REVIEW"
              else:
                  status = "NO_RESULTS"

              the_results.append({
                  "title": title,
                  "new_title": new_title,
                  "status": status,
                  "matches": [
                      {
                          "title": m.get("title"),
                          "tmdbId": m.get("tmdbId")
                      }
                      for m in matches
                  ]
              })


          # =========================================================
          # TMDB CORRECTIONS
          # =========================================================

          correction_results = []

          for correction in tmdb_corrections:

              title = correction["title"]
              instruction = correction.get(
                  "instruction",
                  ""
              )

              target = normalize(title)

              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                      or similarity(
                          title,
                          movie.get("title", "")
                      ) >= 0.90
                  ):
                      matches.append(movie)

              if len(matches) != 1:

                  correction_results.append({
                      "title": title,
                      "instruction": instruction,
                      "status": "REVIEW",
                      "catalog_matches": [
                          {
                              "title": m.get("title"),
                              "tmdbId": m.get("tmdbId")
                          }
                          for m in matches
                      ],
                      "candidates": []
                  })

                  continue

              current = matches[0]

              parsed = parse_tv_season(title)

              if parsed["is_tv_season"]:
                  candidates = prepare_tv_candidates(
                      parsed["show_title"]
                  )
                  media_type = "tv"
                  search_title = parsed["show_title"]
              else:
                  candidates = prepare_movie_candidates(
                      title,
                      instruction
                  )
                  media_type = "movie"
                  search_title = title

              enriched = []

              for candidate in candidates:

                  tmdb_id = candidate.get("id")

                  if media_type == "tv":
                      tmdb_title = result_title(
                          candidate,
                          "tv"
                      )
                      date = release_date(
                          candidate,
                          "tv"
                      )
                  else:
                      tmdb_title = result_title(
                          candidate,
                          "movie"
                      )
                      date = release_date(
                          candidate,
                          "movie"
                      )

                  enriched.append({
                      "tmdbId": tmdb_id,
                      "tmdbTitle": tmdb_title,
                      "type": media_type,
                      "score": candidate["_match_score"],
                      "release_date": date
                  })

              status = determine_status(
                  candidates,
                  instruction
              )

              correction_results.append({
                  "title": title,
                  "instruction": instruction,
                  "status": status,
                  "current": {
                      "title": current.get("title"),
                      "tmdbId": current.get("tmdbId")
                  },
                  "candidates": enriched
              })


          # =========================================================
          # RESULTS JSON
          # =========================================================

          results = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "catalog_count": len(movies),

              "review_items": review_items,

              "removals": removal_results,

              "the_fixes": the_results,

              "tmdb_corrections": correction_results
          }

          RESULTS_FILE.write_text(
              json.dumps(
                  results,
                  indent=2
              ),
              encoding="utf-8"
          )


          # =========================================================
          # MARKDOWN REPORT
          # =========================================================

          report = []

          report.append("# Inventory Cleanup TMDB Review")
          report.append("")
          report.append(
              "**REPORT ONLY — no changes were made to `movies.js`.**"
          )
          report.append("")
          report.append(
              f"- Existing catalog records: **{len(movies)}**"
          )
          report.append(
              f"- Inventory additions: **{len(additions)}**"
          )
          report.append(
              f"- Explicit removals: **{len(removals)}**"
          )
          report.append(
              f"- Alphabetical `The` fixes: **{len(the_fixes)}**"
          )
          report.append(
              f"- TMDB corrections: **{len(tmdb_corrections)}**"
          )
          report.append("")

          report.append("## ADDITIONS")
          report.append("")

          for item in review_items:

              report.append(
                  f"### {item['source_title']}"
              )

              if item.get("season") is not None:
                  report.append(
                      f"- TV show: `{item['show_title']}`"
                  )
                  report.append(
                      f"- Season: `{item['season']}`"
                  )

              report.append(
                  f"- Format: `{item['format']}`"
              )

              report.append(
                  f"- Status: **{item['status']}**"
              )

              if item.get("special"):
                  report.append(
                      f"- Special instruction: "
                      f"{item['special']}"
                  )

              report.append(
                  f"- Candidates: "
                  f"**{len(item['candidates'])}**"
              )

              for candidate in item["candidates"][:5]:

                  season_note = ""

                  if candidate.get("season") is not None:
                      season_note = (
                          f" — Season "
                          f"{candidate['season']} "
                          f"{'FOUND' if candidate.get('season_exists') else 'NOT FOUND'}"
                      )

                  report.append(
                      f"- `{candidate['tmdbId']}` "
                      f"{candidate['tmdbTitle']} "
                      f"score "
                      f"`{candidate['score']:.3f}`"
                      f"{season_note}"
                  )

              report.append("")

          report.append("## REMOVALS")
          report.append("")

          for item in removal_results:

              report.append(
                  f"### {item['title']}"
              )

              report.append(
                  f"- Status: **{item['status']}**"
              )

              for match in item["matches"]:

                  report.append(
                      f"- `{match['tmdbId']}` "
                      f"{match['title']}"
                  )

              report.append("")

          report.append("## ALPHABETICAL `THE` FIXES")
          report.append("")

          for item in the_results:

              report.append(
                  f"### {item['title']}"
              )

              report.append(
                  f"- Proposed title: "
                  f"**{item['new_title']}**"
              )

              report.append(
                  f"- Status: **{item['status']}**"
              )

              report.append("")

          report.append("## TMDB CORRECTIONS")
          report.append("")

          for item in correction_results:

              report.append(
                  f"### {item['title']}"
              )

              report.append(
                  f"- Instruction: "
                  f"{item['instruction']}"
              )

              report.append(
                  f"- Status: **{item['status']}**"
              )

              if item.get("current"):
                  report.append(
                      f"- Current catalog record: "
                      f"`{item['current']['title']}`"
                  )

                  report.append(
                      f"- Current TMDB ID: "
                      f"`{item['current']['tmdbId']}`"
                  )

              for candidate in item.get(
                  "candidates",
                  []
              )[:5]:

                  report.append(
                      f"- `{candidate['tmdbId']}` "
                      f"{candidate['tmdbTitle']} "
                      f"score "
                      f"`{candidate['score']:.3f}`"
                  )

              report.append("")

          report.append("## IMPORTANT")
          report.append("")
          report.append(
              "This workflow intentionally made **NO CHANGES** "
              "to `movies.js`."
          )
          report.append("")
          report.append(
              "Use the interactive HTML review to choose "
              "specific candidates."
          )

          REPORT_FILE.write_text(
              "\n".join(report),
              encoding="utf-8"
          )


          # =========================================================
          # INTERACTIVE HTML REVIEW
          # =========================================================

          def esc(value):
              return html.escape(
                  str(value if value is not None else "")
              )


          html_parts = []

          html_parts.append("""
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Inventory Cleanup Review</title>

          <style>
          body {
              font-family: Arial, sans-serif;
              margin: 0;
              background: #f3f4f6;
              color: #222;
          }

          header {
              background: #111827;
              color: white;
              padding: 24px;
              position: sticky;
              top: 0;
              z-index: 10;
              box-shadow: 0 2px 8px rgba(0,0,0,.2);
          }

          header h1 {
              margin: 0 0 8px 0;
          }

          .stats {
              display: flex;
              gap: 20px;
              flex-wrap: wrap;
              font-size: 14px;
          }

          .controls {
              padding: 18px 24px;
              background: white;
              border-bottom: 1px solid #ddd;
              position: sticky;
              top: 91px;
              z-index: 9;
          }

          button {
              border: 0;
              border-radius: 6px;
              padding: 10px 15px;
              cursor: pointer;
              font-weight: bold;
          }

          .approve {
              background: #166534;
              color: white;
          }

          .manual {
              background: #92400e;
              color: white;
          }

          .download {
              background: #1d4ed8;
              color: white;
          }

          .filter {
              background: #374151;
              color: white;
              margin-right: 6px;
          }

          main {
              max-width: 1200px;
              margin: 24px auto;
              padding: 0 18px;
          }

          .item {
              background: white;
              border-radius: 10px;
              margin-bottom: 20px;
              padding: 20px;
              box-shadow: 0 1px 4px rgba(0,0,0,.12);
              border-left: 6px solid #9ca3af;
          }

          .item.match {
              border-left-color: #16a34a;
          }

          .item.review {
              border-left-color: #f59e0b;
          }

          .item.no-results {
              border-left-color: #dc2626;
          }

          .item h2 {
              margin-top: 0;
          }

          .meta {
              color: #555;
              margin-bottom: 14px;
          }

          .candidate {
              border: 2px solid #ddd;
              border-radius: 8px;
              padding: 14px;
              margin: 10px 0;
              cursor: pointer;
          }

          .candidate:hover {
              border-color: #2563eb;
              background: #f8fafc;
          }

          .candidate.selected {
              border-color: #2563eb;
              background: #eff6ff;
          }

          .candidate.invalid {
              opacity: .55;
              background: #fef2f2;
          }

          .candidate-title {
              font-size: 18px;
              font-weight: bold;
          }

          .candidate-details {
              font-size: 13px;
              color: #555;
              margin-top: 5px;
          }

          .candidate-overview {
              margin-top: 8px;
              font-size: 14px;
              line-height: 1.4;
          }

          .decision {
              margin-top: 15px;
              padding-top: 15px;
              border-top: 1px solid #ddd;
          }

          .status {
              display: inline-block;
              padding: 4px 8px;
              border-radius: 4px;
              font-size: 12px;
              font-weight: bold;
          }

          .status-MATCH {
              background: #dcfce7;
              color: #166534;
          }

          .status-REVIEW {
              background: #fef3c7;
              color: #92400e;
          }

          .status-NO_RESULTS {
              background: #fee2e2;
              color: #991b1b;
          }

          .hidden {
              display: none;
          }

          .summary {
              background: white;
              padding: 20px;
              border-radius: 10px;
              margin-bottom: 20px;
          }

          textarea {
              width: 100%;
              min-height: 100px;
              box-sizing: border-box;
              margin-top: 10px;
          }
          </style>
          </head>

          <body>

          <header>
              <h1>Inventory Cleanup Review</h1>
              <div class="stats">
                  <span id="totalCount"></span>
                  <span id="approvedCount"></span>
                  <span id="manualCount"></span>
                  <span id="skippedCount"></span>
              </div>
          </header>

          <div class="controls">
              <button class="filter" onclick="showAll()">All</button>
              <button class="filter" onclick="showNeedsReview()">Needs Review</button>
              <button class="filter" onclick="showUnresolved()">Unresolved</button>
              <button class="filter" onclick="showApproved()">Approved</button>
              <button class="download" onclick="downloadResults()">
                  Download Decisions JSON
              </button>
          </div>

          <main>

          <div class="summary">
              <strong>How this works</strong>
              <p>
              Green items have a strong proposed match.
              Yellow items need your decision.
              Click a candidate to select it.
              You can choose a different candidate than the
              automatic suggestion.
              </p>
              <p>
              For TV seasons, the workflow searches for the
              <strong>show</strong> first and then verifies that
              the requested season actually exists.
              </p>
          </div>
          """)

          # ---------------------------------------------------------
          # HTML ITEMS
          # ---------------------------------------------------------

          for item in review_items:

              status_class = item["status"].lower().replace(
                  "_",
                  "-"
              )

              html_parts.append(
                  f"""
                  <section
                      class="item {status_class}"
                      data-status="{esc(item['status'])}"
                      id="{esc(item['id'])}"
                  >
                  <h2>{esc(item['source_title'])}</h2>
                  """
              )

              if item.get("season") is not None:

                  html_parts.append(
                      f"""
                      <div class="meta">
                      <strong>TV Show:</strong>
                      {esc(item['show_title'])}
                      &nbsp; | &nbsp;
                      <strong>Season:</strong>
                      {item['season']}
                      &nbsp; | &nbsp;
                      <strong>Format:</strong>
                      {esc(item['format'])}
                      </div>
                      """
                  )

              else:

                  html_parts.append(
                      f"""
                      <div class="meta">
                      <strong>Format:</strong>
                      {esc(item['format'])}
                      </div>
                      """
                  )

              if item.get("special"):

                  html_parts.append(
                      f"""
                      <div class="meta">
                      <strong>Special instruction:</strong>
                      {esc(item['special'])}
                      </div>
                      """
                  )

              html_parts.append(
                  f"""
                  <span class="status status-{esc(item['status'])}">
                      {esc(item['status'])}
                  </span>
                  """
              )

              if not item["candidates"]:

                  html_parts.append(
                      """
                      <p>
                      <strong>No TMDB candidates found.</strong>
                      This item should be manually researched.
                      </p>
                      """
                  )

              for index, candidate in enumerate(
                  item["candidates"]
              ):

                  candidate_id = (
                      f"{item['id']}-candidate-{index}"
                  )

                  invalid = candidate.get(
                      "invalid_for_requested_season",
                      False
                  )

                  invalid_class = (
                      " invalid"
                      if invalid
                      else ""
                  )

                  checked = (
                      " checked"
                      if (
                          index == 0
                          and not invalid
                          and item["status"] == "MATCH"
                      )
                      else ""
                  )

                  html_parts.append(
                      f"""
                      <label
                          class="candidate{invalid_class}"
                          for="{esc(candidate_id)}"
                      >

                      <input
                          type="radio"
                          id="{esc(candidate_id)}"
                          name="{esc(item['id'])}"
                          value="{esc(candidate['tmdbId'])}"
                          data-title="{esc(candidate['tmdbTitle'])}"
                          data-score="{candidate['score']}"
                          data-season-exists="{str(
                              candidate.get(
                                  'season_exists',
                                  True
                              )
                          ).lower()}"
                          {checked}
                          onchange="selectCandidate(
                              '{esc(item['id'])}',
                              {index}
                          )"
                      >

                      <span class="candidate-title">
                          {esc(candidate['tmdbTitle'])}
                      </span>

                      <div class="candidate-details">
                          TMDB ID:
                          <strong>{candidate['tmdbId']}</strong>
                          &nbsp; | &nbsp;
                          Match score:
                          <strong>{candidate['score']:.3f}</strong>
                          """
                  )

                  if candidate.get("release_date"):
                      html_parts.append(
                          f"""
                          &nbsp; | &nbsp;
                          Date:
                          {esc(candidate['release_date'])}
                          """
                      )

                  if candidate.get(
                      "number_of_seasons"
                  ) is not None:

                      html_parts.append(
                          f"""
                          &nbsp; | &nbsp;
                          Seasons:
                          {candidate['number_of_seasons']}
                          """
                      )

                  if item.get("season") is not None:

                      if candidate.get(
                          "season_exists"
                      ):

                          html_parts.append(
                              f"""
                              <br>
                              <strong>
                              Season {item['season']} FOUND
                              </strong>
                              """
                          )

                      else:

                          html_parts.append(
                              f"""
                              <br>
                              <strong>
                              Season {item['season']}
                              NOT FOUND — do not select
                              </strong>
                              """
                          )

                  html_parts.append(
                      """
                      </div>
                      """
                  )

                  if candidate.get("overview"):

                      html_parts.append(
                          f"""
                          <div class="candidate-overview">
                          {esc(candidate['overview'])}
                          </div>
                          """
                      )

                  html_parts.append(
                      """
                      </label>
                      """
                  )

              html_parts.append(
                  f"""
                  <div class="decision">
                      <button
                          class="approve"
                          onclick="approveItem('{esc(item['id'])}')"
                      >
                          Approve Selected
                      </button>

                      <button
                          class="manual"
                          onclick="manualItem('{esc(item['id'])}')"
                      >
                          Manual Review / Skip
                      </button>

                      <div>
                          <textarea
                              id="{esc(item['id'])}-notes"
                              placeholder="Optional notes..."
                          ></textarea>
                      </div>

                      <div id="{esc(item['id'])}-decision"></div>
                  </div>

                  </section>
                  """
              )

          # ---------------------------------------------------------
          # JAVASCRIPT
          # ---------------------------------------------------------

          review_json = json.dumps(
              review_items
          ).replace(
              "</",
              "<\\/"
          )

          html_parts.append(
              f"""
              </main>

              <script>

              const reviewItems = {review_json};

              const decisions = {{}};

              function updateStats() {{

                  const total = reviewItems.length;

                  let approved = 0;
                  let manual = 0;
                  let skipped = 0;

                  Object.values(decisions).forEach(d => {{

                      if (d.decision === "APPROVE") {{
                          approved++;
                      }}

                      if (d.decision === "MANUAL_REVIEW") {{
                          manual++;
                      }}

                      if (d.decision === "SKIP") {{
                          skipped++;
                      }}

                  }});

                  document.getElementById(
                      "totalCount"
                  ).textContent =
                      "Total: " + total;

                  document.getElementById(
                      "approvedCount"
                  ).textContent =
                      "Approved: " + approved;

                  document.getElementById(
                      "manualCount"
                  ).textContent =
                      "Manual Review: " + manual;

                  document.getElementById(
                      "skippedCount"
                  ).textContent =
                      "Undecided: " +
                      (total - approved - manual - skipped);
              }}

              function selectCandidate(itemId, index) {{

                  const item = reviewItems.find(
                      x => x.id === itemId
                  );

                  if (!item) return;

                  const candidate =
                      item.candidates[index];

                  if (!candidate) return;

                  if (
                      candidate.invalid_for_requested_season
                  ) {{
                      alert(
                          "This candidate does not contain " +
                          "the requested TV season."
                      );
                      return;
                  }}

                  document
                      .querySelectorAll(
                          "#" + itemId + " .candidate"
                      )
                      .forEach(
                          x => x.classList.remove(
                              "selected"
                          )
                      );

                  const inputs =
                      document.querySelectorAll(
                          "#" + itemId +
                          " input[type=radio]"
                      );

                  if (inputs[index]) {{
                      inputs[index]
                          .closest(".candidate")
                          .classList.add(
                              "selected"
                          );
                  }}
              }}

              function approveItem(itemId) {{

                  const item = reviewItems.find(
                      x => x.id === itemId
                  );

                  if (!item) return;

                  const selected =
                      document.querySelector(
                          "#" + itemId +
                          " input[type=radio]:checked"
                      );

                  if (!selected) {{
                      alert(
                          "Select a TMDB candidate first."
                      );
                      return;
                  }}

                  if (
                      selected.dataset.seasonExists ===
                      "false"
                  ) {{
                      alert(
                          "That TV candidate does not " +
                          "contain the requested season."
                      );
                      return;
                  }}

                  const notes =
                      document.getElementById(
                          itemId + "-notes"
                      ).value;

                  decisions[itemId] = {{

                      decision: "APPROVE",

                      tmdbId: Number(
                          selected.value
                      ),

                      tmdbTitle:
                          selected.dataset.title,

                      score: Number(
                          selected.dataset.score
                      ),

                      notes: notes

                  }};

                  showDecision(
                      itemId,
                      "APPROVED"
                  );

                  updateStats();
              }}

              function manualItem(itemId) {{

                  const notes =
                      document.getElementById(
                          itemId + "-notes"
                      ).value;

                  decisions[itemId] = {{

                      decision: "MANUAL_REVIEW",

                      tmdbId: null,

                      tmdbTitle: null,

                      score: 0,

                      notes: notes

                  }};

                  showDecision(
                      itemId,
                      "MANUAL REVIEW"
                  );

                  updateStats();
              }}

              function showDecision(itemId, text) {{

                  const box =
                      document.getElementById(
                          itemId + "-decision"
                      );

                  box.innerHTML =
                      "<p><strong>Decision: " +
                      text +
                      "</strong></p>";
              }}

              function showAll() {{
                  document
                      .querySelectorAll(".item")
                      .forEach(
                          x => x.classList.remove(
                              "hidden"
                          )
                      );
              }}

              function showNeedsReview() {{

                  document
                      .querySelectorAll(".item")
                      .forEach(item => {{

                          const status =
                              item.dataset.status;

                          item.classList.toggle(
                              "hidden",
                              status === "MATCH"
                          );

                      }});
              }}

              function showUnresolved() {{

                  document
                      .querySelectorAll(".item")
                      .forEach(item => {{

                          const id = item.id;

                          const d =
                              decisions[id];

                          item.classList.toggle(
                              "hidden",
                              !!d
                          );

                      }});
              }}

              function showApproved() {{

                  document
                      .querySelectorAll(".item")
                      .forEach(item => {{

                          const id = item.id;

                          const d =
                              decisions[id];

                          item.classList.toggle(
                              "hidden",
                              !d ||
                              d.decision !==
                              "APPROVE"
                          );

                      }});
              }}

              function downloadResults() {{

                  const output = {{

                      generated_at:
                          new Date().toISOString(),

                      approved_count:
                          Object.values(
                              decisions
                          ).filter(
                              d =>
                                  d.decision ===
                                  "APPROVE"
                          ).length,

                      manual_review_count:
                          Object.values(
                              decisions
                          ).filter(
                              d =>
                                  d.decision ===
                                  "MANUAL_REVIEW"
                          ).length,

                      undecided_count:
                          reviewItems.length -
                          Object.keys(
                              decisions
                          ).length,

                      approved:
                          Object.entries(
                              decisions
                          )
                          .filter(
                              ([id, d]) =>
                                  d.decision ===
                                  "APPROVE"
                          )
                          .map(
                              ([id, d]) => {{

                                  const item =
                                      reviewItems.find(
                                          x =>
                                              x.id === id
                                      );

                                  return {{

                                      source_title:
                                          item.source_title,

                                      format:
                                          item.format,

                                      special:
                                          item.special,

                                      type:
                                          item.type,

                                      season:
                                          item.season,

                                      show_title:
                                          item.show_title,

                                      tmdbId:
                                          d.tmdbId,

                                      tmdbTitle:
                                          d.tmdbTitle,

                                      action:
                                          item.action,

                                      score:
                                          d.score,

                                      notes:
                                          d.notes

                                  }};
                              }}
                          ),

                      manual_review:
                          Object.entries(
                              decisions
                          )
                          .filter(
                              ([id, d]) =>
                                  d.decision ===
                                  "MANUAL_REVIEW"
                          )
                          .map(
                              ([id, d]) => {{

                                  const item =
                                      reviewItems.find(
                                          x =>
                                              x.id === id
                                      );

                                  return {{

                                      source_title:
                                          item.source_title,

                                      format:
                                          item.format,

                                      special:
                                          item.special,

                                      type:
                                          item.type,

                                      season:
                                          item.season,

                                      show_title:
                                          item.show_title,

                                      notes:
                                          d.notes

                                  }};
                              }}
                          ),

                      undecided:
                          reviewItems
                          .filter(
                              item =>
                                  !decisions[
                                      item.id
                                  ]
                          )
                          .map(
                              item => item
                          )

                  }};

                  const blob =
                      new Blob(
                          [
                              JSON.stringify(
                                  output,
                                  null,
                                  2
                              )
                          ],
                          {{
                              type:
                                  "application/json"
                          }}
                      );

                  const url =
                      URL.createObjectURL(
                          blob
                      );

                  const a =
                      document.createElement(
                          "a"
                      );

                  a.href = url;

                  a.download =
                      "inventory_cleanup_approved.json";

                  a.click();

                  URL.revokeObjectURL(url);
              }}

              updateStats();

              </script>

              </body>
              </html>
              """
          )

          HTML_FILE.write_text(
              "".join(html_parts),
              encoding="utf-8"
          )


          # =========================================================
          # FINAL CONSOLE SUMMARY
          # =========================================================

          match_count = sum(
              1
              for x in review_items
              if x["status"] == "MATCH"
          )

          review_count = sum(
              1
              for x in review_items
              if x["status"] == "REVIEW"
          )

          no_result_count = sum(
              1
              for x in review_items
              if x["status"] == "NO_RESULTS"
          )

          tv_count = sum(
              1
              for x in review_items
              if x["type"] == "tv"
          )

          print("")
          print("=" * 60)
          print("INVENTORY CLEANUP REVIEW COMPLETE")
          print("=" * 60)
          print("")
          print(f"Catalog records: {len(movies)}")
          print(f"Addition records: {len(review_items)}")
          print(f"Strong matches: {match_count}")
          print(f"Needs review: {review_count}")
          print(f"No results: {no_result_count}")
          print(f"TV season records: {tv_count}")
          print("")
          print("Generated:")
          print(f"  {HTML_FILE}")
          print(f"  {REPORT_FILE}")
          print(f"  {RESULTS_FILE}")
          print("")
          print("No changes were made to movies.js.")
          print("")


      - name: Upload cleanup review
        uses: actions/upload-artifact@v4
        with:
          name: inventory-cleanup-review
          path: |
            inventory_cleanup_review.html
            inventory_cleanup_report.md
            inventory_cleanup_results.json
