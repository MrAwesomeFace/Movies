
name: Inventory Cleanup - TMDB Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run inventory cleanup review
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python <<'PYTHON'
          import json
          import re
          import html
          import requests
          from difflib import SequenceMatcher
          from pathlib import Path

          TMDB_API_KEY = __import__("os").environ["TMDB_API_KEY"]

          MOVIES_FILE = Path("movies.js")
          INPUT_FILE = Path("inventory_cleanup.json")
          REPORT_FILE = Path("inventory_cleanup_report.md")
          RESULTS_FILE = Path("inventory_cleanup_results.json")
          HTML_FILE = Path("inventory_cleanup_review.html")

          API_BASE = "https://api.themoviedb.org/3"

          headers = {
              "Authorization": f"Bearer {TMDB_API_KEY}",
              "accept": "application/json"
          }

          # =========================================================
          # HELPERS
          # =========================================================

          def normalize(text):
              if not text:
                  return ""

              text = str(text).lower()

              text = text.replace("&", " and ")
              text = text.replace("’", "'")
              text = text.replace("–", "-")
              text = text.replace("—", "-")

              text = re.sub(r"[^a-z0-9]+", " ", text)

              return " ".join(text.split())


          def similarity(a, b):
              return SequenceMatcher(
                  None,
                  normalize(a),
                  normalize(b)
              ).ratio()


          def clean_title(title):
              title = title.strip()

              if title.lower().startswith("the "):
                  return title[4:] + ", The"

              return title


          def escape(value):
              return html.escape(str(value or ""))


          def load_movies():
              text = MOVIES_FILE.read_text(encoding="utf-8")

              start = text.find("[")
              end = text.rfind("]")

              if start == -1 or end == -1:
                  raise RuntimeError(
                      "Could not locate movies array in movies.js"
                  )

              return json.loads(text[start:end + 1])


          # =========================================================
          # TITLE INTELLIGENCE
          # =========================================================

          # These are not TMDB IDs.
          # They are search corrections for obvious inventory typos
          # and common collection naming conventions.
          TITLE_CORRECTIONS = {
              "the dilemna": "The Dilemma",
              "fierce creatrues": "Fierce Creatures",
              "what to expect when expcting":
                  "What to Expect When Expecting",
              "who if by see": "Who If By Sea",
              "little memaid 3": "The Little Mermaid III",
              "mallrats 10 anniverary": "Mallrats",
          }


          # Known edition words should not become part of the
          # TMDB title search.
          EDITION_WORDS = [
              "bootleg",
              "anniversary",
              "10 anniversary",
              "10th anniversary",
              "special edition",
              "collector's edition",
              "collectors edition",
              "director's cut",
              "directors cut",
              "extended edition",
              "ultimate edition",
              "limited edition",
          ]


          def identify_tv_season(title):
              """
              Returns season information when the source title clearly
              represents a television season.
              """

              pattern = re.search(
                  r"\bseason\s+(\d+)\b",
                  title,
                  flags=re.IGNORECASE
              )

              if pattern:
                  return int(pattern.group(1))

              # Volume-based TV collections are also often TV.
              if re.search(
                  r"\bvolume\s+\d+\b",
                  title,
                  flags=re.IGNORECASE
              ):
                  return None

              return None


          def extract_year(title):
              match = re.search(r"\b(19\d{2}|20\d{2})\b", title)

              if match:
                  return int(match.group(1))

              return None


          def prepare_search_title(title):
              original = title.strip()
              normalized = normalize(original)

              corrected = TITLE_CORRECTIONS.get(
                  normalized,
                  original
              )

              year = extract_year(corrected)

              # Remove edition descriptors from the actual TMDB search.
              search_title = corrected

              for word in EDITION_WORDS:
                  search_title = re.sub(
                      r"\b" + re.escape(word) + r"\b",
                      "",
                      search_title,
                      flags=re.IGNORECASE
                  )

              # Remove season information from TV search title.
              search_title = re.sub(
                  r"\bseason\s+\d+\b",
                  "",
                  search_title,
                  flags=re.IGNORECASE
              )

              search_title = re.sub(
                  r"\bvolume\s+\d+\b",
                  "",
                  search_title,
                  flags=re.IGNORECASE
              )

              search_title = " ".join(search_title.split())

              return {
                  "original": original,
                  "corrected": corrected,
                  "search_title": search_title,
                  "year": year,
                  "season": identify_tv_season(original)
              }


          # =========================================================
          # TMDB SEARCH
          # =========================================================

          def tmdb_search(endpoint_name, title):
              params = {
                  "query": title,
                  "include_adult": "false",
                  "language": "en-US",
                  "page": 1
              }

              endpoint = f"{API_BASE}/search/{endpoint_name}"

              response = requests.get(
                  endpoint,
                  headers=headers,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()

              return response.json().get("results", [])


          def get_result_title(result):
              return (
                  result.get("title")
                  or result.get("name")
                  or ""
              )


          def get_result_year(result):
              date = (
                  result.get("release_date")
                  or result.get("first_air_date")
                  or ""
              )

              if len(date) >= 4:
                  try:
                      return int(date[:4])
                  except Exception:
                      pass

              return None


          def score_candidate(source_title, candidate, expected_type):
              source = normalize(source_title)
              candidate_title = normalize(
                  get_result_title(candidate)
              )

              score = similarity(
                  source,
                  candidate_title
              )

              # Exact normalized title is extremely strong.
              if source == candidate_title:
                  score += 0.30

              # Ignore common leading "the".
              source_without_the = re.sub(
                  r"^the ",
                  "",
                  source
              )

              candidate_without_the = re.sub(
                  r"^the ",
                  "",
                  candidate_title
              )

              if source_without_the == candidate_without_the:
                  score += 0.20

              candidate_type = candidate.get(
                  "media_type",
                  expected_type
              )

              # Strongly prefer the type we actually expect.
              if candidate_type == expected_type:
                  score += 0.20
              else:
                  score -= 0.35

              # Year information, when supplied by the source,
              # is a very strong signal.
              source_year = extract_year(source_title)

              if source_year:
                  candidate_year = get_result_year(candidate)

                  if candidate_year == source_year:
                      score += 0.30
                  elif candidate_year:
                      score -= min(
                          abs(candidate_year - source_year) * 0.03,
                          0.30
                      )

              return max(0.0, min(score, 1.0))


          def build_candidates(info):
              title = info["search_title"]
              original = info["original"]
              season = info["season"]

              candidates = []

              # Explicit season -> TV only.
              if season is not None:
                  results = tmdb_search("tv", title)

                  for result in results:
                      result["media_type"] = "tv"
                      result["_match_score"] = score_candidate(
                          original,
                          result,
                          "tv"
                      )
                      candidates.append(result)

                  return candidates

              # Normal inventory items:
              #
              # Search movies FIRST.
              # Search TV as a secondary possibility so a TV result
              # cannot automatically win just because TMDB ranked it
              # highly in /search/multi.
              movie_results = tmdb_search(
                  "movie",
                  title
              )

              for result in movie_results:
                  result["media_type"] = "movie"
                  result["_match_score"] = score_candidate(
                      original,
                      result,
                      "movie"
                  )
                  candidates.append(result)

              tv_results = tmdb_search(
                  "tv",
                  title
              )

              for result in tv_results:
                  result["media_type"] = "tv"
                  result["_match_score"] = score_candidate(
                      original,
                      result,
                      "movie"
                  )
                  candidates.append(result)

              candidates.sort(
                  key=lambda x: x["_match_score"],
                  reverse=True
              )

              return candidates


          def find_best_tmdb_match(title, special=None):
              info = prepare_search_title(title)

              candidates = build_candidates(info)

              if not candidates:
                  return None, [], "NO_RESULTS", info

              # Remove obviously poor results.
              candidates = [
                  c for c in candidates
                  if c["_match_score"] >= 0.35
              ]

              if not candidates:
                  return None, [], "NO_RESULTS", info

              candidates.sort(
                  key=lambda x: x["_match_score"],
                  reverse=True
              )

              best = candidates[0]

              threshold = 0.82

              if special:
                  threshold = 0.86

              # Explicit TV season can be accepted at a slightly
              # lower threshold because the source gives us type.
              if info["season"] is not None:
                  threshold = 0.75

              status = "MATCH"

              if best["_match_score"] < threshold:
                  status = "REVIEW"

              if len(candidates) > 1:
                  gap = (
                      best["_match_score"]
                      - candidates[1]["_match_score"]
                  )

                  # Close candidates require human approval.
                  if gap < 0.08:
                      status = "REVIEW"

              # A non-movie result should NEVER automatically win
              # a normal movie inventory item.
              if info["season"] is None:
                  if best.get("media_type") != "movie":
                      status = "REVIEW"

              return (
                  best,
                  candidates[:8],
                  status,
                  info
              )


          # =========================================================
          # LOAD DATA
          # =========================================================

          print("Loading movies.js...")
          movies = load_movies()

          print(f"Loaded {len(movies)} catalog records.")

          print("Loading inventory cleanup instructions...")

          instructions = json.loads(
              INPUT_FILE.read_text(
                  encoding="utf-8"
              )
          )

          additions = instructions.get("add", [])
          removals = instructions.get("remove", [])
          the_fixes = instructions.get("move_the_to_end", [])
          tmdb_corrections = instructions.get(
              "tmdb_corrections",
              []
          )

          print(f"Additions: {len(additions)}")
          print(f"Removals: {len(removals)}")
          print(f"The fixes: {len(the_fixes)}")
          print(
              f"TMDB corrections: "
              f"{len(tmdb_corrections)}"
          )


          # =========================================================
          # EXISTING CATALOG INDEX
          # =========================================================

          by_tmdb = {}

          for movie in movies:
              tmdb_id = movie.get("tmdbId")

              if tmdb_id is not None:
                  by_tmdb.setdefault(
                      str(tmdb_id),
                      []
                  ).append(movie)


          # =========================================================
          # ADDITIONS
          # =========================================================

          addition_matches = []

          for i, item in enumerate(additions, 1):

              title = item["title"]
              fmt = item.get("format", "")
              special = item.get("special")

              print(
                  f"[ADD {i}/{len(additions)}] "
                  f"{title} ({fmt})"
              )

              best, candidates, status, info = (
                  find_best_tmdb_match(
                      title,
                      special
                  )
              )

              if best:

                  tmdb_id = best.get("id")

                  tmdb_title = get_result_title(
                      best
                  )

                  media_type = best.get(
                      "media_type",
                      ""
                  )

                  existing = by_tmdb.get(
                      str(tmdb_id),
                      []
                  )

                  if existing:
                      action = (
                          "ADD_FORMAT_TO_EXISTING"
                      )
                  else:
                      action = (
                          "CREATE_NEW_RECORD"
                      )

                  addition_matches.append({
                      "source_title": title,
                      "format": fmt,
                      "special": special,
                      "search_title": info[
                          "search_title"
                      ],
                      "corrected_title": info[
                          "corrected"
                      ],
                      "tmdbId": tmdb_id,
                      "tmdbTitle": tmdb_title,
                      "type": media_type,
                      "score": best[
                          "_match_score"
                      ],
                      "status": status,
                      "action": action,
                      "existing_titles": [
                          m.get("title", "")
                          for m in existing
                      ],
                      "candidates": [
                          {
                              "tmdbId": c.get("id"),
                              "tmdbTitle": get_result_title(c),
                              "type": c.get(
                                  "media_type",
                                  ""
                              ),
                              "score": c[
                                  "_match_score"
                              ],
                              "year": get_result_year(c)
                          }
                          for c in candidates
                      ]
                  })

              else:

                  addition_matches.append({
                      "source_title": title,
                      "format": fmt,
                      "special": special,
                      "search_title": info[
                          "search_title"
                      ],
                      "corrected_title": info[
                          "corrected"
                      ],
                      "tmdbId": None,
                      "tmdbTitle": None,
                      "type": None,
                      "score": 0,
                      "status": "NO_RESULTS",
                      "action": "MANUAL_REVIEW",
                      "existing_titles": [],
                      "candidates": []
                  })


          # =========================================================
          # MARK DEFAULT DECISION
          # =========================================================

          for item in addition_matches:

              # High-confidence matches are pre-selected.
              #
              # Anything requiring review is left unselected.
              if (
                  item["status"] == "MATCH"
                  and item["tmdbId"] is not None
              ):
                  item["default_decision"] = "ACCEPT"
              else:
                  item["default_decision"] = "REVIEW"


          # =========================================================
          # MARK EXISTING CATALOG INFORMATION
          # =========================================================

          normalized_catalog_titles = [
              (
                  movie,
                  normalize(
                      movie.get("title", "")
                  ),
                  normalize(
                      movie.get("tmdbTitle", "")
                  )
              )
              for movie in movies
          ]


          # =========================================================
          # MARKDOWN REPORT
          # =========================================================

          report = []

          report.append(
              "# Inventory Cleanup TMDB Review"
          )
          report.append("")
          report.append(
              "**REPORT ONLY — no changes were made "
              "to `movies.js`.**"
          )
          report.append("")
          report.append(
              f"- Existing catalog records: "
              f"**{len(movies)}**"
          )
          report.append(
              f"- Inventory additions: "
              f"**{len(additions)}**"
          )
          report.append(
              f"- Explicit removals: "
              f"**{len(removals)}**"
          )
          report.append(
              f"- Alphabetical `The` fixes: "
              f"**{len(the_fixes)}**"
          )
          report.append(
              f"- TMDB corrections: "
              f"**{len(tmdb_corrections)}**"
          )
          report.append("")

          report.append("## ADDITIONS")
          report.append("")

          for item in addition_matches:

              report.append(
                  f"### {item['source_title']}"
              )

              report.append(
                  f"- Format: `{item['format']}`"
              )

              if item.get("special"):
                  report.append(
                      f"- Special instruction: "
                      f"{item['special']}"
                  )

              report.append(
                  f"- Search title: "
                  f"`{item['search_title']}`"
              )

              report.append(
                  f"- TMDB: "
                  f"`{item['tmdbId']}` — "
                  f"{item['tmdbTitle']}"
              )

              report.append(
                  f"- Type: `{item['type']}`"
              )

              report.append(
                  f"- Match score: "
                  f"`{item['score']:.3f}`"
              )

              report.append(
                  f"- Match status: "
                  f"**{item['status']}**"
              )

              report.append(
                  f"- Proposed action: "
                  f"**{item['action']}**"
              )

              if item["existing_titles"]:
                  report.append(
                      "- Existing catalog record(s): "
                      + ", ".join(
                          item["existing_titles"]
                      )
                  )

              if item["candidates"]:
                  report.append("")
                  report.append(
                      "**Top candidates:**"
                  )

                  for candidate in item[
                      "candidates"
                  ]:
                      report.append(
                          f"- `{candidate['tmdbId']}` "
                          f"{candidate['tmdbTitle']} "
                          f"({candidate['type']}, "
                          f"{candidate['year'] or 'no year'}) "
                          f"score "
                          f"`{candidate['score']:.3f}`"
                      )

              report.append("")


          # =========================================================
          # REMOVALS
          # =========================================================

          report.append("## REMOVALS")
          report.append("")

          for title in removals:

              target = normalize(title)
              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                      or similarity(
                          title,
                          movie.get("title", "")
                      ) >= 0.92
                  ):
                      matches.append(movie)

              report.append(
                  f"### {title}"
              )

              if len(matches) == 1:

                  movie = matches[0]

                  report.append(
                      f"- **FOUND** → "
                      f"`{movie.get('title')}` "
                      f"(TMDB `{movie.get('tmdbId')}`)"
                  )

                  report.append(
                      "- Proposed action: **REMOVE**"
                  )

              elif len(matches) > 1:

                  report.append(
                      "- **MULTIPLE MATCHES — "
                      "MANUAL REVIEW**"
                  )

                  for movie in matches:
                      report.append(
                          f"- `{movie.get('title')}` "
                          f"(TMDB `{movie.get('tmdbId')}`)"
                      )

              else:

                  report.append(
                      "- **NOT FOUND — "
                      "MANUAL REVIEW**"
                  )

              report.append("")


          # =========================================================
          # THE FIXES
          # =========================================================

          report.append(
              "## ALPHABETICAL `THE` FIXES"
          )
          report.append("")

          for title in the_fixes:

              target = normalize(title)
              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                  ):
                      matches.append(movie)

              new_title = clean_title(title)

              report.append(
                  f"### {title}"
              )

              report.append(
                  f"- Proposed title: **{new_title}**"
              )

              if len(matches) == 1:

                  movie = matches[0]

                  report.append(
                      f"- Found: "
                      f"`{movie.get('title')}` "
                      f"(TMDB `{movie.get('tmdbId')}`)"
                  )

                  report.append(
                      "- Proposed action: "
                      "**RENAME TITLE ONLY**"
                  )

              elif len(matches) > 1:

                  report.append(
                      "- **MULTIPLE MATCHES — "
                      "MANUAL REVIEW**"
                  )

              else:

                  report.append(
                      "- **NOT FOUND — "
                      "MANUAL REVIEW**"
                  )

              report.append("")


          # =========================================================
          # TMDB CORRECTIONS
          # =========================================================

          report.append("## TMDB CORRECTIONS")
          report.append("")

          for correction in tmdb_corrections:

              title = correction["title"]
              instruction = correction.get(
                  "instruction",
                  ""
              )

              report.append(
                  f"### {title}"
              )

              report.append(
                  f"- Instruction: {instruction}"
              )

              target = normalize(title)
              matches = []

              for movie, ntitle, ntmdbtitle in (
                  normalized_catalog_titles
              ):

                  if (
                      target == ntitle
                      or target == ntmdbtitle
                      or similarity(
                          title,
                          movie.get("title", "")
                      ) >= 0.90
                  ):
                      matches.append(movie)

              if len(matches) == 1:

                  current = matches[0]

                  report.append(
                      f"- Current catalog record: "
                      f"`{current.get('title')}`"
                  )

                  report.append(
                      f"- Current TMDB ID: "
                      f"`{current.get('tmdbId')}`"
                  )

                  best, candidates, status, info = (
                      find_best_tmdb_match(
                          title,
                          instruction
                      )
                  )

                  if best:

                      tmdb_title = get_result_title(
                          best
                      )

                      report.append(
                          f"- Proposed TMDB: "
                          f"`{best.get('id')}` — "
                          f"{tmdb_title}"
                      )

                      report.append(
                          f"- Score: "
                          f"`{best['_match_score']:.3f}`"
                      )

                      report.append(
                          f"- Status: **{status}**"
                      )

                  else:

                      report.append(
                          "- **NO TMDB RESULTS**"
                      )

              elif len(matches) > 1:

                  report.append(
                      "- **MULTIPLE CATALOG MATCHES — "
                      "MANUAL REVIEW**"
                  )

              else:

                  report.append(
                      "- **CATALOG RECORD NOT FOUND — "
                      "MANUAL REVIEW**"
                  )

              report.append("")


          report.append("## IMPORTANT")
          report.append("")
          report.append(
              "This workflow intentionally made "
              "**NO CHANGES** to `movies.js`."
          )
          report.append("")
          report.append(
              "Use `inventory_cleanup_review.html` "
              "to approve or reject proposed additions."
          )

          REPORT_FILE.write_text(
              "\n".join(report),
              encoding="utf-8"
          )


          # =========================================================
          # MACHINE-READABLE RESULTS
          # =========================================================

          RESULTS_FILE.write_text(
              json.dumps(
                  addition_matches,
                  indent=2
              ),
              encoding="utf-8"
          )


          # =========================================================
          # INTERACTIVE HTML REVIEW
          # =========================================================

          html_items = []

          for index, item in enumerate(
              addition_matches
          ):

              candidate_html = ""

              for candidate in item["candidates"]:

                  candidate_html += f"""
                  <div class="candidate">
                    <strong>{escape(candidate['tmdbTitle'])}</strong>
                    <span>
                      TMDB {escape(candidate['tmdbId'])}
                      · {escape(candidate['type'])}
                      · {escape(candidate['year'] or 'no year')}
                      · score {candidate['score']:.3f}
                    </span>
                  </div>
                  """

              existing_html = ""

              if item["existing_titles"]:
                  existing_html = (
                      "<div class='existing'>"
                      "Existing catalog: "
                      + escape(
                          ", ".join(
                              item["existing_titles"]
                          )
                      )
                      + "</div>"
                  )

              status_class = (
                  "match"
                  if item["status"] == "MATCH"
                  else "review"
              )

              html_items.append(
                  f"""
                  <div class="item {status_class}"
                       data-index="{index}">

                    <div class="item-header">
                      <div>
                        <h2>
                          {escape(item['source_title'])}
                        </h2>
                        <div class="meta">
                          Format:
                          <strong>
                            {escape(item['format'])}
                          </strong>
                        </div>
                      </div>

                      <div class="status">
                        {escape(item['status'])}
                      </div>
                    </div>

                    <div class="proposal">

                      <div class="source">
                        <label>Inventory</label>
                        <strong>
                          {escape(item['source_title'])}
                        </strong>
                      </div>

                      <div class="arrow">→</div>

                      <div class="tmdb">
                        <label>Proposed TMDB</label>
                        <strong>
                          {escape(item['tmdbTitle'] or 'NO MATCH')}
                        </strong>
                        <span>
                          {escape(item['type'] or '')}
                          {(
                              ' · TMDB ' +
                              str(item['tmdbId'])
                          ) if item['tmdbId'] else ''}
                        </span>
                      </div>

                    </div>

                    <div class="details">
                      <span>
                        Score:
                        <strong>
                          {item['score']:.3f}
                        </strong>
                      </span>

                      <span>
                        Action:
                        <strong>
                          {escape(item['action'])}
                        </strong>
                      </span>

                      <span>
                        Search:
                        <strong>
                          {escape(item['search_title'])}
                        </strong>
                      </span>
                    </div>

                    {existing_html}

                    <div class="candidates">
                      <h3>Other candidates</h3>
                      {candidate_html or '<em>No other candidates</em>'}
                    </div>

                    <div class="decision">
                      <button
                        class="accept"
                        onclick="setDecision({index}, 'ACCEPT')">
                        ✓ Accept
                      </button>

                      <button
                        class="reject"
                        onclick="setDecision({index}, 'REJECT')">
                        ✕ Reject
                      </button>

                      <button
                        class="manual"
                        onclick="setDecision({index}, 'MANUAL_REVIEW')">
                        ? Manual Review
                      </button>

                      <span
                        class="decision-label"
                        id="decision-{index}">
                      </span>
                    </div>

                  </div>
                  """
              )


          data_json = json.dumps(
              addition_matches
          ).replace(
              "</",
              "<\\/"
          )


          review_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width, initial-scale=1.0">

          <title>Inventory Cleanup Review</title>

          <style>
          * {{
            box-sizing: border-box;
          }}

          body {{
            margin: 0;
            font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;
            background: #f3f4f6;
            color: #111827;
          }}

          header {{
            position: sticky;
            top: 0;
            z-index: 10;
            background: #111827;
            color: white;
            padding: 20px;
            box-shadow:
              0 2px 10px rgba(0,0,0,.25);
          }}

          header h1 {{
            margin: 0 0 6px;
            font-size: 24px;
          }}

          header p {{
            margin: 0;
            opacity: .8;
          }}

          .toolbar {{
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
          }}

          button {{
            border: 0;
            border-radius: 7px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
          }}

          .toolbar button {{
            background: white;
            color: #111827;
          }}

          .toolbar button.primary {{
            background: #22c55e;
            color: white;
          }}

          .toolbar button.warning {{
            background: #f59e0b;
            color: white;
          }}

          #summary {{
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            font-weight: 600;
          }}

          main {{
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 50px;
          }}

          .item {{
            background: white;
            border-radius: 10px;
            margin-bottom: 18px;
            padding: 20px;
            box-shadow:
              0 1px 4px rgba(0,0,0,.12);
            border-left: 6px solid #9ca3af;
          }}

          .item.match {{
            border-left-color: #22c55e;
          }}

          .item.review {{
            border-left-color: #f59e0b;
          }}

          .item.accepted {{
            background: #f0fdf4;
          }}

          .item.rejected {{
            opacity: .55;
          }}

          .item.manual {{
            background: #fffbeb;
          }}

          .item-header {{
            display: flex;
            justify-content: space-between;
            gap: 20px;
          }}

          h2 {{
            margin: 0 0 5px;
            font-size: 20px;
          }}

          h3 {{
            font-size: 14px;
            margin: 18px 0 8px;
          }}

          label {{
            display: block;
            text-transform: uppercase;
            font-size: 11px;
            color: #6b7280;
            letter-spacing: .05em;
            margin-bottom: 4px;
          }}

          .meta {{
            color: #6b7280;
            font-size: 13px;
          }}

          .status {{
            font-size: 12px;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 5px;
            background: #e5e7eb;
            height: fit-content;
          }}

          .match .status {{
            background: #dcfce7;
            color: #166534;
          }}

          .review .status {{
            background: #fef3c7;
            color: #92400e;
          }}

          .proposal {{
            display: grid;
            grid-template-columns:
              minmax(0,1fr)
              auto
              minmax(0,1fr);
            gap: 20px;
            align-items: center;
            margin-top: 20px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
          }}

          .proposal strong {{
            display: block;
            font-size: 17px;
          }}

          .proposal span {{
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
          }}

          .arrow {{
            font-size: 25px;
            color: #6b7280;
          }}

          .details {{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
