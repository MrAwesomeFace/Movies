name: Movie Metadata Resync Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resync-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run metadata resync review
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          python <<'PYTHON'
          import json
          import os
          import re
          import requests
          from datetime import datetime, timezone
          from pathlib import Path

          MOVIES_FILE = Path("movies.js")
          UPDATE_FILE = Path("inventory_resync_updates.json")

          REVIEW_JSON = Path("resync_review.json")
          REVIEW_HTML = Path("resync_review.html")
          SUMMARY_JSON = Path("resync_review_summary.json")

          TMDB_TOKEN = os.environ.get("TMDB_TOKEN")

          if not TMDB_TOKEN:
              raise RuntimeError(
                  "TMDB_READ_ACCESS_TOKEN secret was not found."
              )

          if not MOVIES_FILE.exists():
              raise RuntimeError("movies.js was not found.")

          if not UPDATE_FILE.exists():
              raise RuntimeError(
                  "inventory_resync_updates.json was not found."
              )

          print("=" * 70)
          print("MOVIE METADATA RESYNC REVIEW")
          print("=" * 70)
          print()

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize_title(value):
              value = clean(value).lower()
              value = value.replace("’", "'")
              value = value.replace("&", "and")
              value = re.sub(r"[^a-z0-9]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def number_string(value):
              value = clean(value)

              if not value:
                  return ""

              try:
                  return str(int(float(value)))
              except Exception:
                  return value

          def get_tmdb_id(movie):
              for key in ("tmdbId", "tmdbID", "tmdb_id"):
                  if key in movie and clean(movie[key]):
                      return number_string(movie[key])
              return ""

          def get_title(movie):
              for key in ("title", "name"):
                  if key in movie and clean(movie[key]):
                      return clean(movie[key])
              return ""

          def get_year(movie):
              for key in ("year", "source_year", "tmdbYear"):
                  if key in movie and clean(movie[key]):
                      return clean(movie[key])
              return ""

          def get_type(movie):
              for key in ("type", "mediaType", "media_type"):
                  if key in movie and clean(movie[key]):
                      value = clean(movie[key]).lower()

                      if value in (
                          "tv",
                          "show",
                          "series",
                          "television"
                      ):
                          return "tv"

                      if value in (
                          "movie",
                          "film"
                      ):
                          return "movie"

              return ""

          def get_season(movie):
              for key in (
                  "season",
                  "seasonNumber",
                  "season_number",
                  "seasonNum"
              ):
                  if key in movie and clean(movie[key]):
                      return number_string(movie[key])

              return ""

          def get_categories(movie):
              value = movie.get("category", [])

              if isinstance(value, list):
                  return [
                      clean(x)
                      for x in value
                      if clean(x)
                  ]

              if clean(value):
                  return [
                      x.strip()
                      for x in clean(value).split(",")
                      if x.strip()
                  ]

              return []

          def tmdb_request(path):
              url = f"https://api.themoviedb.org/3/{path}"

              headers = {
                  "Authorization": f"Bearer {TMDB_TOKEN}",
                  "accept": "application/json"
              }

              response = requests.get(
                  url,
                  headers=headers,
                  timeout=30
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      f"TMDB request failed: "
                      f"{response.status_code} {path}"
                  )

              return response.json()

          # ------------------------------------------------------------
          # Load movies.js
          # ------------------------------------------------------------

          movies_text = MOVIES_FILE.read_text(
              encoding="utf-8"
          )

          start = movies_text.find("[")

          if start == -1:
              raise RuntimeError(
                  "Could not find the movie array in movies.js."
              )

          # movies.js may contain a trailing semicolon.
          # Locate the final array closing bracket.
          end = movies_text.rfind("]")

          if end == -1 or end <= start:
              raise RuntimeError(
                  "Could not find the end of the movie array."
              )

          array_text = movies_text[start:end + 1]

          try:
              movies = json.loads(array_text)
          except json.JSONDecodeError as exc:
              raise RuntimeError(
                  "movies.js does not contain a JSON-compatible "
                  "movie array. "
                  f"Line {exc.lineno}, column {exc.colno}: "
                  f"{exc.msg}"
              )

          if not isinstance(movies, list):
              raise RuntimeError(
                  "The movie data in movies.js is not an array."
              )

          print(f"Loaded {len(movies)} catalog records.")
          print()

          # ------------------------------------------------------------
          # Load approved correction file
          # ------------------------------------------------------------

          instructions = json.loads(
              UPDATE_FILE.read_text(encoding="utf-8")
          )

          updates = instructions.get("updates", [])
          title_fixes = instructions.get("title_fixes", [])
          category_additions = instructions.get(
              "category_additions",
              []
          )

          print(
              f"Approved metadata updates: {len(updates)}"
          )
          print(
              f"Approved title fixes: {len(title_fixes)}"
          )
          print(
              f"Approved category additions: "
              f"{len(category_additions)}"
          )
          print()

          # ------------------------------------------------------------
          # Catalog indexes
          # ------------------------------------------------------------

          by_tmdb = {}
          by_title = {}

          for index, movie in enumerate(movies):

              tmdb_id = get_tmdb_id(movie)
              title = get_title(movie)

              if tmdb_id:
                  by_tmdb.setdefault(
                      tmdb_id,
                      []
                  ).append(index)

              if title:
                  by_title.setdefault(
                      normalize_title(title),
                      []
                  ).append(index)

          # ------------------------------------------------------------
          # Review collections
          # ------------------------------------------------------------

          approved_changes = []
          tv_review = []
          errors = []

          # ------------------------------------------------------------
          # Process approved update instructions
          # ------------------------------------------------------------

          for instruction in updates:

              title = clean(
                  instruction.get("title")
              )

              action = clean(
                  instruction.get("action")
              )

              wrong_id = number_string(
                  instruction.get("wrong_tmdb_id")
              )

              correct_id = number_string(
                  instruction.get("correct_tmdb_id")
              )

              supplied_id = number_string(
                  instruction.get("tmdb_id")
              )

              candidates = []

              # --------------------------------------------------------
              # change_id_and_resync
              # --------------------------------------------------------

              if action == "change_id_and_resync":

                  if not wrong_id or not correct_id:
                      errors.append({
                          "title": title,
                          "action": action,
                          "reason":
                              "Missing wrong_tmdb_id or "
                              "correct_tmdb_id."
                      })
                      continue

                  candidates = by_tmdb.get(
                      wrong_id,
                      []
                  )

                  if len(candidates) == 0:

                      title_candidates = by_title.get(
                          normalize_title(title),
                          []
                      )

                      if len(title_candidates) == 1:
                          candidates = title_candidates

                  if len(candidates) != 1:

                      errors.append({
                          "title": title,
                          "action": action,
                          "wrong_tmdb_id": wrong_id,
                          "correct_tmdb_id": correct_id,
                          "reason":
                              "Could not identify exactly one "
                              "catalog record using the supplied "
                              "information.",
                          "candidate_indexes": candidates
                      })

                      continue

                  index = candidates[0]
                  movie = movies[index]

                  actual_id = get_tmdb_id(movie)

                  if actual_id != wrong_id:

                      errors.append({
                          "title": title,
                          "action": action,
                          "expected_wrong_tmdb_id": wrong_id,
                          "actual_tmdb_id": actual_id,
                          "reason":
                              "Catalog entry does not contain "
                              "the expected wrong TMDB ID."
                      })

                      continue

                  try:
                      metadata = tmdb_request(
                          f"movie/{correct_id}"
                      )
                  except Exception as exc:

                      errors.append({
                          "title": title,
                          "action": action,
                          "correct_tmdb_id": correct_id,
                          "reason": str(exc)
                      })

                      continue

                  approved_changes.append({
                      "change_type": "TMDB_ID_AND_METADATA",
                      "status": "APPROVED",
                      "catalog_index": index,
                      "catalog_title": get_title(movie),
                      "before": {
                          "tmdbId": actual_id,
                          "title": get_title(movie),
                          "year": get_year(movie)
                      },
                      "after": {
                          "tmdbId": correct_id,
                          "tmdbTitle":
                              metadata.get("title", ""),
                          "year":
                              str(
                                  metadata.get(
                                      "release_date",
                                      ""
                                  )
                              )[:4],
                          "overview":
                              metadata.get("overview", "")
                      }
                  })

                  continue

              # --------------------------------------------------------
              # resync with supplied ID
              # --------------------------------------------------------

              if action == "resync":

                  if not supplied_id:

                      errors.append({
                          "title": title,
                          "action": action,
                          "reason":
                              "resync instruction has no tmdb_id."
                      })

                      continue

                  candidates = by_tmdb.get(
                      supplied_id,
                      []
                  )

                  if len(candidates) == 0:

                      title_candidates = by_title.get(
                          normalize_title(title),
                          []
                      )

                      if len(title_candidates) == 1:
                          candidates = title_candidates

                  if len(candidates) != 1:

                      errors.append({
                          "title": title,
                          "action": action,
                          "tmdb_id": supplied_id,
                          "reason":
                              "Could not identify exactly one "
                              "catalog record."
                      })

                      continue

                  index = candidates[0]
                  movie = movies[index]

                  try:
                      metadata = tmdb_request(
                          f"movie/{supplied_id}"
                      )
                  except Exception as exc:

                      errors.append({
                          "title": title,
                          "action": action,
                          "tmdb_id": supplied_id,
                          "reason": str(exc)
                      })

                      continue

                  approved_changes.append({
                      "change_type": "METADATA_RESYNC",
                      "status": "APPROVED",
                      "catalog_index": index,
                      "catalog_title": get_title(movie),
                      "before": {
                          "tmdbId":
                              get_tmdb_id(movie),
                          "title":
                              get_title(movie),
                          "year":
                              get_year(movie)
                      },
                      "after": {
                          "tmdbId": supplied_id,
                          "tmdbTitle":
                              metadata.get("title", ""),
                          "year":
                              str(
                                  metadata.get(
                                      "release_date",
                                      ""
                                  )
                              )[:4],
                          "overview":
                              metadata.get("overview", "")
                      }
                  })

                  continue

              # --------------------------------------------------------
              # resync_by_existing_id
              # --------------------------------------------------------

              if action == "resync_by_existing_id":

                  candidates = by_title.get(
                      normalize_title(title),
                      []
                  )

                  if len(candidates) != 1:

                      errors.append({
                          "title": title,
                          "action": action,
                          "reason":
                              "Could not identify exactly one "
                              "catalog record by title.",
                          "candidate_indexes": candidates
                      })

                      continue

                  index = candidates[0]
                  movie = movies[index]

                  existing_id = get_tmdb_id(movie)

                  if not existing_id:

                      errors.append({
                          "title": title,
                          "action": action,
                          "catalog_index": index,
                          "reason":
                              "Catalog entry does not have "
                              "an existing TMDB ID."
                      })

                      continue

                  # IMPORTANT:
                  # We intentionally DO NOT perform a TMDB title
                  # search here. We use the existing validated ID.
                  try:

                      movie_type = get_type(movie)

                      if movie_type == "tv":
                          metadata = tmdb_request(
                              f"tv/{existing_id}"
                          )
                      else:
                          metadata = tmdb_request(
                              f"movie/{existing_id}"
                          )

                  except Exception as exc:

                      errors.append({
                          "title": title,
                          "action": action,
                          "existing_tmdb_id":
                              existing_id,
                          "reason": str(exc)
                      })

                      continue

                  approved_changes.append({
                      "change_type": "METADATA_RESYNC",
                      "status": "APPROVED",
                      "catalog_index": index,
                      "catalog_title": get_title(movie),
                      "before": {
                          "tmdbId": existing_id,
                          "title": get_title(movie),
                          "year": get_year(movie)
                      },
                      "after": {
                          "tmdbId": existing_id,
                          "tmdbTitle":
                              metadata.get(
                                  "title",
                                  metadata.get(
                                      "name",
                                      ""
                                  )
                              ),
                          "year":
                              str(
                                  metadata.get(
                                      "release_date",
                                      metadata.get(
                                          "first_air_date",
                                          ""
                                      )
                                  )
                              )[:4],
                          "overview":
                              metadata.get(
                                  "overview",
                                  ""
                              )
                      }
                  })

                  continue

              errors.append({
                  "title": title,
                  "action": action,
                  "reason":
                      "Unknown action in instruction file."
              })

          # ------------------------------------------------------------
          # Title fixes
          # ------------------------------------------------------------

          for fix in title_fixes:

              title = clean(
                  fix.get("title")
              )

              action = clean(
                  fix.get("action")
              )

              if action != "move_the_to_end":
                  errors.append({
                      "title": title,
                      "action": action,
                      "reason":
                          "Unknown title-fix action."
                  })
                  continue

              candidates = by_title.get(
                  normalize_title(title),
                  []
              )

              if len(candidates) != 1:

                  errors.append({
                      "title": title,
                      "action": action,
                      "reason":
                          "Could not identify exactly one "
                          "catalog record for title fix.",
                      "candidate_indexes": candidates
                  })

                  continue

              index = candidates[0]
              movie = movies[index]

              current_title = get_title(movie)

              if current_title.lower().startswith("the "):

                  proposed_title = (
                      current_title[4:] +
                      ", The"
                  )

              else:

                  # The supplied title is authoritative for this
                  # approved operation.
                  if title.lower().startswith("the "):
                      proposed_title = (
                          title[4:] +
                          ", The"
                      )
                  else:
                      proposed_title = title

              approved_changes.append({
                  "change_type": "TITLE_FIX",
                  "status": "APPROVED",
                  "catalog_index": index,
                  "catalog_title": current_title,
                  "before": {
                      "title": current_title
                  },
                  "after": {
                      "title": proposed_title
                  }
              })

          # ------------------------------------------------------------
          # Category additions
          # ------------------------------------------------------------

          for addition in category_additions:

              title = clean(
                  addition.get("title")
              )

              category = clean(
                  addition.get("category")
              )

              candidates = by_title.get(
                  normalize_title(title),
                  []
              )

              if len(candidates) != 1:

                  errors.append({
                      "title": title,
                      "category": category,
                      "reason":
                          "Could not identify exactly one "
                          "catalog record for category addition.",
                      "candidate_indexes": candidates
                  })

                  continue

              index = candidates[0]
              movie = movies[index]

              current_categories = get_categories(
                  movie
              )

              already_present = (
                  category.lower()
                  in {
                      x.lower()
                      for x in current_categories
                  }
              )

              approved_changes.append({
                  "change_type": "CATEGORY_ADD",
                  "status": "APPROVED",
                  "catalog_index": index,
                  "catalog_title": get_title(movie),
                  "before": {
                      "categories":
                          current_categories
                  },
                  "after": {
                      "add_category":
                          category,
                      "already_present":
                          already_present
                  }
              })

          # ------------------------------------------------------------
          # TV SEASON AUDIT
          #
          # This scans the ENTIRE movies.js catalog.
          #
          # It is independent of inventory_resync_updates.json.
          # ------------------------------------------------------------

          tv_entries = []

          for index, movie in enumerate(movies):

              movie_type = get_type(movie)

              if movie_type != "tv":
                  continue

              tv_entries.append({
                  "catalog_index": index,
                  "title": get_title(movie),
                  "tmdbId": get_tmdb_id(movie),
                  "year": get_year(movie),
                  "season": get_season(movie)
              })

          # Also detect TV-looking entries where type is missing
          # but season information exists.

          for index, movie in enumerate(movies):

              if get_type(movie) == "tv":
                  continue

              season = get_season(movie)

              if not season:
                  continue

              tv_entries.append({
                  "catalog_index": index,
                  "title": get_title(movie),
                  "tmdbId": get_tmdb_id(movie),
                  "year": get_year(movie),
                  "season": season,
                  "warning":
                      "Season field exists but catalog type "
                      "is not explicitly TV."
              })

          # Group by TMDB ID.

          tv_by_tmdb = {}

          for entry in tv_entries:

              tmdb_id = entry["tmdbId"]

              if not tmdb_id:
                  continue

              tv_by_tmdb.setdefault(
                  tmdb_id,
                  []
              ).append(entry)

          # ------------------------------------------------------------
          # Analyze TV groups
          # ------------------------------------------------------------

          for tmdb_id, entries in tv_by_tmdb.items():

              if len(entries) < 2:
                  continue

              seasons = [
                  e["season"]
                  for e in entries
                  if e["season"]
              ]

              unique_seasons = sorted(
                  set(seasons),
                  key=lambda x: int(x)
                  if x.isdigit()
                  else x
              )

              duplicate_seasons = (
                  len(seasons) !=
                  len(unique_seasons)
              )

              missing_season_numbers = (
                  len(seasons) != len(entries)
              )

              if duplicate_seasons or missing_season_numbers:

                  tv_review.append({
                      "issue": "TV_SEASON_STRUCTURE",
                      "severity": "REVIEW",
                      "tmdbId": tmdb_id,
                      "entries": entries,
                      "reason": (
                          "Multiple TV catalog entries share "
                          "the same TMDB show ID, but their "
                          "season structure is ambiguous or "
                          "duplicated."
                      ),
                      "seasons_found":
                          unique_seasons
                  })

              else:

                  # Multiple records with the same TMDB ID and
                  # distinct seasons is exactly what we want.
                  tv_review.append({
                      "issue": "TV_SEASON_STRUCTURE",
                      "severity": "OK",
                      "tmdbId": tmdb_id,
                      "entries": entries,
                      "reason": (
                          "Multiple catalog entries share "
                          "the same TV show TMDB ID and have "
                          "distinct season numbers."
                      ),
                      "seasons_found":
                          unique_seasons
                  })

          # ------------------------------------------------------------
          # Find TV records without season information
          # ------------------------------------------------------------

          for entry in tv_entries:

              if not entry["season"]:

                  # Only flag this when the same TMDB show ID
                  # appears more than once. A single TV record
                  # may legitimately represent a show rather
                  # than a season.

                  tmdb_id = entry["tmdbId"]

                  if (
                      tmdb_id and
                      len(tv_by_tmdb.get(
                          tmdb_id,
                          []
                      )) > 1
                  ):

                      tv_review.append({
                          "issue":
                              "TV_SEASON_MISSING",
                          "severity":
                              "REVIEW",
                          "catalog_index":
                              entry["catalog_index"],
                          "title":
                              entry["title"],
                          "tmdbId":
                              tmdb_id,
                          "reason":
                              "This TV entry shares a TMDB "
                              "show ID with other catalog "
                              "entries but has no season "
                              "number."
                      })

          # ------------------------------------------------------------
          # Check season-specific TMDB data where possible
          # ------------------------------------------------------------

          season_checks = []

          for entry in tv_entries:

              tmdb_id = entry["tmdbId"]
              season = entry["season"]

              if not tmdb_id or not season:
                  continue

              if not season.isdigit():
                  continue

              try:

                  season_number = int(season)

                  season_data = tmdb_request(
                      f"tv/{tmdb_id}/season/"
                      f"{season_number}"
                  )

                  season_checks.append({
                      "catalog_index":
                          entry["catalog_index"],
                      "title":
                          entry["title"],
                      "tmdbId":
                          tmdb_id,
                      "season":
                          season,
                      "tmdb_season_name":
                          season_data.get(
                              "name",
                              ""
                          ),
                      "tmdb_episode_count":
                          len(
                              season_data.get(
                                  "episodes",
                                  []
                              )
                          ),
                      "status":
                          "VERIFIED"
                  })

              except Exception as exc:

                  season_checks.append({
                      "catalog_index":
                          entry["catalog_index"],
                      "title":
                          entry["title"],
                      "tmdbId":
                          tmdb_id,
                      "season":
                          season,
                      "status":
                          "REVIEW",
                      "reason":
                          str(exc)
                  })

          # ------------------------------------------------------------
          # Summary
          # ------------------------------------------------------------

          tv_review_items = [
              item
              for item in tv_review
              if item.get("severity") == "REVIEW"
          ]

          tv_ok_items = [
              item
              for item in tv_review
              if item.get("severity") == "OK"
          ]

          summary = {
              "generated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "catalog_records":
                  len(movies),

              "approved_instruction_counts": {
                  "metadata_updates":
                      len(updates),
                  "title_fixes":
                      len(title_fixes),
                  "category_additions":
                      len(category_additions)
              },

              "approved_changes_prepared":
                  len(approved_changes),

              "tv_audit": {
                  "tv_entries_found":
                      len(tv_entries),
                  "groups_found":
                      len(tv_by_tmdb),
                  "groups_ok":
                      len(tv_ok_items),
                  "issues_for_review":
                      len(tv_review_items),
                  "season_checks":
                      len(season_checks)
              },

              "errors":
                  len(errors),

              "movies_js_modified":
                  False
          }

          # ------------------------------------------------------------
          # Build final review JSON
          # ------------------------------------------------------------

          review = {
              "generated":
                  summary["generated"],

              "summary":
                  summary,

              "approved_changes":
                  approved_changes,

              "tv_season_audit":
                  tv_review,

              "tv_season_checks":
                  season_checks,

              "errors":
                  errors,

              "IMPORTANT":
                  "This file is a review only. "
                  "movies.js was NOT modified."
          }

          REVIEW_JSON.write_text(
              json.dumps(
                  review,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          SUMMARY_JSON.write_text(
              json.dumps(
                  summary,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # HTML review page
          # ------------------------------------------------------------

          def html_escape(value):
              value = clean(value)
              return (
                  value
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          html = []

          html.append("""
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>Movie Metadata Resync Review</title>
          <style>
          body {
              font-family: Arial, sans-serif;
              background: #111;
              color: #eee;
              margin: 30px;
          }

          h1, h2 {
              color: #fff;
          }

          .summary {
              display: grid;
              grid-template-columns:
                  repeat(auto-fit, minmax(180px, 1fr));
              gap: 12px;
              margin: 20px 0;
          }

          .box {
              background: #222;
              padding: 15px;
              border-radius: 8px;
          }

          .number {
              font-size: 28px;
              font-weight: bold;
          }

          table {
              border-collapse: collapse;
              width: 100%;
              margin: 15px 0 40px 0;
          }

          th, td {
              border: 1px solid #444;
              padding: 8px;
              text-align: left;
              vertical-align: top;
          }

          th {
              background: #222;
          }

          .approved {
              color: #7ee787;
          }

          .review {
              color: #ffcc66;
          }

          .error {
              color: #ff7777;
          }

          .ok {
              color: #7ee787;
          }

          code {
              background: #222;
              padding: 2px 5px;
              border-radius: 3px;
          }
          </style>
          </head>
          <body>
          """)

          html.append(
              "<h1>Movie Metadata Resync Review</h1>"
          )

          html.append(
              "<p><strong>movies.js was NOT modified.</strong></p>"
          )

          html.append("<div class='summary'>")

          html.append(
              f"<div class='box'>"
              f"<div>Catalog Records</div>"
              f"<div class='number'>"
              f"{len(movies)}</div></div>"
          )

          html.append(
              f"<div class='box'>"
              f"<div>Approved Changes</div>"
              f"<div class='number approved'>"
              f"{len(approved_changes)}</div></div>"
          )

          html.append(
              f"<div class='box'>"
              f"<div>TV Review Items</div>"
              f"<div class='number review'>"
              f"{len(tv_review_items)}</div></div>"
          )

          html.append(
              f"<div class='box'>"
              f"<div>Errors</div>"
              f"<div class='number error'>"
              f"{len(errors)}</div></div>"
          )

          html.append("</div>")

          # ------------------------------------------------------------
          # Approved changes table
          # ------------------------------------------------------------

          html.append(
              "<h2>Approved Changes</h2>"
          )

          html.append("""
          <table>
          <tr>
              <th>Type</th>
              <th>Catalog Entry</th>
              <th>Current</th>
              <th>Proposed</th>
          </tr>
          """)

          for item in approved_changes:

              before = item.get("before", {})
              after = item.get("after", {})

              html.append(
                  "<tr>"
                  f"<td class='approved'>"
                  f"{html_escape(item['change_type'])}"
                  f"</td>"
                  f"<td>{html_escape(item['catalog_title'])}"
                  f"</td>"
                  f"<td><pre>"
                  f"{html_escape(json.dumps(before, indent=2))}"
                  f"</pre></td>"
                  f"<td><pre>"
                  f"{html_escape(json.dumps(after, indent=2))}"
                  f"</pre></td>"
                  "</tr>"
              )

          html.append("</table>")

          # ------------------------------------------------------------
          # TV audit
          # ------------------------------------------------------------

          html.append(
              "<h2>TV Season Audit</h2>"
          )

          html.append(
              "<p>"
              "This section scans the entire catalog independently "
              "of the approved correction JSON."
              "</p>"
          )

          html.append("""
          <table>
          <tr>
              <th>Status</th>
              <th>TMDB ID</th>
              <th>Entries</th>
              <th>Seasons Found</th>
              <th>Reason</th>
          </tr>
          """)

          for item in tv_review:

              entries_text = "<br>".join(
                  html_escape(
                      f"{entry['title']} "
                      f"(catalog #{entry['catalog_index']}, "
                      f"Season {entry.get('season') or 'MISSING'})"
                  )
                  for entry in item.get(
                      "entries",
                      []
                  )
              )

              status = item.get(
                  "severity",
                  "REVIEW"
              )

              css = (
                  "ok"
                  if status == "OK"
                  else "review"
              )

              html.append(
                  "<tr>"
                  f"<td class='{css}'>"
                  f"{html_escape(status)}</td>"
                  f"<td>{html_escape(item.get('tmdbId', ''))}"
                  f"</td>"
                  f"<td>{entries_text}</td>"
                  f"<td>{html_escape(', '.join("
                  f"item.get('seasons_found', [])"
                  f"))}</td>"
                  f"<td>{html_escape(item.get('reason', ''))}"
                  f"</td>"
                  "</tr>"
              )

          html.append("</table>")

          # ------------------------------------------------------------
          # Season verification
          # ------------------------------------------------------------

          html.append(
              "<h2>TMDB Season Verification</h2>"
          )

          html.append("""
          <table>
          <tr>
              <th>Status</th>
              <th>Catalog Entry</th>
              <th>TMDB ID</th>
              <th>Season</th>
              <th>TMDB Season</th>
              <th>Episodes</th>
          </tr>
          """)

          for item in season_checks:

              status = item.get(
                  "status",
                  "REVIEW"
              )

              css = (
                  "ok"
                  if status == "VERIFIED"
                  else "review"
              )

              html.append(
                  "<tr>"
                  f"<td class='{css}'>"
                  f"{html_escape(status)}</td>"
                  f"<td>{html_escape(item.get('title', ''))}"
                  f"</td>"
                  f"<td>{html_escape(item.get('tmdbId', ''))}"
                  f"</td>"
                  f"<td>{html_escape(item.get('season', ''))}"
                  f"</td>"
                  f"<td>{html_escape(item.get('tmdb_season_name', ''))}"
                  f"</td>"
                  f"<td>{html_escape(str("
                  f"item.get('tmdb_episode_count', '')))}"
                  f"</td>"
                  "</tr>"
              )

          html.append("</table>")

          # ------------------------------------------------------------
          # Errors
          # ------------------------------------------------------------

          html.append(
              "<h2>Errors / Manual Review</h2>"
          )

          if not errors:

              html.append(
                  "<p class='ok'>No errors.</p>"
              )

          else:

              html.append("""
              <table>
              <tr>
                  <th>Title</th>
                  <th>Action</th>
                  <th>Reason</th>
              </tr>
              """)

              for error in errors:

                  html.append(
                      "<tr>"
                      f"<td>{html_escape(error.get('title', ''))}"
                      f"</td>"
                      f"<td>{html_escape(error.get('action', ''))}"
                      f"</td>"
                      f"<td class='error'>"
                      f"{html_escape(error.get('reason', ''))}"
                      f"</td>"
                      "</tr>"
                  )

              html.append("</table>")

          html.append(
              "</body></html>"
          )

          REVIEW_HTML.write_text(
              "".join(html),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Console summary
          # ------------------------------------------------------------

          print()
          print("=" * 70)
          print("RESYNC REVIEW COMPLETE")
          print("=" * 70)
          print()
          print(
              f"Catalog records: "
              f"{len(movies)}"
          )
          print(
              f"Approved changes prepared: "
              f"{len(approved_changes)}"
          )
          print(
              f"TV entries found: "
              f"{len(tv_entries)}"
          )
          print(
              f"TV issues requiring review: "
              f"{len(tv_review_items)}"
          )
          print(
              f"Errors: "
              f"{len(errors)}"
          )
          print()
          print(
              "movies.js was NOT modified."
          )
          print()
          print(
              f"Created: {REVIEW_JSON}"
          )
          print(
              f"Created: {REVIEW_HTML}"
          )
          print(
              f"Created: {SUMMARY_JSON}"
          )
          print()
          PYTHON

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: movie-resync-review
          path: |
            resync_review.json
            resync_review.html
            resync_review_summary.json

      - name: Commit review files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            resync_review.json \
            resync_review.html \
            resync_review_summary.json

          git commit \
            -m "Generate movie metadata resync review" \
            || true

          git push
