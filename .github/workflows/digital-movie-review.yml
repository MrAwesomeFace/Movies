```yaml
name: Digital Movie Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Compare digital movies with catalog
        run: |
          python .github/scripts/digital_movie_compare.py

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-review
          path: |
            digital_movie_review.html
            digital_movie_matches.json
            digital_movie_summary.json
          retention-days: 30
```
