yaml
name: Digital Movie Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare digital file with catalog
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path
          from difflib import SequenceMatcher
          import unicodedata

          MOVIES_FILE = Path("movies.js")
          DIGITAL_FILE = Path("digital_movies_tmdb_ready")

          def normalize(title):
              if not title:
                  return ""

              title = unicodedata.normalize("NFKD", str(title))
              title = title.lower().strip()

              title = title.replace("’", "'")
              title = title.replace("–", "-")
              title = title.replace("—", "-")
              title = title.replace("&", "and")

              title = re.sub(r"\s*\([^)]*(bonus|extended|unrated|director.?s cut)[^)]*\)", "", title, flags=re.I)

              title = re.sub(r"[^a-z0-9]+", " ", title)

              title = re.sub(r"^the\s+", "", title)
              title = re.sub(r"\s+the$", "", title)

              title = re.sub(r"\s+", " ", title).strip()

              return title

          def score(a, b):
              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0

              if a == b:
                  return 1.0

              return SequenceMatcher(None, a, b).ratio()

          def parse_services(value):
              if not value:
                  return []

              value = str(value).strip()

              try:
                  parsed = json.loads(value)

                  if isinstance(parsed, list):
                      return [str(x).strip() for x in parsed if str(x).strip()]

                  if isinstance(parsed, str):
                      return [parsed.strip()]

              except Exception:
                  pass

              value = value.strip("[]")

              return [
                  x.strip().strip("'\"")
                  for x in re.split(r",|;", value)
                  if x.strip().strip("'\"")
              ]

          # --------------------------------------------------
          # LOAD MOVIES.JS
          # --------------------------------------------------

          if not MOVIES_FILE.exists():
              raise SystemExit("ERROR: movies.js was not found.")

          movies_text = MOVIES_FILE.read_text(encoding="utf-8")

          start = movies_text.find("[")
          end = movies_text.rfind("]")

          if start == -1 or end == -1:
              raise SystemExit("ERROR: Could not find the movies array in movies.js.")

          try:
              movies = json.loads(movies_text[start:end + 1])
          except Exception as e:
              raise SystemExit(f"ERROR: Could not read movies.js: {e}")

          # --------------------------------------------------
          # LOAD DIGITAL FILE
          # --------------------------------------------------

          if not DIGITAL_FILE.exists():
              raise SystemExit(
                  "ERROR: digital_movies_tmdb_ready was not found in the repository root."
              )

          try:
              with DIGITAL_FILE.open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  digital_rows = list(csv.DictReader(f))
          except Exception as e:
              raise SystemExit(
                  f"ERROR: Could not read digital_movies_tmdb_ready as CSV: {e}"
              )

          if not digital_rows:
              raise SystemExit(
                  "ERROR: digital_movies_tmdb_ready contained no rows."
              )

          # --------------------------------------------------
          # COMPARE
          # --------------------------------------------------

          matches = []
          new_movies = []
          review = []

          for row_number, row in enumerate(digital_rows, start=2):

              digital_title = str(row.get("title", "")).strip()

              if not digital_title:
                  continue

              services = parse_services(row.get("digital", ""))

              candidates = []

              for index, movie in enumerate(movies):

                  catalog_title = movie.get("title", "")

                  if not catalog_title:
                      continue

                  similarity = score(
                      digital_title,
                      catalog_title
                  )

                  candidates.append({
                      "index": index,
                      "title": catalog_title,
                      "tmdbId": movie.get("tmdbId"),
                      "score": round(similarity, 4)
                  })

              candidates.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              best = candidates[0] if candidates else None
              second = candidates[1] if len(candidates) > 1 else None

              if best and best["score"] >= 0.92:

                  ambiguous = (
                      second
                      and second["score"] >= 0.92
                      and best["score"] - second["score"] < 0.025
                  )

                  if not ambiguous:

                      matches.append({
                          "source_row": row_number,
                          "digital_title": digital_title,
                          "catalog_title": best["title"],
                          "catalog_index": best["index"],
                          "tmdbId": best["tmdbId"],
                          "digital_services": services,
                          "match_score": best["score"],
                          "action": "UPDATE DIGITAL ONLY"
                      })

                      continue

              if best and best["score"] >= 0.72:

                  review.append({
                      "source_row": row_number,
                      "digital_title": digital_title,
                      "digital_services": services,
                      "action": "REVIEW",
                      "candidates": candidates[:5]
                  })

              else:

                  new_movies.append({
                      "source_row": row_number,
                      "digital_title": digital_title,
                      "digital_services": services,
                      "action": "NEW MOVIE",
                      "candidates": candidates[:5]
                  })

          # --------------------------------------------------
          # OUTPUT DATA
          # --------------------------------------------------

          summary = {
              "current_catalog_entries": len(movies),
              "digital_source_rows": len(digital_rows),
              "confident_matches": len(matches),
              "new_movies": len(new_movies),
              "needs_review": len(review)
          }

          results = {
              "summary": summary,
              "matches": matches,
              "new_movies": new_movies,
              "review": review
          }

          Path("digital_movie_matches.json").write_text(
              json.dumps(results, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          Path("digital_movie_summary.json").write_text(
              json.dumps(summary, indent=2),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # HTML
          # --------------------------------------------------

          def esc(value):
              if value is None:
                  return ""

              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          def service_html(services):
              if not services:
                  return "<em>Not specified</em>"

              return " ".join(
                  f'<span class="service">{esc(x)}</span>'
                  for x in services
              )

          html = []

          html.append("""
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>Digital Movie Review</title>

          <style>
          body {
              font-family: Arial, sans-serif;
              background: #f2f2f2;
              color: #222;
              margin: 0;
          }

          header {
              background: #222;
              color: white;
              padding: 25px 35px;
          }

          main {
              max-width: 1200px;
              margin: 25px auto;
              padding: 0 20px;
          }

          .summary {
              background: white;
              padding: 20px;
              border-radius: 10px;
              margin-bottom: 30px;
          }

          .grid {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
              gap: 12px;
          }

          .stat {
              background: #eee;
              padding: 15px;
              border-radius: 8px;
          }

          .number {
              font-size: 28px;
              font-weight: bold;
          }

          .card {
              background: white;
              padding: 20px;
              margin: 14px 0;
              border-radius: 9px;
              border-left: 7px solid #888;
          }

          .match {
              border-left-color: #2d844a;
          }

          .new {
              border-left-color: #3975b5;
          }

          .review {
              border-left-color: #c57b00;
          }

          .service {
              display: inline-block;
              background: #e8e8e8;
              padding: 5px 9px;
              margin: 3px;
              border-radius: 5px;
          }

          .candidate {
              background: #f4f4f4;
              padding: 10px;
              margin: 7px 0;
              border-radius: 6px;
          }

          .score {
              color: #666;
              font-size: 13px;
          }

          </style>
          </head>

          <body>

          <header>
          <h1>Digital Movie Review</h1>
          <p>Comparison of the digital inventory against the current catalog.</p>
          <p><strong>movies.js was NOT modified.</strong></p>
          </header>

          <main>
          """)

          html.append(f"""
          <div class="summary">

          <h2>Summary</h2>

          <div class="grid">

          <div class="stat">
          Current catalog
          <div class="number">{summary["current_catalog_entries"]}</div>
          </div>

          <div class="stat">
          Digital source
          <div class="number">{summary["digital_source_rows"]}</div>
          </div>

          <div class="stat">
          Existing matches
          <div class="number">{summary["confident_matches"]}</div>
          </div>

          <div class="stat">
          New movies
          <div class="number">{summary["new_movies"]}</div>
          </div>

          <div class="stat">
          Needs review
          <div class="number">{summary["needs_review"]}</div>
          </div>

          </div>
          </div>
          """)

          # --------------------------------------------------
          # MATCHES
          # --------------------------------------------------

          html.append("<h2>Existing Movies — Digital Updates</h2>")

          html.append("""
          <p>
          These are confident matches to movies already in the catalog.
          The proposed change is digital information only.
          </p>
          """)

          for item in matches:

              html.append(f"""
              <div class="card match">

              <h3>{esc(item["digital_title"])}</h3>

              <p>
              <strong>Existing catalog:</strong>
              {esc(item["catalog_title"])}
              </p>

              <p>
              <strong>Digital:</strong>
              {service_html(item["digital_services"])}
              </p>

              <p class="score">
              Match score: {item["match_score"]}
              </p>

              <strong>UPDATE DIGITAL ONLY — do not replace other metadata.</strong>

              </div>
              """)

          # --------------------------------------------------
          # NEW
          # --------------------------------------------------

          html.append("<h2>New Movies</h2>")

          html.append("""
          <p>
          These titles did not have a sufficiently confident match
          in the existing catalog. They will need TMDB information
          during Phase 2.
          </p>
          """)

          for item in new_movies:

              html.append(f"""
              <div class="card new">

              <h3>{esc(item["digital_title"])}</h3>

              <p>
              <strong>Digital:</strong>
              {service_html(item["digital_services"])}
              </p>

              <strong>NEW MOVIE — verify before Phase 2.</strong>

              </div>
              """)

          # --------------------------------------------------
          # REVIEW
          # --------------------------------------------------

          html.append("<h2>Needs Review</h2>")

          html.append("""
          <p>
          These titles have possible catalog matches but are not
          confident enough to automatically connect.
          </p>
          """)

          for item in review:

              html.append(f"""
              <div class="card review">

              <h3>{esc(item["digital_title"])}</h3>

              <p>
              <strong>Digital:</strong>
              {service_html(item["digital_services"])}
              </p>

              <h4>Possible matches</h4>
              """)

              for candidate in item["candidates"]:

                  html.append(f"""
                  <div class="candidate">

                  <strong>{esc(candidate["title"])}</strong>

                  <br>
                  TMDB ID: {esc(candidate["tmdbId"])}

                  <br>
                  Similarity: {esc(candidate["score"])}

                  </div>
                  """)

              html.append("</div>")

          html.append("""
          </main>
          </body>
          </html>
          """)

          Path("digital_movie_review.html").write_text(
              "\n".join(html),
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print("DIGITAL MOVIE REVIEW COMPLETE")
          print("========================================")
          print(f"Current catalog: {summary['current_catalog_entries']}")
          print(f"Digital source: {summary['digital_source_rows']}")
          print(f"Existing matches: {summary['confident_matches']}")
          print(f"New movies: {summary['new_movies']}")
          print(f"Needs review: {summary['needs_review']}")
          print("========================================")
          print("")
          print("movies.js was NOT modified.")
          PY

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-review
          path: |
            digital_movie_review.html
            digital_movie_matches.json
            digital_movie_summary.json
          retention-days: 30
