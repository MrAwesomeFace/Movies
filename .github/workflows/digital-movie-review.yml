```yaml
name: Digital Movie Review

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run digital movie review
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_KEY }}
        run: |
          python .github/scripts/digital_movie_review.py

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-review
          path: |
            review.html
            proposed_movies.js
            proposed_changes.json
            review_summary.json
          retention-days: 30
```
