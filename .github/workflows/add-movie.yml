name: Add Movie

on:
  workflow_dispatch:
    inputs:
      tmdb_id:
        description: "TMDB movie or TV ID"
        required: true
        type: string

      media_type:
        description: "Movie or TV"
        required: true
        default: "movie"
        type: choice
        options:
          - movie
          - tv

      season_number:
        description: "TV only: seasons to add - 'all', a list like '1,3,5', a range like '1-8', or a mix like '1-3,5,7-8'. Leave blank for movies, or to add/update a TV show's overall entry without a specific season."
        required: false
        default: ""
        type: string

      physical_dvd:
        description: "Physical: DVD"
        required: true
        default: false
        type: boolean

      physical_bluray:
        description: "Physical: Blu-ray"
        required: true
        default: false
        type: boolean

      physical_4k:
        description: "Physical: 4K"
        required: true
        default: false
        type: boolean

      digital_fandango:
        description: "Digital: Fandango"
        required: true
        default: false
        type: boolean

      digital_movies_anywhere:
        description: "Digital: Movies Anywhere"
        required: true
        default: false
        type: boolean

      digital_prime:
        description: "Digital: Prime"
        required: true
        default: false
        type: boolean

      digital_apple:
        description: "Digital: Apple"
        required: true
        default: false
        type: boolean

      genre_rom_com:
        description: "Genre: Rom-Com"
        required: true
        default: false
        type: boolean

      tag_christmas:
        description: "Tag: Christmas"
        required: true
        default: false
        type: boolean

      tag_baseball:
        description: "Tag: Baseball"
        required: true
        default: false
        type: boolean

      tag_animated:
        description: "Tag: Animated"
        required: true
        default: false
        type: boolean

      other_categories:
        description: "Other categories, comma-separated"
        required: false
        default: ""
        type: string

jobs:
  add-movie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add or update movie
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          MEDIA_TYPE: ${{ inputs.media_type }}
          SEASON_NUMBER: ${{ inputs.season_number }}

          PHYSICAL_DVD: ${{ inputs.physical_dvd }}
          PHYSICAL_BLURAY: ${{ inputs.physical_bluray }}
          PHYSICAL_4K: ${{ inputs.physical_4k }}

          DIGITAL_FANDANGO: ${{ inputs.digital_fandango }}
          DIGITAL_MOVIES_ANYWHERE: ${{ inputs.digital_movies_anywhere }}
          DIGITAL_PRIME: ${{ inputs.digital_prime }}
          DIGITAL_APPLE: ${{ inputs.digital_apple }}

          GENRE_ROM_COM: ${{ inputs.genre_rom_com }}

          TAG_CHRISTMAS: ${{ inputs.tag_christmas }}
          TAG_BASEBALL: ${{ inputs.tag_baseball }}
          TAG_ANIMATED: ${{ inputs.tag_animated }}

          OTHER_CATEGORIES: ${{ inputs.other_categories }}

        run: |
          cat > add_movie.py <<'PYTHON'
          import json
          import os
          import re
          import urllib.error
          import urllib.request


          # =========================================================
          # INPUTS
          # =========================================================

          API_KEY = os.environ["TMDB_API_KEY"]
          TMDB_ID = os.environ["TMDB_ID"].strip()
          MEDIA_TYPE = os.environ["MEDIA_TYPE"].strip().lower()
          SEASON_NUMBER_RAW = os.environ.get("SEASON_NUMBER", "").strip()

          if MEDIA_TYPE not in ("movie", "tv"):
              raise SystemExit("ERROR: media_type must be movie or tv")

          if not TMDB_ID.isdigit():
              raise SystemExit("ERROR: TMDB ID must be a number")

          if SEASON_NUMBER_RAW and MEDIA_TYPE != "tv":
              raise SystemExit(
                  "ERROR: season input only applies when media_type is tv"
              )


          # =========================================================
          # PARSE THE SEASONS INPUT
          #
          # Accepts: blank (no season / movies), a single number
          # ("8"), a comma list ("1,3,5"), a range ("1-8"), a mix
          # of both ("1-3,5,7-8"), or the word "all" (resolved
          # later, once the show's number_of_seasons is known from
          # TMDB - "all" can't be expanded until then).
          # =========================================================

          def parse_season_spec(spec):
              numbers = set()

              for part in spec.split(","):
                  part = part.strip()

                  if not part:
                      continue

                  if "-" in part:
                      bounds = part.split("-")

                      if len(bounds) != 2 or not all(
                          b.strip().isdigit() for b in bounds
                      ):
                          raise SystemExit(
                              f"ERROR: invalid season range '{part}'"
                          )

                      low, high = int(bounds[0]), int(bounds[1])

                      if low > high:
                          low, high = high, low

                      for n in range(low, high + 1):
                          numbers.add(n)

                  elif part.isdigit():
                      numbers.add(int(part))

                  else:
                      raise SystemExit(
                          f"ERROR: invalid season value '{part}'"
                      )

              return sorted(numbers)


          SEASONS_IS_ALL = (
              SEASON_NUMBER_RAW.strip().lower() == "all"
          )

          if SEASON_NUMBER_RAW and not SEASONS_IS_ALL:
              SEASON_LIST = parse_season_spec(SEASON_NUMBER_RAW)

              if not SEASON_LIST:
                  raise SystemExit(
                      "ERROR: no valid season numbers found in input"
                  )

          else:
              SEASON_LIST = None


          # =========================================================
          # SELECTED PHYSICAL FORMATS
          # =========================================================

          selected_physical = []

          if os.environ.get("PHYSICAL_DVD", "").lower() == "true":
              selected_physical.append("DVD")

          if os.environ.get("PHYSICAL_BLURAY", "").lower() == "true":
              selected_physical.append("Blu-ray")

          if os.environ.get("PHYSICAL_4K", "").lower() == "true":
              selected_physical.append("4K")


          # =========================================================
          # SELECTED DIGITAL SERVICES
          # =========================================================

          selected_digital = []

          if os.environ.get("DIGITAL_FANDANGO", "").lower() == "true":
              selected_digital.append("Fandango")

          if os.environ.get("DIGITAL_MOVIES_ANYWHERE", "").lower() == "true":
              selected_digital.append("Movies Anywhere")

          if os.environ.get("DIGITAL_PRIME", "").lower() == "true":
              selected_digital.append("Prime")

          if os.environ.get("DIGITAL_APPLE", "").lower() == "true":
              selected_digital.append("Apple")


          # =========================================================
          # ROM-COM GENRE FLAG
          #
          # Rom-Com lives in the genre string (matched by the same
          # substring filter as every other genre), not in the
          # categories array — categories are for occasion/subject
          # tags like Christmas or Baseball, genre is for what kind
          # of movie it is. Applied after TMDB's own genres so it
          # always appears, regardless of whether TMDB happened to
          # tag the title Comedy/Romance itself.
          # =========================================================

          rom_com_selected = (
              os.environ.get("GENRE_ROM_COM", "").lower() == "true"
          )


          # =========================================================
          # SELECTED CATEGORIES / TAGS
          # =========================================================

          selected_categories = []

          if os.environ.get("TAG_CHRISTMAS", "").lower() == "true":
              selected_categories.append("christmas")

          if os.environ.get("TAG_BASEBALL", "").lower() == "true":
              selected_categories.append("baseball")

          if os.environ.get("TAG_ANIMATED", "").lower() == "true":
              selected_categories.append("animated")


          # Additional free-form categories.
          other_categories = os.environ.get("OTHER_CATEGORIES", "")

          if other_categories.strip():
              for category in other_categories.split(","):
                  category = category.strip().lower()

                  if category and category not in selected_categories:
                      selected_categories.append(category)


          # =========================================================
          # TMDB API HELPER
          # =========================================================

          def tmdb_get(path):
              url = (
                  f"https://api.themoviedb.org/3/{path}"
                  f"?language=en-US"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "BW-Movie-Collection",
                      "Authorization": f"Bearer {API_KEY}",
                      "accept": "application/json",
                  }
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)

              except urllib.error.HTTPError as e:
                  if e.code == 401:
                      raise SystemExit(
                          "ERROR: TMDB returned 401 Unauthorized. "
                          "Check that TMDB_API_KEY is a valid v4 Read Access Token."
                      )

                  if e.code == 404:
                      raise SystemExit(
                          f"ERROR: TMDB ID {TMDB_ID} was not found as a {MEDIA_TYPE}."
                      )

                  raise SystemExit(
                      f"ERROR: TMDB request failed with HTTP {e.code}: "
                      f"{e.read()[:300]}"
                  )


          # =========================================================
          # FETCH SHOW-LEVEL TMDB DATA
          #
          # Fetched once and shared across every season in this
          # run - title, credits, rating, and genres don't change
          # per season, so there's no reason to re-fetch them in
          # a loop.
          # =========================================================

          data = tmdb_get(f"{MEDIA_TYPE}/{TMDB_ID}")


          # =========================================================
          # RESOLVE "all" INTO AN ACTUAL SEASON LIST
          #
          # Can't expand "all" until now, since it depends on
          # TMDB's own number_of_seasons for this show.
          # =========================================================

          if SEASONS_IS_ALL:

              total_seasons = data.get("number_of_seasons")

              if not total_seasons:
                  raise SystemExit(
                      "ERROR: TMDB didn't report a season count "
                      "for this show, so 'all' can't be resolved."
                  )

              SEASON_LIST = list(range(1, total_seasons + 1))


          # SEASONS_TO_PROCESS drives the loop below - either the
          # resolved season list, or a single [None] pass for
          # movies and season-less TV adds.

          SEASONS_TO_PROCESS = (
              SEASON_LIST if SEASON_LIST is not None else [None]
          )


          # =========================================================
          # SEASON ORDINAL (for the title, e.g. "Complete Eighth
          # Season") - only needed up to a reasonable number of
          # seasons; falls back to "N" for anything past that so
          # this never errors out on a long-running show.
          # =========================================================

          SEASON_ORDINALS = {
              1: "First", 2: "Second", 3: "Third", 4: "Fourth",
              5: "Fifth", 6: "Sixth", 7: "Seventh", 8: "Eighth",
              9: "Ninth", 10: "Tenth", 11: "Eleventh", 12: "Twelfth",
              13: "Thirteenth", 14: "Fourteenth", 15: "Fifteenth",
              16: "Sixteenth", 17: "Seventeenth", 18: "Eighteenth",
              19: "Nineteenth", 20: "Twentieth",
          }

          def season_ordinal(n):
              return SEASON_ORDINALS.get(n, str(n))


          # =========================================================
          # BASIC INFORMATION (show-level)
          # =========================================================

          if MEDIA_TYPE == "movie":
              tmdb_title = data.get("title", "")
              year = data.get("release_date", "")[:4]
              runtime_value = data.get("runtime")

          else:
              tmdb_title = data.get("name", "")
              runtime_value = None
              year = data.get("first_air_date", "")[:4]

          if not tmdb_title:
              raise SystemExit("ERROR: TMDB returned no title")


          runtime = ""

          if runtime_value:
              runtime = f"{runtime_value}m"

          elif data.get("episode_run_time"):
              runtime = f"{data['episode_run_time'][0]}m"


          # =========================================================
          # NORMALIZE TITLE FOR ALPHABETICAL SORTING
          #
          # "The Godfather" -> "Godfather, The"
          #
          # tmdbTitle remains the original TMDB title. Season
          # suffix is appended per-season inside the loop below.
          # =========================================================

          def normalize_title(title):
              if title.lower().startswith("the "):
                  return title[4:] + ", The"

              return title


          # =========================================================
          # FETCH CREDITS (show-level, shared across seasons)
          # =========================================================

          credits = tmdb_get(
              f"{MEDIA_TYPE}/{TMDB_ID}/credits"
          )

          cast = [
              person["name"]
              for person in credits.get("cast", [])[:6]
              if person.get("name")
          ]

          directors = [
              person["name"]
              for person in credits.get("crew", [])
              if person.get("job") == "Director"
          ]


          # =========================================================
          # MPA / CONTENT RATING (show-level, shared across seasons)
          #
          # Movies and TV shows keep this on different endpoints
          # with different shapes, so each media type is handled on
          # its own. US certification specifically — other
          # countries rate the same title differently. No US
          # certification on file becomes "NR" (Not Rated) rather
          # than blank, since that's a real, useful answer, not a
          # missing one.
          # =========================================================

          mpa_rating = "NR"

          if MEDIA_TYPE == "movie":

              release_dates = tmdb_get(
                  f"movie/{TMDB_ID}/release_dates"
              )

              for entry in release_dates.get("results", []):

                  if entry.get("iso_3166_1") != "US":
                      continue

                  for release in entry.get("release_dates", []):

                      cert = (release.get("certification") or "").strip()

                      if cert:
                          mpa_rating = cert
                          break

                  break

          else:

              content_ratings = tmdb_get(
                  f"tv/{TMDB_ID}/content_ratings"
              )

              for entry in content_ratings.get("results", []):

                  if entry.get("iso_3166_1") != "US":
                      continue

                  cert = (entry.get("rating") or "").strip()

                  if cert:
                      mpa_rating = cert

                  break


          # =========================================================
          # GENRES (show-level, shared across seasons)
          # =========================================================

          genres = [
              genre["name"]
              for genre in data.get("genres", [])
              if genre.get("name")
          ]

          if rom_com_selected and "Rom-Com" not in genres:
              genres.append("Rom-Com")


          # =========================================================
          # LOAD EXISTING MOVIES (once, before the season loop)
          # =========================================================

          with open("movies.js", "r", encoding="utf-8") as f:
              existing = f.read()

          start = existing.find("[")
          end = existing.rfind("]")

          if start == -1 or end == -1:
              raise SystemExit(
                  "ERROR: Could not locate movies array in movies.js."
              )

          array_text = existing[start:end + 1]

          # Remove trailing commas so JSON can be parsed.
          array_text = re.sub(
              r",(\s*[\}\]])",
              r"\1",
              array_text
          )

          try:
              movies = json.loads(array_text)

          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"ERROR: Could not parse movies.js as JSON: {e}"
              )


          # =========================================================
          # PROCESS EACH SEASON
          #
          # SEASONS_TO_PROCESS is [None] for a movie or a
          # season-less TV add (one pass), or a list of season
          # numbers for a multi-season TV run (one pass per
          # season, each producing its own separate catalog entry
          # or updating its own existing one).
          # =========================================================

          run_summary = []

          for SEASON_NUMBER in SEASONS_TO_PROCESS:

              season_data = None

              if SEASON_NUMBER is not None:
                  season_data = tmdb_get(
                      f"tv/{TMDB_ID}/season/{SEASON_NUMBER}"
                  )

              # Per-season year for TV; movies already have theirs
              # set above and never enter this branch differently.

              if MEDIA_TYPE == "tv":

                  if season_data is not None:
                      season_year = (season_data.get("air_date") or "")[:4]

                  else:
                      season_year = data.get("first_air_date", "")[:4]

              else:
                  season_year = year


              normalized_title = normalize_title(tmdb_title)

              if SEASON_NUMBER is not None:
                  normalized_title = (
                      f"{normalized_title} - Complete "
                      f"{season_ordinal(SEASON_NUMBER)} Season"
                  )


              # -----------------------------------------------------
              # Poster - season-specific when available, falling
              # back to the show's own poster otherwise.
              # -----------------------------------------------------

              poster_path = data.get("poster_path")

              if season_data is not None and season_data.get("poster_path"):
                  poster_path = season_data.get("poster_path")

              poster = ""

              if poster_path:
                  poster = (
                      "https://image.tmdb.org/t/p/w500"
                      + poster_path
                  )


              # -----------------------------------------------------
              # Find existing entry for THIS season specifically.
              # Movies match on tmdbId alone. TV shows match on
              # tmdbId AND season, so each season gets its own
              # entry instead of the second one silently
              # overwriting the first just because they share a
              # tmdbId. A TV show added without a season number
              # matches only against other season-less entries for
              # that same tmdbId.
              # -----------------------------------------------------

              existing_index = None

              for index, movie in enumerate(movies):

                  if str(movie.get("tmdbId")) != str(TMDB_ID):
                      continue

                  existing_season = movie.get("season")

                  if SEASON_NUMBER is not None:

                      if existing_season == SEASON_NUMBER:
                          existing_index = index
                          break

                  else:

                      if existing_season is None:
                          existing_index = index
                          break


              # -----------------------------------------------------
              # UPDATE EXISTING ENTRY
              # -----------------------------------------------------

              if existing_index is not None:

                  existing_movie = movies[existing_index]

                  existing_type = existing_movie.get("type")

                  if existing_type and existing_type != MEDIA_TYPE:
                      raise SystemExit(
                          f"STOP: TMDB ID {TMDB_ID} already exists as "
                          f"type '{existing_type}', but this run specified "
                          f"'{MEDIA_TYPE}'. Nothing was changed."
                      )

                  physical = existing_movie.get("physical", [])

                  if not isinstance(physical, list):
                      physical = [physical] if physical else []

                  for fmt in selected_physical:
                      if fmt not in physical:
                          physical.append(fmt)

                  existing_movie["physical"] = physical


                  digital = existing_movie.get("digital", [])

                  if not isinstance(digital, list):
                      digital = [digital] if digital else []

                  for service in selected_digital:
                      if service not in digital:
                          digital.append(service)

                  existing_movie["digital"] = digital


                  if rom_com_selected:

                      current_genre = existing_movie.get("genre", "") or ""

                      current_tokens = [
                          token.strip()
                          for token in current_genre.split("/")
                          if token.strip()
                      ]

                      if "Rom-Com" not in current_tokens:
                          current_tokens.append("Rom-Com")
                          existing_movie["genre"] = " / ".join(current_tokens)


                  if "rated" not in existing_movie:
                      existing_movie["rated"] = mpa_rating

                  if not (existing_movie.get("tmdbTitle") or "").strip():
                      existing_movie["tmdbTitle"] = tmdb_title


                  categories = existing_movie.get("categories", [])

                  if not isinstance(categories, list):
                      categories = [categories] if categories else []

                  for category in selected_categories:
                      if category not in categories:
                          categories.append(category)

                  if categories:
                      existing_movie["categories"] = categories

                  elif "categories" in existing_movie:
                      del existing_movie["categories"]


                  if "animated" in existing_movie:
                      del existing_movie["animated"]


                  run_summary.append(
                      "UPDATED  | "
                      f"{existing_movie.get('title', normalized_title)} | "
                      f"season={existing_movie.get('season', 'n/a')} | "
                      f"physical={', '.join(physical) or 'none'} | "
                      f"digital={', '.join(digital) or 'none'}"
                  )


              # -----------------------------------------------------
              # ADD BRAND-NEW ENTRY
              # -----------------------------------------------------

              else:

                  movie = {
                      "title": normalized_title,
                      "tmdbTitle": tmdb_title,
                      "type": MEDIA_TYPE,
                      "tmdbId": int(TMDB_ID),
                      "poster": poster,
                      "year": season_year,
                      "runtime": runtime,
                      "genre": " / ".join(genres),
                      "rated": mpa_rating,
                      "director": ", ".join(directors),
                      "cast": ", ".join(cast),
                      "synopsis": data.get("overview", ""),
                      "physical": selected_physical,
                      "digital": selected_digital,
                  }

                  if SEASON_NUMBER is not None:
                      movie["season"] = SEASON_NUMBER

                  if selected_categories:
                      movie["categories"] = selected_categories

                  movies.append(movie)

                  run_summary.append(
                      "ADDED    | "
                      f"{normalized_title} | "
                      f"season={SEASON_NUMBER if SEASON_NUMBER is not None else 'n/a'} | "
                      f"physical={', '.join(selected_physical) or 'none'} | "
                      f"digital={', '.join(selected_digital) or 'none'}"
                  )


          # =========================================================
          # SUMMARY OF EVERYTHING THIS RUN TOUCHED
          # =========================================================

          print("")
          print("========================================")
          print(f"PROCESSED {len(SEASONS_TO_PROCESS)} ENTRY/ENTRIES")
          print("========================================")
          print(f"TMDB ID:    {TMDB_ID}")
          print(f"Type:       {MEDIA_TYPE}")

          for line in run_summary:
              print(line)



          # =========================================================
          # REMOVE LEGACY ANIMATED FIELD FROM ALL ENTRIES
          #
          # This makes sure the new workflow doesn't leave old
          # animated:true fields behind if an entry is touched.
          # =========================================================

          for movie in movies:
              if "animated" in movie:
                  del movie["animated"]


          # =========================================================
          # SORT CATALOG
          #
          # Titles are already normalized when new entries are added.
          # Existing entries remain as they are.
          # =========================================================

          movies.sort(
              key=lambda m: m.get("title", "").lower()
          )


          # =========================================================
          # WRITE MOVIES.JS
          # =========================================================

          new_array = json.dumps(
              movies,
              indent=2,
              ensure_ascii=False
          )

          new_content = (
              existing[:start]
              + new_array
              + existing[end + 1:]
          )

          with open("movies.js", "w", encoding="utf-8") as f:
              f.write(new_content)


          print("")
          print("movies.js updated successfully.")
          print("")


          PYTHON

          python add_movie.py

      - name: Commit updated movies.js
        run: |
          git config user.name "BW Movie Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies.js

          if git diff --cached --quiet; then
            echo "No changes were made."
            exit 0
          fi

          git commit -m "Add/update movie: ${{ inputs.tmdb_id }}"
          git push
