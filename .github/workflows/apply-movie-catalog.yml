name: Apply Movie Catalog Updates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ============================================================
      # APPLY CATALOG UPDATES
      # ============================================================

      - name: Apply approved catalog updates
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |

          python <<'PYTHON'

          import json
          import os
          import re
          import urllib.request
          from pathlib import Path
          from difflib import SequenceMatcher


          # ============================================================
          # FILES
          # ============================================================

          MOVIES_FILE = Path("movies.js")
          APPROVALS_FILE = Path("inventory_cleanup_approvals.json")
          CLEANUP_FILE = Path("inventory_cleanup.json")

          TMDB_API_KEY = os.environ.get("TMDB_API_KEY", "")


          print("=" * 70)
          print("BW MOVIE CATALOG FINALIZER")
          print("=" * 70)


          # ============================================================
          # REQUIRED FILE CHECKS
          # ============================================================

          print()
          print("Checking repository files...")

          if not MOVIES_FILE.exists():
              raise FileNotFoundError(
                  f"ERROR: {MOVIES_FILE} was not found in "
                  f"{Path.cwd()}"
              )

          if not APPROVALS_FILE.exists():
              raise FileNotFoundError(
                  f"ERROR: {APPROVALS_FILE} was not found in "
                  f"{Path.cwd()}"
              )

          if not CLEANUP_FILE.exists():
              raise FileNotFoundError(
                  f"ERROR: {CLEANUP_FILE} was not found in "
                  f"{Path.cwd()}"
              )

          print(f"FOUND: {MOVIES_FILE}")
          print(f"FOUND: {APPROVALS_FILE}")
          print(f"FOUND: {CLEANUP_FILE}")


          # ============================================================
          # LOAD JSON FILES
          # ============================================================

          with APPROVALS_FILE.open("r", encoding="utf-8") as f:
              approvals = json.load(f)

          with CLEANUP_FILE.open("r", encoding="utf-8") as f:
              cleanup = json.load(f)

          approved = approvals.get("approved", [])
          manual_review = approvals.get("manual_review", [])
          undecided = approvals.get("undecided", [])

          remove_titles = cleanup.get("remove", [])
          move_the_titles = cleanup.get("move_the_to_end", [])

          print()
          print(f"Approved items:       {len(approved)}")
          print(f"Manual review items:  {len(manual_review)}")
          print(f"Undecided items:      {len(undecided)}")
          print(f"Removal list:         {len(remove_titles)}")
          print(f'"The" move list:      {len(move_the_titles)}')


          # ============================================================
          # LOAD movies.js
          #
          # The existing file is:
          #
          # const movies = [
          #   ...
          # ];
          #
          # We preserve the wrapper and replace only the array.
          # ============================================================

          movies_text = MOVIES_FILE.read_text(
              encoding="utf-8"
          )

          start = movies_text.find("[")

          end = movies_text.rfind("]")

          if start == -1 or end == -1 or end <= start:
              raise RuntimeError(
                  "ERROR: Could not locate the movies array in movies.js."
              )

          array_text = movies_text[start:end + 1]

          try:
              movies = json.loads(array_text)
          except json.JSONDecodeError as error:
              raise RuntimeError(
                  "ERROR: movies.js contains an array that could not "
                  f"be parsed as JSON: {error}"
              )

          if not isinstance(movies, list):
              raise RuntimeError(
                  "ERROR: movies.js array is not a list."
              )

          original_count = len(movies)

          print()
          print(f"Existing catalog entries: {original_count}")


          # ============================================================
          # HELPERS
          # ============================================================

          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()


          def normalize(value):
              if value is None:
                  return ""

              text = str(value).lower()

              text = text.replace("&", "and")

              text = re.sub(
                  r"['’]",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text
              )

              return " ".join(text.split())


          def loose_normalize(value):
              """
              Used for the separately approved removal list.

              Removes common articles/conjunctions so things like:

                  Fox Hound 2
                  The Fox and the Hound 2

              can still be recognized as the same intended item.
              """

              words = normalize(value).split()

              ignored = {
                  "the",
                  "a",
                  "an",
                  "and"
              }

              return " ".join(
                  word
                  for word in words
                  if word not in ignored
              )


          def tmdb_id(item):
              value = item.get("tmdbId")

              if value in (None, "", 0):
                  return None

              try:
                  return int(value)
              except Exception:
                  return None


          def season_number(item):
              value = item.get("season")

              if value not in (None, ""):
                  try:
                      return int(value)
                  except Exception:
                      pass

              title = clean(item.get("title"))

              match = re.search(
                  r"\bseason\s+(\d+)\b",
                  title,
                  flags=re.IGNORECASE
              )

              if match:
                  return int(match.group(1))

              return None


          def is_tv(item):
              return clean(
                  item.get("type")
              ).lower() == "tv"


          def normalize_list(value):
              if value is None:
                  return []

              if isinstance(value, list):
                  result = []

                  for item in value:
                      if item is None:
                          continue

                      text = clean(item)

                      if text and text not in result:
                          result.append(text)

                  return result

              text = clean(value)

              if not text:
                  return []

              return [text]


          def add_unique(array, value):
              if not isinstance(array, list):
                  array = []

              value = clean(value)

              if value and value not in array:
                  array.append(value)

              return array


          # ============================================================
          # FORMAT HANDLING
          # ============================================================

          def physical_format(value):

              text = clean(value).lower()

              if not text:
                  return None

              if text in {
                  "blu",
                  "blu-ray",
                  "bluray"
              }:
                  return "Blu-ray"

              if "4k" in text or "uhd" in text:
                  return "4K UHD"

              if "blu-ray" in text or "bluray" in text:
                  return "Blu-ray"

              if "dvd" in text:
                  return "DVD"

              if "vhs" in text:
                  return "VHS"

              return clean(value)


          def digital_format(value):

              text = clean(value).lower()

              mapping = {
                  "apple": "Apple",
                  "prime": "Prime",
                  "fandango": "Fandango"
              }

              if text in mapping:
                  return mapping[text]

              return clean(value)


          def add_format(item, fmt):

              fmt = clean(fmt).lower()

              if not fmt:
                  return

              physical_formats = normalize_list(
                  item.get("physical")
              )

              digital_formats = normalize_list(
                  item.get("digital")
              )

              if fmt in {
                  "dvd",
                  "blu",
                  "blu-ray",
                  "bluray",
                  "4k",
                  "uhd",
                  "4k uhd",
                  "vhs"
              }:

                  value = physical_format(fmt)

                  if value:
                      physical_formats = add_unique(
                          physical_formats,
                          value
                      )

                  item["physical"] = physical_formats

              else:

                  value = digital_format(fmt)

                  if value:
                      digital_formats = add_unique(
                          digital_formats,
                          value
                      )

                  item["digital"] = digital_formats


          # ============================================================
          # TMDB API
          # ============================================================

          def tmdb_request(path):

              if not TMDB_API_KEY:
                  return {}

              url = (
                  "https://api.themoviedb.org/3"
                  + path
                  + "?api_key="
                  + TMDB_API_KEY
                  + "&language=en-US"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "BW-Movie-Catalog"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.load(response)

              except Exception as error:

                  print(
                      f"WARNING: TMDB request failed for "
                      f"{path}: {error}"
                  )

                  return {}


          def get_movie_details(tmdb):

              return tmdb_request(
                  f"/movie/{tmdb}"
              )


          def get_tv_details(tmdb):

              return tmdb_request(
                  f"/tv/{tmdb}"
              )


          def get_tv_season_details(
              tmdb,
              season
          ):

              return tmdb_request(
                  f"/tv/{tmdb}/season/{season}"
              )


          # ============================================================
          # CATEGORY DETECTION
          #
          # This follows the same basic logic already used by the
          # existing digital merge workflow.
          # ============================================================

          CHRISTMAS_TERMS = [
              "christmas",
              "xmas",
              "santa",
              "north pole",
              "holiday",
              "holly",
              "grinch",
              "mistletoe",
              "noel",
              "nativity",
              "christmas eve",
              "christmas day",
              "rudolph",
              "frosty"
          ]

          BASEBALL_TERMS = [
              "baseball",
              "major league baseball",
              "mlb",
              "little league",
              "pitcher",
              "pitching",
              "home run",
              "batting",
              "ballplayer",
              "baseball team",
              "yankees",
              "red sox",
              "cubs",
              "cardinals",
              "dodgers",
              "mets",
              "braves",
              "orioles",
              "tigers",
              "twins",
              "athletics",
              "mariners",
              "padres",
              "pirates",
              "rangers",
              "royals",
              "angels",
              "diamondbacks",
              "astros",
              "guardians",
              "brewers",
              "rockies",
              "rays",
              "phillies",
              "nationals",
              "white sox",
              "reds",
              "blue jays",
              "giants"
          ]

          ANIMATED_TERMS = [
              "animation",
              "animated"
          ]


          def detect_categories(item):

              categories = normalize_list(
                  item.get("categories")
              )

              existing_lower = {
                  x.lower()
                  for x in categories
              }

              text = " ".join([
                  clean(item.get("title")),
                  clean(item.get("tmdbTitle")),
                  clean(item.get("synopsis")),
                  clean(item.get("genre")),
                  clean(item.get("director")),
                  clean(item.get("cast"))
              ]).lower()

              if any(
                  term in text
                  for term in CHRISTMAS_TERMS
              ):

                  if "christmas" not in existing_lower:

                      categories.append(
                          "christmas"
                      )


              if any(
                  term in text
                  for term in BASEBALL_TERMS
              ):

                  if "baseball" not in existing_lower:

                      categories.append(
                          "baseball"
                      )


              if any(
                  term in text
                  for term in ANIMATED_TERMS
              ):

                  if "animated" not in existing_lower:

                      categories.append(
                          "animated"
                      )


              if categories:

                  item["categories"] = categories

              elif "categories" in item:

                  item.pop("categories", None)


          # ============================================================
          # FIND EXISTING MOVIE
          # ============================================================

          def find_movie(tmdb):

              if tmdb is None:
                  return None

              for item in movies:

                  if is_tv(item):
                      continue

                  if tmdb_id(item) == tmdb:
                      return item

              return None


          # ============================================================
          # FIND EXISTING TV SEASON
          #
          # IMPORTANT:
          #
          # TV shows are matched by BOTH:
          #
          #   TMDB show ID
          #   season number
          #
          # This means:
          #
          # Dexter Season 2
          # Dexter Season 3
          #
          # remain separate catalog records.
          # ============================================================

          def find_tv_season(
              tmdb,
              season
          ):

              if tmdb is None or season is None:
                  return None

              for item in movies:

                  if not is_tv(item):
                      continue

                  if tmdb_id(item) != tmdb:
                      continue

                  existing_season = season_number(
                      item
                  )

                  if existing_season == season:
                      return item

              return None


          # ============================================================
          # CREATE MOVIE RECORD
          # ============================================================

          def create_movie_record(
              approval
          ):

              tmdb = tmdb_id(
                  approval
              )

              tmdb_title = clean(
                  approval.get("tmdbTitle")
              )

              source_title = clean(
                  approval.get("source_title")
              )

              details = {}

              if tmdb:
                  details = get_movie_details(
                      tmdb
                  )

              title = (
                  tmdb_title
                  or details.get("title")
                  or source_title
              )

              record = {
                  "title": title,
                  "tmdbTitle": (
                      tmdb_title
                      or details.get("title")
                      or title
                  ),
                  "type": "movie",
                  "tmdbId": tmdb,
                  "poster": "",
                  "year": "",
                  "runtime": "",
                  "genre": "",
                  "director": "",
                  "cast": "",
                  "synopsis": "",
                  "physical": [],
                  "digital": []
              }


              if details:

                  record["title"] = (
                      details.get("title")
                      or title
                  )

                  record["tmdbTitle"] = (
                      details.get("title")
                      or record["tmdbTitle"]
                  )

                  release_date = clean(
                      details.get("release_date")
                  )

                  record["year"] = (
                      release_date[:4]
                      if release_date
                      else ""
                  )

                  runtime = details.get(
                      "runtime"
                  )

                  if runtime:
                      record["runtime"] = (
                          f"{runtime}m"
                      )

                  genres = [
                      g.get("name")
                      for g in details.get(
                          "genres",
                          []
                      )
                      if g.get("name")
                  ]

                  record["genre"] = (
                      " / ".join(genres)
                  )

                  record["synopsis"] = (
                      details.get(
                          "overview",
                          ""
                      )
                  )

                  poster = details.get(
                      "poster_path"
                  )

                  if poster:
                      record["poster"] = (
                          "https://image.tmdb.org/t/p/w500"
                          + poster
                      )


              # Preserve the special unique-item rule.
              special = clean(
                  approval.get("special")
              )

              if special:

                  record["special"] = special


              add_format(
                  record,
                  approval.get("format")
              )


              return record


          # ============================================================
          # CREATE TV SEASON RECORD
          # ============================================================

          def create_tv_record(
              approval
          ):

              tmdb = tmdb_id(
                  approval
              )

              season = season_number(
                  approval
              )

              if tmdb is None:
                  raise RuntimeError(
                      "TV approval has no TMDB ID: "
                      + clean(
                          approval.get(
                              "source_title"
                          )
                      )
                  )

              if season is None:
                  raise RuntimeError(
                      "TV approval has no season number: "
                      + clean(
                          approval.get(
                              "source_title"
                          )
                      )
                  )

              show_details = get_tv_details(
                  tmdb
              )

              season_details = (
                  get_tv_season_details(
                      tmdb,
                      season
                  )
              )

              show_title = (
                  clean(
                      approval.get(
                          "tmdbTitle"
                      )
                  )
                  or show_details.get(
                      "name"
                  )
                  or clean(
                      approval.get(
                          "show_title"
                      )
                  )
                  or clean(
                      approval.get(
                          "source_title"
                      )
                  )
              )

              record_title = (
                  f"{show_title} - Season {season}"
              )

              poster = ""

              if season_details.get(
                  "poster_path"
              ):

                  poster = (
                      "https://image.tmdb.org/t/p/w500"
                      + season_details[
                          "poster_path"
                      ]
                  )

              elif show_details.get(
                  "poster_path"
              ):

                  poster = (
                      "https://image.tmdb.org/t/p/w500"
                      + show_details[
                          "poster_path"
                      ]
                  )


              first_air_date = clean(
                  show_details.get(
                      "first_air_date"
                  )
              )

              genres = [
                  g.get("name")
                  for g in show_details.get(
                      "genres",
                      []
                  )
                  if g.get("name")
              ]


              record = {
                  "title": record_title,
                  "tmdbTitle": show_title,
                  "type": "tv",
                  "tmdbId": tmdb,
                  "season": season,
                  "poster": poster,
                  "year": (
                      first_air_date[:4]
                      if first_air_date
                      else ""
                  ),
                  "runtime": "",
                  "genre": " / ".join(genres),
                  "director": "",
                  "cast": "",
                  "synopsis": clean(
                      show_details.get(
                          "overview"
                      )
                  ),
                  "physical": [],
                  "digital": []
              }


              add_format(
                  record,
                  approval.get("format")
              )


              return record


          # ============================================================
          # APPLY APPROVED ITEMS
          # ============================================================

          created = 0
          updated = 0

          print()
          print("=" * 70)
          print("APPLYING APPROVED ITEMS")
          print("=" * 70)


          for approval in approved:

              approval_type = clean(
                  approval.get("type")
              ).lower()

              tmdb = tmdb_id(
                  approval
              )

              fmt = clean(
                  approval.get("format")
              )

              source_title = clean(
                  approval.get(
                      "source_title"
                  )
              )

              special = clean(
                  approval.get(
                      "special"
                  )
              )


              # --------------------------------------------------------
              # TV
              # --------------------------------------------------------

              if approval_type == "tv":

                  season = season_number(
                      approval
                  )

                  existing = find_tv_season(
                      tmdb,
                      season
                  )

                  if existing:

                      add_format(
                          existing,
                          fmt
                      )

                      existing["tmdbId"] = tmdb
                      existing["season"] = season

                      if approval.get(
                          "tmdbTitle"
                      ):

                          existing["tmdbTitle"] = (
                              approval[
                                  "tmdbTitle"
                              ]
                          )

                      if special:
                          existing["special"] = (
                              special
                          )

                      updated += 1

                      print(
                          f"UPDATED TV: "
                          f"{source_title} "
                          f"(season {season})"
                      )

                  else:

                      record = create_tv_record(
                          approval
                      )

                      movies.append(
                          record
                      )

                      created += 1

                      print(
                          f"CREATED TV: "
                          f"{source_title} "
                          f"(season {season})"
                      )

                  continue


              # --------------------------------------------------------
              # MOVIE
              # --------------------------------------------------------

              unique_item = (
                  "unique item" in special.lower()
                  or "do not merge" in special.lower()
              )


              existing = None

              if not unique_item:
                  existing = find_movie(
                      tmdb
                  )


              if existing:

                  add_format(
                      existing,
                      fmt
                  )

                  if approval.get(
                      "tmdbTitle"
                  ):

                      existing["tmdbTitle"] = (
                          approval[
                              "tmdbTitle"
                          ]
                      )

                  if special:
                      existing["special"] = (
                          special
                      )

                  updated += 1

                  print(
                      f"UPDATED MOVIE: "
                      f"{source_title}"
                  )

              else:

                  record = create_movie_record(
                      approval
                  )

                  # ----------------------------------------------------
                  # UNIQUE ITEM
                  #
                  # Do not rename Almost Famous Bootleg to simply
                  # Almost Famous. Preserve the user's inventory title.
                  # ----------------------------------------------------

                  if unique_item:

                      record["title"] = (
                          source_title
                          .strip()
                          .title()
                      )

                      record["special"] = (
                          special
                      )

                  movies.append(
                      record
                  )

                  created += 1

                  print(
                      f"CREATED MOVIE: "
                      f"{source_title}"
                  )


          # ============================================================
          # REMOVE SEPARATELY APPROVED ITEMS
          #
          # These are NOT the 15 manual-review items.
          #
          # They come from inventory_cleanup.json.
          # ============================================================

          print()
          print("=" * 70)
          print("REMOVING APPROVED RETIRED ITEMS")
          print("=" * 70)

          remove_keys = {
              loose_normalize(title)
              for title in remove_titles
          }

          kept = []
          removed = []

          for item in movies:

              item_title = clean(
                  item.get("title")
              )

              item_key = loose_normalize(
                  item_title
              )

              should_remove = (
                  item_key in remove_keys
              )

              if should_remove:

                  removed.append(
                      item_title
                  )

                  print(
                      f"REMOVED: {item_title}"
                  )

              else:

                  kept.append(
                      item
                  )

          movies = kept


          # ============================================================
          # MOVE "THE" TO THE END
          #
          # ONLY the separately approved titles are changed.
          #
          # Example:
          #
          # The American President
          #
          # becomes:
          #
          # American President, The
          # ============================================================

          print()
          print("=" * 70)
          print('APPLYING APPROVED "THE" TITLE MOVES')
          print("=" * 70)


          move_the_keys = {
              normalize(title)
              for title in move_the_titles
          }


          def move_the_to_end(
              title
          ):

              title = clean(title)

              if not title:
                  return title

              if not title.lower().startswith(
                  "the "
              ):
                  return title

              return (
                  title[4:].strip()
                  + ", The"
              )


          for item in movies:

              title = clean(
                  item.get("title")
              )

              if not title:
                  continue

              normalized = normalize(
                  title
              )

              # Also recognize an item already moved.
              if normalized.endswith(
                  " the"
              ):

                  base = normalized[:-4].strip()

                  for original in move_the_keys:

                      original_base = (
                          original[4:].strip()
                          if original.startswith(
                              "the "
                          )
                          else original
                      )

                      if base == original_base:

                          # Already correctly formatted.
                          break

                  continue


              if normalized in move_the_keys:

                  new_title = move_the_to_end(
                      title
                  )

                  if new_title != title:

                      print(
                          f"TITLE: "
                          f"{title} -> {new_title}"
                      )

                      item["title"] = (
                          new_title
                      )


          # ============================================================
          # AUTOMATIC CATEGORY TAGGING
          #
          # Existing categories are preserved.
          #
          # New categories are added when the catalog data clearly
          # identifies:
          #
          #   baseball
          #   christmas
          #   animated
          # ============================================================

          print()
          print("=" * 70)
          print("APPLYING AUTOMATIC CATEGORIES")
          print("=" * 70)


          category_counts = {
              "baseball": 0,
              "christmas": 0,
              "animated": 0
          }


          before_category_state = {}

          for item in movies:

              before_category_state[
                  id(item)
              ] = set(
                  x.lower()
                  for x in normalize_list(
                      item.get(
                          "categories"
                      )
                  )
              )

              detect_categories(
                  item
              )

              after = set(
                  x.lower()
                  for x in normalize_list(
                      item.get(
                          "categories"
                      )
                  )
              )

              for category in category_counts:

                  if (
                      category in after
                      and category not in
                      before_category_state[
                          id(item)
                      ]
                  ):

                      category_counts[
                          category
                      ] += 1

                      print(
                          f"TAGGED: "
                          f"{item.get('title')} "
                          f"-> {category}"
                      )


          # ============================================================
          # SANITIZE TV SEASON FIELDS
          # ============================================================

          for item in movies:

              if is_tv(item):

                  season = season_number(
                      item
                  )

                  if season is not None:

                      item["season"] = (
                          season
                      )


          # ============================================================
          # SORT
          #
          # The title itself controls alphabetical placement.
          #
          # TV seasons remain grouped under the same show.
          # ============================================================

          def sort_key(item):

              title = normalize(
                  item.get(
                      "title",
                      ""
                  )
              )

              season = season_number(
                  item
              )

              if season is None:
                  season_sort = 0
              else:
                  season_sort = season

              return (
                  title,
                  season_sort,
                  normalize(
                      item.get(
                          "type",
                          ""
                      )
                  ),
                  str(
                      tmdb_id(item)
                      or ""
                  )
              )


          movies.sort(
              key=sort_key
          )


          # ============================================================
          # WRITE movies.js
          #
          # Preserve:
          #
          # const movies =
          #
          # and the ending semicolon.
          # ============================================================

          formatted_array = json.dumps(
              movies,
              indent=2,
              ensure_ascii=False
          )

          new_movies_text = (
              movies_text[:start]
              + formatted_array
              + movies_text[end + 1:]
          )

          MOVIES_FILE.write_text(
              new_movies_text,
              encoding="utf-8"
          )


          # ============================================================
          # SANITY CHECK
          # ============================================================

          verify_text = MOVIES_FILE.read_text(
              encoding="utf-8"
          )

          verify_start = verify_text.find(
              "["
          )

          verify_end = verify_text.rfind(
              "]"
          )

          if (
              verify_start == -1
              or verify_end == -1
          ):

              raise RuntimeError(
                  "SANITY CHECK FAILED: "
                  "movies.js no longer contains an array."
              )


          try:

              verify_movies = json.loads(
                  verify_text[
                      verify_start:
                      verify_end + 1
                  ]
              )

          except Exception as error:

              raise RuntimeError(
                  "SANITY CHECK FAILED: "
                  f"movies.js cannot be parsed: {error}"
              )


          if not isinstance(
              verify_movies,
              list
          ):

              raise RuntimeError(
                  "SANITY CHECK FAILED: "
                  "movies.js array is not a list."
              )


          # Make sure no duplicate movie IDs were accidentally created,
          # except where TV seasons are intentionally separate.

          movie_ids = {}

          for item in verify_movies:

              if is_tv(item):
                  continue

              current_id = tmdb_id(
                  item
              )

              if current_id is None:
                  continue

              if current_id in movie_ids:

                  title_a = movie_ids[
                      current_id
                  ]

                  title_b = clean(
                      item.get("title")
                  )

                  # The only intentional duplicate-ID exception is a
                  # separately protected unique item.

                  special_a = clean(
                      next(
                          (
                              x.get(
                                  "special"
                              )
                              for x in verify_movies
                              if tmdb_id(x)
                              == current_id
                              and clean(
                                  x.get(
                                      "title"
                                  )
                              )
                              == title_a
                          ),
                          ""
                      )
                  )

                  special_b = clean(
                      item.get(
                          "special"
                      )
                  )

                  if not (
                      "unique item"
                      in (
                          special_a
                          + " "
                          + special_b
                      ).lower()
                  ):

                      raise RuntimeError(
                          "SANITY CHECK FAILED: "
                          f"duplicate movie TMDB ID "
                          f"{current_id}: "
                          f"{title_a} / {title_b}"
                      )

              else:

                  movie_ids[
                      current_id
                  ] = clean(
                      item.get("title")
                  )


          # ============================================================
          # FINAL REPORT
          # ============================================================

          print()
          print("=" * 70)
          print("FINAL REPORT")
          print("=" * 70)

          print(
              f"Original entries:       {original_count}"
          )

          print(
              f"Approved applied:       {len(approved)}"
          )

          print(
              f"Created:                {created}"
          )

          print(
              f"Updated:                {updated}"
          )

          print(
              f"Removed:                {len(removed)}"
          )

          print(
              f"Final entries:          {len(movies)}"
          )

          print(
              f"Manual review skipped:  {len(manual_review)}"
          )

          print(
              f"Undecided skipped:      {len(undecided)}"
          )

          print()
          print("Automatic category additions:")

          print(
              f"  Baseball:             "
              f"{category_counts['baseball']}"
          )

          print(
              f"  Christmas:            "
              f"{category_counts['christmas']}"
          )

          print(
              f"  Animated:             "
              f"{category_counts['animated']}"
          )

          print()
          print(
              "movies.js successfully updated and validated."
          )

          PYTHON


      # ============================================================
      # SHOW WHAT CHANGED
      # ============================================================

      - name: Show catalog changes
        run: |
          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo ""
          echo "============================================================"
          echo "MOVIES.JS DIFF STATISTICS"
          echo "============================================================"

          git diff --stat -- movies.js

          echo ""
          echo "============================================================"
          echo "REMOVAL / TITLE / CATALOG DIFF"
          echo "============================================================"

          git diff -- movies.js || true


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated catalog
        run: |

          git config user.name "BW Movie Catalog"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies.js

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Apply approved movie catalog updates"

            git push

          fi
