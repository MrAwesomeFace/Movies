name: Enrich Digital Movies with TMDB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-digital-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Enrich digital movies
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 <<'PY'
          import csv
          import json
          import os
          import re
          import time
          import requests

          INPUT_FILE = "digital_movies_import_queue.csv"
          OUTPUT_CSV = "digital_movies_tmdb_enriched.csv"
          OUTPUT_JSON = "digital_movies_tmdb_enriched.json"
          REVIEW_CSV = "digital_movies_tmdb_review.csv"

          API_KEY = os.environ.get("TMDB_API_KEY")

          if not API_KEY:
              raise SystemExit("TMDB_API_KEY secret is missing.")

          HEADERS = {
              "Authorization": "Bearer " + API_KEY,
              "Content-Type": "application/json"
          }

          BASE_URL = "https://api.themoviedb.org/3"


          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()


          def get_year(value):
              match = re.search(
                  r"\b(19\d{2}|20\d{2})\b",
                  clean(value)
              )
              if match:
                  return int(match.group(1))
              return None


          def normalize_title(value):
              value = clean(value).lower()
              value = value.replace("&", "and")
              value = value.replace("’", "'")
              value = re.sub(r"[^a-z0-9]+", " ", value)
              return " ".join(value.split())


          def tmdb_request(path, params=None):
              response = requests.get(
                  BASE_URL + path,
                  headers=HEADERS,
                  params=params,
                  timeout=30
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      "TMDB HTTP " +
                      str(response.status_code) +
                      ": " +
                      response.text[:500]
                  )

              return response.json()


          def get_movie(tmdb_id):
              return tmdb_request(
                  "/movie/" + str(tmdb_id)
              )


          def movie_year(movie):
              release_date = clean(
                  movie.get("release_date")
              )

              if len(release_date) >= 4:
                  try:
                      return int(release_date[:4])
                  except ValueError:
                      pass

              return None


          def title_similarity(a, b):
              a = normalize_title(a)
              b = normalize_title(b)

              if not a or not b:
                  return 0.0

              if a == b:
                  return 1.0

              a_words = set(a.split())
              b_words = set(b.split())

              common = len(a_words & b_words)

              if not common:
                  return 0.0

              return common / max(
                  len(a_words),
                  len(b_words)
              )


          print("========================================")
          print("DIGITAL MOVIE TMDB ENRICHMENT")
          print("========================================")
          print("")

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(
                  "Could not find " + INPUT_FILE
              )


          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              reader = csv.DictReader(f)
              rows = list(reader)


          print("Input rows:", len(rows))

          if not rows:
              raise SystemExit(
                  "The CSV contains zero data rows."
              )


          enriched = []
          reviews = []


          for index, row in enumerate(
              rows,
              start=1
          ):

              title = clean(row.get("title"))
              digital = clean(row.get("digital"))
              status = clean(row.get("status"))
              existing_match = clean(
                  row.get("existing_match")
              )
              supplied_id = clean(
                  row.get("tmdbId")
              )
              source_year = get_year(
                  row.get("year")
              )
              notes = clean(row.get("notes"))


              if not title:
                  continue


              print(
                  "[" +
                  str(index) +
                  "/" +
                  str(len(rows)) +
                  "] " +
                  title
              )


              record = {
                  "title": title,
                  "digital": digital,
                  "status": status,
                  "existing_match": existing_match,
                  "source_tmdbId": supplied_id,
                  "source_year": (
                      source_year
                      if source_year is not None
                      else ""
                  ),
                  "notes": notes,

                  "tmdbId": "",
                  "tmdbTitle": "",
                  "tmdbOriginalTitle": "",
                  "tmdbYear": "",
                  "tmdbReleaseDate": "",
                  "tmdbOverview": "",
                  "tmdbPosterPath": "",
                  "tmdbBackdropPath": "",

                  "match_type": "",
                  "confidence": "",
                  "review": ""
              }


              try:

                  # ==================================================
                  # TMDB ID ALREADY EXISTS
                  # ==================================================

                  if supplied_id:

                      movie = get_movie(
                          supplied_id
                      )

                      tmdb_id = movie.get("id")
                      tmdb_title = clean(
                          movie.get("title")
                      )
                      tmdb_original_title = clean(
                          movie.get("original_title")
                      )
                      tmdb_release_date = clean(
                          movie.get("release_date")
                      )
                      tmdb_year = movie_year(
                          movie
                      )

                      record["tmdbId"] = (
                          tmdb_id
                          if tmdb_id is not None
                          else ""
                      )

                      record["tmdbTitle"] = (
                          tmdb_title
                      )

                      record["tmdbOriginalTitle"] = (
                          tmdb_original_title
                      )

                      record["tmdbYear"] = (
                          tmdb_year
                          if tmdb_year is not None
                          else ""
                      )

                      record["tmdbReleaseDate"] = (
                          tmdb_release_date
                      )

                      record["tmdbOverview"] = clean(
                          movie.get("overview")
                      )

                      record["tmdbPosterPath"] = clean(
                          movie.get("poster_path")
                      )

                      record["tmdbBackdropPath"] = clean(
                          movie.get("backdrop_path")
                      )

                      record["match_type"] = (
                          "TMDB_ID"
                      )

                      record["confidence"] = (
                          "CONFIDENT"
                      )

                      if (
                          source_year is not None
                          and tmdb_year is not None
                          and abs(
                              source_year -
                              tmdb_year
                          ) > 1
                      ):

                          record["confidence"] = (
                              "REVIEW"
                          )

                          record["review"] = (
                              "The supplied TMDB ID "
                              "has a release year that "
                              "differs from the source "
                              "year by more than one year."
                          )

                          reviews.append(record)


                  # ==================================================
                  # NO TMDB ID - SEARCH BY TITLE/YEAR
                  # ==================================================

                  else:

                      params = {
                          "query": title,
                          "include_adult": "false",
                          "language": "en-US",
                          "page": 1
                      }

                      search = tmdb_request(
                          "/search/movie",
                          params
                      )

                      candidates = search.get(
                          "results",
                          []
                      )


                      if not candidates:

                          record["match_type"] = (
                              "NO_RESULT"
                          )

                          record["confidence"] = (
                              "REVIEW"
                          )

                          record["review"] = (
                              "No TMDB movie was found "
                              "for this title."
                          )

                          reviews.append(record)
                          enriched.append(record)

                          continue


                      scored = []


                      for candidate in candidates[:20]:

                          candidate_title = clean(
                              candidate.get("title")
                          )

                          candidate_year = movie_year(
                              candidate
                          )

                          similarity = title_similarity(
                              title,
                              candidate_title
                          )

                          year_difference = None

                          if (
                              source_year is not None
                              and candidate_year is not None
                          ):

                              year_difference = abs(
                                  source_year -
                                  candidate_year
                              )

                          score = similarity

                          if year_difference == 0:
                              score += 0.25

                          elif year_difference == 1:
                              score += 0.10

                          elif (
                              year_difference is not None
                              and year_difference >= 3
                          ):

                              score -= 0.20

                          scored.append({
                              "movie": candidate,
                              "similarity": similarity,
                              "year_difference":
                                  year_difference,
                              "score": score
                          })


                      scored.sort(
                          key=lambda x: x["score"],
                          reverse=True
                      )


                      best = scored[0]

                      best_movie = best["movie"]

                      best_similarity = (
                          best["similarity"]
                      )

                      best_year_difference = (
                          best["year_difference"]
                      )


                      full_movie = get_movie(
                          best_movie.get("id")
                      )


                      tmdb_year = movie_year(
                          full_movie
                      )


                      record["tmdbId"] = (
                          full_movie.get("id")
                          if full_movie.get("id")
                          is not None
                          else ""
                      )

                      record["tmdbTitle"] = clean(
                          full_movie.get("title")
                      )

                      record["tmdbOriginalTitle"] = clean(
                          full_movie.get(
                              "original_title"
                          )
                      )

                      record["tmdbYear"] = (
                          tmdb_year
                          if tmdb_year is not None
                          else ""
                      )

                      record["tmdbReleaseDate"] = clean(
                          full_movie.get(
                              "release_date"
                          )
                      )

                      record["tmdbOverview"] = clean(
                          full_movie.get(
                              "overview"
                          )
                      )

                      record["tmdbPosterPath"] = clean(
                          full_movie.get(
                              "poster_path"
                          )
                      )

                      record["tmdbBackdropPath"] = clean(
                          full_movie.get(
                              "backdrop_path"
                          )
                      )

                      record["match_type"] = (
                          "TMDB_SEARCH"
                      )


                      if (
                          best_similarity >= 0.90
                          and (
                              best_year_difference is None
                              or best_year_difference <= 1
                          )
                      ):

                          record["confidence"] = (
                              "CONFIDENT"
                          )

                      elif (
                          best_similarity >= 0.70
                          and (
                              best_year_difference is None
                              or best_year_difference <= 1
                          )
                      ):

                          record["confidence"] = (
                              "LIKELY"
                          )

                          record["review"] = (
                              "Likely match. "
                              "Manual confirmation "
                              "recommended."
                          )

                          reviews.append(record)

                      else:

                          record["confidence"] = (
                              "REVIEW"
                          )

                          record["review"] = (
                              "TMDB search produced a "
                              "possible match, but the "
                              "title/year match is uncertain."
                          )

                          reviews.append(record)


                  enriched.append(record)


              except Exception as error:

                  record["match_type"] = (
                      "ERROR"
                  )

                  record["confidence"] = (
                      "REVIEW"
                  )

                  record["review"] = (
                      "TMDB error: " +
                      str(error)
                  )

                  enriched.append(record)
                  reviews.append(record)


              time.sleep(0.05)


          # ==========================================================
          # WRITE ENRICHED JSON
          # ==========================================================

          with open(
              OUTPUT_JSON,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  enriched,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ==========================================================
          # WRITE ENRICHED CSV
          # ==========================================================

          fields = [
              "title",
              "digital",
              "status",
              "existing_match",
              "source_tmdbId",
              "source_year",
              "notes",
              "tmdbId",
              "tmdbTitle",
              "tmdbOriginalTitle",
              "tmdbYear",
              "tmdbReleaseDate",
              "tmdbOverview",
              "tmdbPosterPath",
              "tmdbBackdropPath",
              "match_type",
              "confidence",
              "review"
          ]


          with open(
              OUTPUT_CSV,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()

              for record in enriched:

                  writer.writerow({
                      field: record.get(
                          field,
                          ""
                      )
                      for field in fields
                  })


          # ==========================================================
          # WRITE REVIEW CSV
          # ==========================================================

          review_fields = [
              "title",
              "digital",
              "status",
              "existing_match",
              "source_tmdbId",
              "source_year",
              "tmdbId",
              "tmdbTitle",
              "tmdbYear",
              "match_type",
              "confidence",
              "review"
          ]


          with open(
              REVIEW_CSV,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=review_fields
              )

              writer.writeheader()

              for record in reviews:

                  writer.writerow({
                      field: record.get(
                          field,
                          ""
                      )
                      for field in review_fields
                  })


          confident = sum(
              1
              for r in enriched
              if r["confidence"] == "CONFIDENT"
          )

          likely = sum(
              1
              for r in enriched
              if r["confidence"] == "LIKELY"
          )

          review_count = sum(
              1
              for r in enriched
              if r["confidence"] == "REVIEW"
          )

          errors = sum(
              1
              for r in enriched
              if r["match_type"] == "ERROR"
          )


          print("")
          print("========================================")
          print("ENRICHMENT COMPLETE")
          print("========================================")
          print("Rows processed:", len(enriched))
          print("Confident:", confident)
          print("Likely:", likely)
          print("Review:", review_count)
          print("Errors:", errors)
          print("")
          print("Created:")
          print(OUTPUT_CSV)
          print(OUTPUT_JSON)
          print(REVIEW_CSV)

          PY

      - name: Upload enrichment files
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-tmdb-enrichment
          path: |
            digital_movies_tmdb_enriched.csv
            digital_movies_tmdb_enriched.json
            digital_movies_tmdb_review.csv

      - name: Commit enrichment files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital_movies_tmdb_enriched.csv digital_movies_tmdb_enriched.json digital_movies_tmdb_review.csv
          git commit -m "Enrich digital movies with TMDB metadata" || true
          git push
