name: Enrich Digital Movies with TMDB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-digital-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Enrich digital movies
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 <<'PY'
          import csv
          import json
          import os
          import time
          import requests

          INPUT_FILE = "digital_movies_import_queue.csv"
          OUTPUT_CSV = "digital_movies_tmdb_enriched.csv"
          OUTPUT_JSON = "digital_movies_tmdb_enriched.json"
          REVIEW_CSV = "digital_movies_tmdb_review.csv"

          api_key = os.environ.get("TMDB_API_KEY")

          if not api_key:
              raise SystemExit("TMDB_API_KEY secret is missing.")

          headers = {
              "Authorization": "Bearer " + api_key,
              "Content-Type": "application/json"
          }

          base_url = "https://api.themoviedb.org/3"


          def tmdb_get(path):
              response = requests.get(
                  base_url + path,
                  headers=headers,
                  timeout=30
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      "TMDB HTTP " +
                      str(response.status_code) +
                      ": " +
                      response.text[:300]
                  )

              return response.json()


          print("========================================")
          print("DIGITAL MOVIE TMDB ENRICHMENT")
          print("========================================")
          print("")


          if not os.path.exists(INPUT_FILE):
              raise SystemExit(
                  "Could not find " + INPUT_FILE
              )


          # The import file is tab-separated, despite
          # having a .csv extension.
          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.DictReader(
                  f,
                  delimiter="\t"
              )

              rows = list(reader)


          print("Rows loaded:", len(rows))
          print("")


          if not rows:
              raise SystemExit(
                  "ZERO ROWS WERE READ FROM THE INPUT FILE."
              )


          print("First movie:", rows[0].get("title", ""))


          enriched = []
          review_rows = []


          for number, row in enumerate(
              rows,
              start=1
          ):

              title = (row.get("title") or "").strip()
              digital = (row.get("digital") or "").strip()
              status = (row.get("status") or "").strip()
              existing_match = (
                  row.get("existing_match") or ""
              ).strip()
              tmdb_id = (row.get("tmdbId") or "").strip()
              source_year = (row.get("year") or "").strip()
              notes = (row.get("notes") or "").strip()


              if not title:
                  continue


              print(
                  "[" +
                  str(number) +
                  "/" +
                  str(len(rows)) +
                  "] " +
                  title
              )


              record = {
                  "title": title,
                  "digital": digital,
                  "status": status,
                  "existing_match": existing_match,
                  "source_tmdbId": tmdb_id,
                  "source_year": source_year,
                  "notes": notes,

                  "tmdbId": "",
                  "tmdbTitle": "",
                  "tmdbOriginalTitle": "",
                  "tmdbYear": "",
                  "tmdbReleaseDate": "",
                  "tmdbOverview": "",
                  "tmdbPosterPath": "",
                  "tmdbBackdropPath": "",

                  "match_type": "",
                  "confidence": "",
                  "review": ""
              }


              try:

                  if tmdb_id:

                      movie = tmdb_get(
                          "/movie/" + tmdb_id
                      )

                      record["tmdbId"] = movie.get(
                          "id",
                          ""
                      )

                      record["tmdbTitle"] = movie.get(
                          "title",
                          ""
                      )

                      record["tmdbOriginalTitle"] = movie.get(
                          "original_title",
                          ""
                      )

                      release_date = movie.get(
                          "release_date",
                          ""
                      )

                      record["tmdbReleaseDate"] = (
                          release_date
                      )

                      if release_date:
                          record["tmdbYear"] = (
                              release_date[:4]
                          )

                      record["tmdbOverview"] = movie.get(
                          "overview",
                          ""
                      )

                      record["tmdbPosterPath"] = movie.get(
                          "poster_path",
                          ""
                      )

                      record["tmdbBackdropPath"] = movie.get(
                          "backdrop_path",
                          ""
                      )

                      record["match_type"] = (
                          "EXISTING_TMDB_ID"
                      )

                      record["confidence"] = (
                          "CONFIDENT"
                      )


                  else:

                      search = requests.get(
                          base_url + "/search/movie",
                          headers=headers,
                          params={
                              "query": title,
                              "include_adult": "false",
                              "language": "en-US",
                              "page": 1
                          },
                          timeout=30
                      )

                      if search.status_code != 200:
                          raise RuntimeError(
                              "TMDB search HTTP " +
                              str(search.status_code)
                          )

                      results = search.json().get(
                          "results",
                          []
                      )


                      if not results:

                          record["match_type"] = (
                              "NO_RESULT"
                          )

                          record["confidence"] = (
                              "REVIEW"
                          )

                          record["review"] = (
                              "No TMDB result found."
                          )

                          review_rows.append(record)


                      else:

                          best = results[0]

                          movie = tmdb_get(
                              "/movie/" +
                              str(best["id"])
                          )

                          record["tmdbId"] = movie.get(
                              "id",
                              ""
                          )

                          record["tmdbTitle"] = movie.get(
                              "title",
                              ""
                          )

                          record["tmdbOriginalTitle"] = movie.get(
                              "original_title",
                              ""
                          )

                          release_date = movie.get(
                              "release_date",
                              ""
                          )

                          record["tmdbReleaseDate"] = (
                              release_date
                          )

                          if release_date:
                              record["tmdbYear"] = (
                                  release_date[:4]
                              )

                          record["tmdbOverview"] = movie.get(
                              "overview",
                              ""
                          )

                          record["tmdbPosterPath"] = movie.get(
                              "poster_path",
                              ""
                          )

                          record["tmdbBackdropPath"] = movie.get(
                              "backdrop_path",
                              ""
                          )

                          record["match_type"] = (
                              "TMDB_SEARCH"
                          )

                          record["confidence"] = (
                              "REVIEW"
                          )

                          record["review"] = (
                              "TMDB ID was not supplied "
                              "in the import file; "
                              "manual confirmation required."
                          )

                          review_rows.append(record)


              except Exception as error:

                  record["match_type"] = "ERROR"
                  record["confidence"] = "REVIEW"
                  record["review"] = str(error)

                  review_rows.append(record)


              enriched.append(record)

              time.sleep(0.05)


          # ==========================================================
          # WRITE ENRICHED CSV
          # ==========================================================

          fields = [
              "title",
              "digital",
              "status",
              "existing_match",
              "source_tmdbId",
              "source_year",
              "notes",
              "tmdbId",
              "tmdbTitle",
              "tmdbOriginalTitle",
              "tmdbYear",
              "tmdbReleaseDate",
              "tmdbOverview",
              "tmdbPosterPath",
              "tmdbBackdropPath",
              "match_type",
              "confidence",
              "review"
          ]


          with open(
              OUTPUT_CSV,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()

              for record in enriched:

                  writer.writerow({
                      field: record.get(
                          field,
                          ""
                      )
                      for field in fields
                  })


          # ==========================================================
          # WRITE JSON
          # ==========================================================

          with open(
              OUTPUT_JSON,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  enriched,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ==========================================================
          # WRITE REVIEW CSV
          # ==========================================================

          review_fields = [
              "title",
              "digital",
              "status",
              "existing_match",
              "source_tmdbId",
              "source_year",
              "tmdbId",
              "tmdbTitle",
              "tmdbYear",
              "match_type",
              "confidence",
              "review"
          ]


          with open(
              REVIEW_CSV,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=review_fields
              )

              writer.writeheader()

              for record in review_rows:

                  writer.writerow({
                      field: record.get(
                          field,
                          ""
                      )
                      for field in review_fields
                  })


          print("")
          print("========================================")
          print("COMPLETE")
          print("========================================")
          print("Rows processed:", len(enriched))
          print("Review rows:", len(review_rows))
          print("")
          print("Created:", OUTPUT_CSV)
          print("Created:", OUTPUT_JSON)
          print("Created:", REVIEW_CSV)

          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-tmdb-enrichment
          path: |
            digital_movies_tmdb_enriched.csv
            digital_movies_tmdb_enriched.json
            digital_movies_tmdb_review.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital_movies_tmdb_enriched.csv digital_movies_tmdb_enriched.json digital_movies_tmdb_review.csv
          git commit -m "Enrich digital movies with TMDB metadata" || true
          git push
