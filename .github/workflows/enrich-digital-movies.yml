name: Enrich Digital Movies with TMDB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-digital-movies:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          pip install requests

      - name: Enrich digital movie list
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python <<'PYTHON'

          import csv
          import json
          import os
          import re
          import time
          import requests
          from difflib import SequenceMatcher


          # ==========================================================
          # SETTINGS
          # ==========================================================

          INPUT_FILE = "digital_movies_import_queue.csv"

          OUTPUT_FILE = "digital_movies_tmdb_enriched.json"

          REVIEW_FILE = "digital_movies_tmdb_review.csv"

          API_KEY = os.environ.get("TMDB_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "TMDB_API_KEY secret is not configured."
              )

          API_BASE = "https://api.themoviedb.org/3"

          session = requests.Session()


          # ==========================================================
          # NORMALIZATION
          # ==========================================================

          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()


          def normalize_title(title):

              title = clean(title).lower()

              title = title.replace("&", "and")
              title = title.replace("’", "'")
              title = title.replace("–", "-")
              title = title.replace("—", "-")

              title = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  title
              )

              return " ".join(
                  title.split()
              )


          def get_year(value):

              match = re.search(
                  r"\b(19\d{2}|20\d{2})\b",
                  clean(value)
              )

              if match:
                  return int(match.group(1))

              return None


          def movie_year(movie):

              release_date = clean(
                  movie.get("release_date")
              )

              if len(release_date) >= 4:

                  try:
                      return int(
                          release_date[:4]
                      )
                  except ValueError:
                      pass

              return None


          # ==========================================================
          # TMDB API
          # ==========================================================

          def tmdb_get(path, params=None):

              url = API_BASE + path

              response = session.get(
                  url,
                  params=params,
                  headers={
                      "Authorization":
                          "Bearer " + API_KEY
                  },
                  timeout=30
              )

              if response.status_code != 200:

                  raise RuntimeError(
                      "TMDB returned HTTP "
                      + str(response.status_code)
                      + ": "
                      + response.text[:500]
                  )

              return response.json()


          # ==========================================================
          # SCORE SEARCH RESULT
          # ==========================================================

          def score_candidate(
              digital_title,
              digital_year,
              candidate
          ):

              candidate_title = clean(
                  candidate.get("title")
              )

              title_score = SequenceMatcher(
                  None,
                  normalize_title(digital_title),
                  normalize_title(candidate_title)
              ).ratio()

              candidate_year = movie_year(
                  candidate
              )

              year_difference = None

              if (
                  digital_year is not None
                  and candidate_year is not None
              ):

                  year_difference = abs(
                      digital_year -
                      candidate_year
                  )

              score = title_score

              if year_difference == 0:
                  score += 0.10

              elif year_difference == 1:
                  score += 0.04

              elif (
                  year_difference is not None
                  and year_difference >= 3
              ):

                  score -= 0.10

              return {
                  "score": round(score, 4),
                  "title_score": round(
                      title_score,
                      4
                  ),
                  "year_difference":
                      year_difference
              }


          # ==========================================================
          # FETCH COMPLETE MOVIE
          # ==========================================================

          def fetch_movie(tmdb_id):

              return tmdb_get(
                  "/movie/" + str(tmdb_id),
                  {
                      "append_to_response":
                          "credits"
                  }
              )


          # ==========================================================
          # BUILD ENRICHED RECORD
          # ==========================================================

          def build_record(
              row,
              tmdb_movie,
              method,
              confidence,
              title_score=None,
              year_difference=None,
              review_required=False,
              review_reason=""
          ):

              release_date = clean(
                  tmdb_movie.get("release_date")
              )

              return {

                  "digital_title":
                      clean(row.get("title")),

                  "digital_year":
                      get_year(row.get("year")),

                  "digital":
                      clean(row.get("digital")),

                  "source_status":
                      clean(row.get("status")),

                  "source_existing_match":
                      clean(
                          row.get("existing_match")
                      ),

                  "source_notes":
                      clean(row.get("notes")),

                  "tmdb_id":
                      tmdb_movie.get("id"),

                  "tmdb_title":
                      clean(
                          tmdb_movie.get("title")
                      ),

                  "tmdb_original_title":
                      clean(
                          tmdb_movie.get(
                              "original_title"
                          )
                      ),

                  "tmdb_year":
                      (
                          int(release_date[:4])
                          if len(release_date) >= 4
                          else None
                      ),

                  "tmdb_release_date":
                      release_date,

                  "tmdb_overview":
                      clean(
                          tmdb_movie.get("overview")
                      ),

                  "tmdb_poster_path":
                      clean(
                          tmdb_movie.get(
                              "poster_path"
                          )
                      ),

                  "tmdb_backdrop_path":
                      clean(
                          tmdb_movie.get(
                              "backdrop_path"
                          )
                      ),

                  "match_method":
                      method,

                  "confidence":
                      confidence,

                  "title_score":
                      title_score,

                  "year_difference":
                      year_difference,

                  "review_required":
                      review_required,

                  "review_reason":
                      review_reason
              }


          # ==========================================================
          # LOAD DIGITAL FILE
          # ==========================================================

          print("")
          print("========================================")
          print("DIGITAL MOVIE TMDB ENRICHMENT")
          print("========================================")
          print("")

          if not os.path.exists(INPUT_FILE):

              raise SystemExit(
                  "Could not find "
                  + INPUT_FILE
              )


          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as file:

              reader = csv.DictReader(file)

              rows = list(reader)


          print(
              "Digital rows loaded:",
              len(rows)
          )


          # ==========================================================
          # PROCESS MOVIES
          # ==========================================================

          enriched = []

          review_rows = []


          for number, row in enumerate(
              rows,
              start=1
          ):

              title = clean(
                  row.get("title")
              )

              if not title:
                  continue

              digital_year = get_year(
                  row.get("year")
              )

              supplied_tmdb_id = clean(
                  row.get("tmdbId")
              )

              print(
                  "["
                  + str(number)
                  + "/"
                  + str(len(rows))
                  + "] "
                  + title
              )


              # ------------------------------------------------------
              # CASE 1:
              # CSV ALREADY HAS TMDB ID
              # ------------------------------------------------------

              if supplied_tmdb_id:

                  try:

                      movie = fetch_movie(
                          supplied_tmdb_id
                      )

                      tmdb_year = movie_year(
                          movie
                      )

                      year_difference = None

                      if (
                          digital_year is not None
                          and tmdb_year is not None
                      ):

                          year_difference = abs(
                              digital_year -
                              tmdb_year
                          )


                      review_required = False
                      review_reason = ""


                      if (
                          year_difference is not None
                          and year_difference > 1
                      ):

                          review_required = True

                          review_reason = (
                              "Supplied TMDB ID "
                              "has a different "
                              "release year."
                          )


                      record = build_record(
                          row,
                          movie,
                          "SUPPLIED_TMDB_ID",
                          (
                              "REVIEW"
                              if review_required
                              else "CONFIDENT"
                          ),
                          1.0,
                          year_difference,
                          review_required,
                          review_reason
                      )


                      enriched.append(
                          record
                      )


                      if review_required:

                          review_rows.append(
                              record
                          )


                  except Exception as error:

                      record = {
                          "digital_title":
                              title,

                          "digital_year":
                              digital_year,

                          "digital":
                              clean(
                                  row.get(
                                      "digital"
                                  )
                              ),

                          "source_status":
                              clean(
                                  row.get(
                                      "status"
                                  )
                              ),

                          "source_existing_match":
                              clean(
                                  row.get(
                                      "existing_match"
                                  )
                              ),

                          "source_notes":
                              clean(
                                  row.get(
                                      "notes"
                                  )
                              ),

                          "tmdb_id":
                              supplied_tmdb_id,

                          "tmdb_title":
                              "",

                          "tmdb_original_title":
                              "",

                          "tmdb_year":
                              None,

                          "tmdb_release_date":
                              "",

                          "tmdb_overview":
                              "",

                          "tmdb_poster_path":
                              "",

                          "tmdb_backdrop_path":
                              "",

                          "match_method":
                              "TMDB_ID_ERROR",

                          "confidence":
                              "REVIEW",

                          "title_score":
                              None,

                          "year_difference":
                              None,

                          "review_required":
                              True,

                          "review_reason":
                              str(error)
                      }


                      enriched.append(
                          record
                      )

                      review_rows.append(
                          record
                      )


                  time.sleep(0.1)

                  continue


              # ------------------------------------------------------
              # CASE 2:
              # NO TMDB ID
              # SEARCH TMDB
              # ------------------------------------------------------

              try:

                  params = {
                      "query": title,
                      "include_adult": "false",
                      "language": "en-US",
                      "page": 1
                  }

                  if digital_year:

                      params["year"] = digital_year


                  search = tmdb_get(
                      "/search/movie",
                      params
                  )

                  candidates = search.get(
                      "results",
                      []
                  )


                  if not candidates:

                      record = {
                          "digital_title":
                              title,

                          "digital_year":
                              digital_year,

                          "digital":
                              clean(
                                  row.get(
                                      "digital"
                                  )
                              ),

                          "source_status":
                              clean(
                                  row.get(
                                      "status"
                                  )
                              ),

                          "source_existing_match":
                              clean(
                                  row.get(
                                      "existing_match"
                                  )
                              ),

                          "source_notes":
                              clean(
                                  row.get(
                                      "notes"
                                  )
                              ),

                          "tmdb_id":
                              None,

                          "tmdb_title":
                              "",

                          "tmdb_original_title":
                              "",

                          "tmdb_year":
                              None,

                          "tmdb_release_date":
                              "",

                          "tmdb_overview":
                              "",

                          "tmdb_poster_path":
                              "",

                          "tmdb_backdrop_path":
                              "",

                          "match_method":
                              "NO_RESULT",

                          "confidence":
                              "REVIEW",

                          "title_score":
                              None,

                          "year_difference":
                              None,

                          "review_required":
                              True,

                          "review_reason":
                              "TMDB returned no results."
                      }


                      enriched.append(
                          record
                      )

                      review_rows.append(
                          record
                      )

                      time.sleep(0.1)

                      continue


                  # --------------------------------------------------
                  # SCORE ALL CANDIDATES
                  # --------------------------------------------------

                  scored = []


                  for candidate in candidates[:10]:

                      scores = score_candidate(
                          title,
                          digital_year,
                          candidate
                      )

                      scored.append({
                          "movie":
                              candidate,

                          "scores":
                              scores
                      })


                  scored.sort(
                      key=lambda item:
                          item["scores"]["score"],
                      reverse=True
                  )


                  best = scored[0]

                  best_movie = best["movie"]

                  best_scores = best["scores"]


                  # --------------------------------------------------
                  # GET FULL TMDB RECORD
                  # --------------------------------------------------

                  full_movie = fetch_movie(
                      best_movie.get("id")
                  )


                  title_score = (
                      best_scores["title_score"]
                  )

                  year_difference = (
                      best_scores[
                          "year_difference"
                      ]
                  )


                  # --------------------------------------------------
                  # CONFIDENCE
                  # --------------------------------------------------

                  if (
                      title_score >= 0.92
                      and (
                          year_difference is None
                          or year_difference <= 1
                      )
                  ):

                      confidence = "CONFIDENT"

                      review_required = False

                      review_reason = ""


                  elif (
                      title_score >= 0.80
                      and (
                          year_difference is None
                          or year_difference <= 1
                      )
                  ):

                      confidence = "LIKELY"

                      review_required = True

                      review_reason = (
                          "Likely TMDB match; "
                          "manual confirmation "
                          "recommended."
                      )


                  else:

                      confidence = "REVIEW"

                      review_required = True

                      review_reason = (
                          "TMDB search result "
                          "is uncertain."
                      )


                  record = build_record(
                      row,
                      full_movie,
                      "TMDB_SEARCH",
                      confidence,
                      title_score,
                      year_difference,
                      review_required,
                      review_reason
                  )


                  # --------------------------------------------------
                  # SAVE ALTERNATIVE RESULTS
                  # --------------------------------------------------

                  alternatives = []


                  for alternative in scored[1:4]:

                      alt_movie = (
                          alternative["movie"]
                      )

                      alt_scores = (
                          alternative["scores"]
                      )

                      alternatives.append({
                          "tmdb_id":
                              alt_movie.get("id"),

                          "title":
                              clean(
                                  alt_movie.get(
                                      "title"
                                  )
                              ),

                          "year":
                              movie_year(
                                  alt_movie
                              ),

                          "title_score":
                              alt_scores[
                                  "title_score"
                              ],

                          "score":
                              alt_scores[
                                  "score"
                              ]
                      })


                  record["alternatives"] = (
                      alternatives
                  )


                  enriched.append(
                      record
                  )


                  if review_required:

                      review_rows.append(
                          record
                      )


              except Exception as error:

                  record = {
                      "digital_title":
                          title,

                      "digital_year":
                          digital_year,

                      "digital":
                          clean(
                              row.get(
                                  "digital"
                              )
                          ),

                      "source_status":
                          clean(
                              row.get(
                                  "status"
                              )
                          ),

                      "source_existing_match":
                          clean(
                              row.get(
                                  "existing_match"
                              )
                          ),

                      "source_notes":
                          clean(
                              row.get(
                                  "notes"
                              )
                          ),

                      "tmdb_id":
                          None,

                      "tmdb_title":
                          "",

                      "tmdb_original_title":
                          "",

                      "tmdb_year":
                          None,

                      "tmdb_release_date":
                          "",

                      "tmdb_overview":
                          "",

                      "tmdb_poster_path":
                          "",

                      "tmdb_backdrop_path":
                          "",

                      "match_method":
                          "SEARCH_ERROR",

                      "confidence":
                          "REVIEW",

                      "title_score":
                          None,

                      "year_difference":
                          None,

                      "review_required":
                          True,

                      "review_reason":
                          str(error)
                  }


                  enriched.append(
                      record
                  )

                  review_rows.append(
                      record
                  )


              time.sleep(0.1)


          # ==========================================================
          # WRITE JSON
          # ==========================================================

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  enriched,
                  file,
                  indent=2,
                  ensure_ascii=False
              )


          # ==========================================================
          # WRITE REVIEW CSV
          # ==========================================================

          review_fields = [
              "digital_title",
              "digital_year",
              "digital",
              "tmdb_id",
              "tmdb_title",
              "tmdb_year",
              "confidence",
              "title_score",
              "year_difference",
              "review_reason"
          ]


          with open(
              REVIEW_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as file:

              writer = csv.DictWriter(
                  file,
                  fieldnames=review_fields
              )

              writer.writeheader()

              for record in review_rows:

                  writer.writerow({
                      field:
                          record.get(
                              field,
                              ""
                          )
                      for field in review_fields
                  })


          # ==========================================================
          # SUMMARY
          # ==========================================================

          confident = sum(
              1
              for record in enriched
              if record["confidence"]
              == "CONFIDENT"
          )

          likely = sum(
              1
              for record in enriched
              if record["confidence"]
              == "LIKELY"
          )

          review = sum(
              1
              for record in enriched
              if record["review_required"]
          )


          print("")
          print("========================================")
          print("TMDB ENRICHMENT COMPLETE")
          print("========================================")
          print(
              "Movies processed:",
              len(enriched)
          )
          print(
              "Confident:",
              confident
          )
          print(
              "Likely:",
              likely
          )
          print(
              "Manual review:",
              review
          )
          print("")
          print(
              "Created:",
              OUTPUT_FILE
          )
          print(
              "Created:",
              REVIEW_FILE
          )

          PYTHON

      - name: Upload enrichment results
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-tmdb-enrichment
          path: |
            digital_movies_tmdb_enriched.json
            digital_movies_tmdb_review.csv

      - name: Commit enrichment results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add digital_movies_tmdb_enriched.json
          git add digital_movies_tmdb_review.csv

          git commit -m "Enrich digital movies with TMDB metadata" || true

          git push
