name: Enrich Digital Movies with TMDB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Enrich digital movies
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 <<'PY'
          import csv
          import json
          import os
          import re
          import time
          import requests

          INPUT = "digital_movies_import_queue.csv"
          OUTPUT = "digital_movies_tmdb_enriched.json"
          REVIEW = "digital_movies_tmdb_review.csv"

          token = os.environ.get("TMDB_API_KEY")

          if not token:
              raise SystemExit("TMDB_API_KEY secret is missing.")

          headers = {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
          }

          base = "https://api.themoviedb.org/3"

          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()

          def year_from_text(value):
              match = re.search(r"(19\d{2}|20\d{2})", clean(value))
              if match:
                  return int(match.group(1))
              return None

          def normalize(title):
              title = clean(title).lower()
              title = title.replace("&", "and")
              title = re.sub(r"[^a-z0-9]+", " ", title)
              return " ".join(title.split())

          def tmdb_get(path, params=None):
              r = requests.get(
                  base + path,
                  headers=headers,
                  params=params,
                  timeout=30
              )

              if r.status_code != 200:
                  raise RuntimeError(
                      "TMDB HTTP " +
                      str(r.status_code) +
                      ": " +
                      r.text[:300]
                  )

              return r.json()

          def movie_year(movie):
              date = clean(movie.get("release_date"))
              if len(date) >= 4:
                  try:
                      return int(date[:4])
                  except:
                      pass
              return None

          print("Loading " + INPUT)

          with open(
              INPUT,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          print("Rows loaded:", len(rows))

          if not rows:
              raise SystemExit(
                  "The input CSV contains no data rows."
              )

          enriched = []
          review_rows = []

          for index, row in enumerate(rows, 1):

              title = clean(row.get("title"))

              if not title:
                  continue

              source_digital = clean(row.get("digital"))
              supplied_id = clean(row.get("tmdbId"))
              source_year = year_from_text(row.get("year"))

              print(
                  "[" +
                  str(index) +
                  "/" +
                  str(len(rows)) +
                  "] " +
                  title
              )

              record = {
                  "title": title,
                  "digital": source_digital,
                  "source_year": source_year,
                  "source_tmdb_id": supplied_id,
                  "source_tmdb_title": clean(row.get("tmdbTitle")),
                  "source_review": clean(row.get("review")),
                  "source_variants": clean(row.get("source_variants")),

                  "tmdbId": "",
                  "tmdbTitle": "",
                  "originalTitle": "",
                  "year": "",
                  "releaseDate": "",
                  "overview": "",
                  "posterPath": "",
                  "backdropPath": "",

                  "match_type": "",
                  "confidence": "",
                  "review": ""
              }

              try:

                  # ------------------------------------------------
                  # If the CSV already has a TMDB ID, trust it.
                  # ------------------------------------------------

                  if supplied_id:

                      movie = tmdb_get(
                          "/movie/" + supplied_id
                      )

                      record["match_type"] = "EXISTING_TMDB_ID"
                      record["confidence"] = "CONFIDENT"

                  else:

                      # ------------------------------------------------
                      # Search TMDB by title.
                      # ------------------------------------------------

                      params = {
                          "query": title,
                          "include_adult": "false",
                          "language": "en-US",
                          "page": 1
                      }

                      results = tmdb_get(
                          "/search/movie",
                          params
                      ).get("results", [])

                      if not results:

                          record["match_type"] = "NO_RESULT"
                          record["confidence"] = "REVIEW"
                          record["review"] = (
                              "TMDB returned no search results."
                          )

                          enriched.append(record)
                          review_rows.append(record)

                          continue

                      # ------------------------------------------------
                      # Pick the best title/year combination.
                      # ------------------------------------------------

                      best = None
                      best_score = -999

                      for candidate in results[:20]:

                          candidate_title = clean(
                              candidate.get("title")
                          )

                          candidate_year = movie_year(
                              candidate
                          )

                          title_score = 0

                          if normalize(title) == normalize(candidate_title):
                              title_score = 100
                          else:
                              a = normalize(title)
                              b = normalize(candidate_title)

                              if a and b:
                                  common = 0

                                  a_words = set(a.split())
                                  b_words = set(b.split())

                                  common = len(
                                      a_words.intersection(b_words)
                                  )

                                  title_score = (
                                      common /
                                      max(
                                          len(a_words),
                                          len(b_words)
                                      )
                                  ) * 80

                          year_score = 0

                          if (
                              source_year is not None
                              and candidate_year is not None
                          ):

                              difference = abs(
                                  source_year -
                                  candidate_year
                              )

                              if difference == 0:
                                  year_score = 30
                              elif difference == 1:
                                  year_score = 15
                              elif difference == 2:
                                  year_score = 0
                              else:
                                  year_score = -30

                          score = title_score + year_score

                          if score > best_score:

                              best_score = score

                              best = candidate

                      if best is None:

                          record["match_type"] = "NO_RESULT"
                          record["confidence"] = "REVIEW"
                          record["review"] = (
                              "Could not identify a TMDB result."
                          )

                          enriched.append(record)
                          review_rows.append(record)

                          continue

                      movie = tmdb_get(
                          "/movie/" +
                          str(best.get("id"))
                      )

                      candidate_title = clean(
                          movie.get("title")
                      )

                      candidate_year = movie_year(
                          movie
                      )

                      # ------------------------------------------------
                      # Confidence rules.
                      # ------------------------------------------------

                      title_exact = (
                          normalize(title) ==
                          normalize(candidate_title)
                      )

                      year_matches = (
                          source_year is None
                          or candidate_year is None
                          or abs(
                              source_year -
                              candidate_year
                          ) <= 1
                      )

                      if title_exact and year_matches:

                          record["confidence"] = "CONFIDENT"
                          record["match_type"] = "TMDB_SEARCH"

                      elif best_score >= 70 and year_matches:

                          record["confidence"] = "LIKELY"
                          record["match_type"] = "TMDB_SEARCH"
                          record["review"] = (
                              "Likely match; manual confirmation recommended."
                          )

                      else:

                          record["confidence"] = "REVIEW"
                          record["match_type"] = "TMDB_SEARCH"
                          record["review"] = (
                              "TMDB match is uncertain."
                          )

                  # ------------------------------------------------
                  # Store TMDB metadata.
                  # ------------------------------------------------

                  record["tmdbId"] = movie.get("id", "")
                  record["tmdbTitle"] = clean(
                      movie.get("title")
                  )
                  record["originalTitle"] = clean(
                      movie.get("original_title")
                  )
                  record["year"] = (
                      movie_year(movie)
                      if movie_year(movie) is not None
                      else ""
                  )
                  record["releaseDate"] = clean(
                      movie.get("release_date")
                  )
                  record["overview"] = clean(
                      movie.get("overview")
                  )
                  record["posterPath"] = clean(
                      movie.get("poster_path")
                  )
                  record["backdropPath"] = clean(
                      movie.get("backdrop_path")
                  )

                  if record["confidence"] != "CONFIDENT":
                      review_rows.append(record)

                  enriched.append(record)

              except Exception as e:

                  record["match_type"] = "ERROR"
                  record["confidence"] = "REVIEW"
                  record["review"] = str(e)

                  enriched.append(record)
                  review_rows.append(record)

              time.sleep(0.05)

          # ----------------------------------------------------------
          # Write enriched JSON
          # ----------------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  enriched,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ----------------------------------------------------------
          # Write review CSV
          # ----------------------------------------------------------

          fields = [
              "title",
              "digital",
              "source_year",
              "tmdbId",
              "tmdbTitle",
              "year",
              "confidence",
              "match_type",
              "review"
          ]

          with open(
              REVIEW,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()

              for record in review_rows:
                  writer.writerow({
                      field: record.get(field, "")
                      for field in fields
                  })

          confident = sum(
              1
              for r in enriched
              if r["confidence"] == "CONFIDENT"
          )

          likely = sum(
              1
              for r in enriched
              if r["confidence"] == "LIKELY"
          )

          reviews = sum(
              1
              for r in enriched
              if r["confidence"] == "REVIEW"
          )

          print("")
          print("========================================")
          print("TMDB ENRICHMENT COMPLETE")
          print("========================================")
          print("Processed:", len(enriched))
          print("Confident:", confident)
          print("Likely:", likely)
          print("Review:", reviews)
          print("")
          print("Created:", OUTPUT)
          print("Created:", REVIEW)

          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-tmdb-enrichment
          path: |
            digital_movies_tmdb_enriched.json
            digital_movies_tmdb_review.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital_movies_tmdb_enriched.json digital_movies_tmdb_review.csv
          git commit -m "Enrich digital movies with TMDB metadata" || true
          git push
