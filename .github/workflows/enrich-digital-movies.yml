name: Enrich Digital Movies with TMDB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enrich digital movies
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from difflib import SequenceMatcher

          INPUT = "digital_movies_import_queue.csv"
          OUTPUT = "digital_movies_tmdb_enriched.json"

          TOKEN = os.environ["TMDB_TOKEN"]

          if not TOKEN:
              raise SystemExit("TMDB_READ_ACCESS_TOKEN secret is missing.")

          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Content-Type": "application/json"
          }

          def api(path, params=None):
              url = "https://api.themoviedb.org/3" + path

              if params:
                  url += "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize(title):
              title = clean(title).lower()
              title = title.replace("&", "and")
              title = title.replace("’", "'")
              title = title.replace("–", "-")
              title = title.replace("—", "-")

              import re

              title = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  title
              )

              return re.sub(
                  r"\s+",
                  " ",
                  title
              ).strip()

          def get_year(value):
              import re

              match = re.search(
                  r"\b(19\d{2}|20\d{2})\b",
                  clean(value)
              )

              if match:
                  return int(match.group(1))

              return None

          with open(
              INPUT,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              rows = list(
                  csv.DictReader(f)
              )

          print(
              "Digital movies loaded:",
              len(rows)
          )

          output = []

          for number, row in enumerate(
              rows,
              start=1
          ):

              title = clean(
                  row.get("title")
              )

              if not title:
                  continue

              year = get_year(
                  row.get("year")
              )

              tmdb_id = clean(
                  row.get("tmdbId")
              )

              item = {
                  "source_title": title,
                  "source_year": year,
                  "source_digital": clean(
                      row.get("digital")
                  ),
                  "source_status": clean(
                      row.get("status")
                  ),
                  "source_existing_match": clean(
                      row.get("existing_match")
                  ),
                  "source_notes": clean(
                      row.get("notes")
                  ),
                  "tmdb_id": None,
                  "tmdb_title": "",
                  "tmdb_original_title": "",
                  "tmdb_year": None,
                  "tmdb_release_date": "",
                  "tmdb_overview": "",
                  "tmdb_poster_path": "",
                  "tmdb_backdrop_path": "",
                  "match_method": "",
                  "confidence": "",
                  "review_required": False,
                  "review_reason": ""
              }

              print(
                  f"[{number}/{len(rows)}] {title}"
              )

              if tmdb_id:

                  try:

                      movie = api(
                          "/movie/" + tmdb_id
                      )

                      item["tmdb_id"] = movie.get(
                          "id"
                      )

                      item["tmdb_title"] = clean(
                          movie.get("title")
                      )

                      item["tmdb_original_title"] = clean(
                          movie.get("original_title")
                      )

                      item["tmdb_release_date"] = clean(
                          movie.get("release_date")
                      )

                      if item["tmdb_release_date"]:
                          item["tmdb_year"] = int(
                              item["tmdb_release_date"][:4]
                          )

                      item["tmdb_overview"] = clean(
                          movie.get("overview")
                      )

                      item["tmdb_poster_path"] = clean(
                          movie.get("poster_path")
                      )

                      item["tmdb_backdrop_path"] = clean(
                          movie.get("backdrop_path")
                      )

                      item["match_method"] = (
                          "EXISTING_TMDB_ID"
                      )

                      item["confidence"] = (
                          "CONFIDENT"
                      )

                      if (
                          year
                          and item["tmdb_year"]
                          and abs(
                              year - item["tmdb_year"]
                          ) > 1
                      ):

                          item["review_required"] = True

                          item["confidence"] = (
                              "REVIEW"
                          )

                          item["review_reason"] = (
                              "TMDB ID exists but release year differs."
                          )

                  except Exception as exc:

                      item["match_method"] = (
                          "TMDB_ID_ERROR"
                      )

                      item["confidence"] = (
                          "REVIEW"
                      )

                      item["review_required"] = True

                      item["review_reason"] = str(
                          exc
                      )

              else:

                  try:

                      params = {
                          "query": title,
                          "include_adult": "false",
                          "language": "en-US",
                          "page": 1
                      }

                      if year:
                          params["year"] = year

                      search = api(
                          "/search/movie",
                          params
                      )

                      candidates = search.get(
                          "results",
                          []
                      )

                      if not candidates:

                          item["match_method"] = (
                              "NO_RESULT"
                          )

                          item["confidence"] = (
                              "REVIEW"
                          )

                          item["review_required"] = True

                          item["review_reason"] = (
                              "TMDB returned no results."
                          )

                      else:

                          best = None
                          best_score = -1

                          for candidate in candidates[:10]:

                              candidate_title = clean(
                                  candidate.get("title")
                              )

                              title_score = SequenceMatcher(
                                  None,
                                  normalize(title),
                                  normalize(candidate_title)
                              ).ratio()

                              candidate_date = clean(
                                  candidate.get("release_date")
                              )

                              candidate_year = None

                              if len(candidate_date) >= 4:

                                  try:
                                      candidate_year = int(
                                          candidate_date[:4]
                                      )
                                  except ValueError:
                                      pass

                              score = title_score

                              if (
                                  year
                                  and candidate_year
                              ):

                                  difference = abs(
                                      year - candidate_year
                                  )

                                  if difference == 0:
                                      score += 0.10

                                  elif difference == 1:
                                      score += 0.04

                                  elif difference > 2:
                                      score -= 0.10

                              if score > best_score:

                                  best_score = score
                                  best = candidate

                          item["tmdb_id"] = best.get(
                              "id"
                          )

                          item["tmdb_title"] = clean(
                              best.get("title")
                          )

                          item["tmdb_original_title"] = clean(
                              best.get("original_title")
                          )

                          item["tmdb_release_date"] = clean(
                              best.get("release_date")
                          )

                          if item["tmdb_release_date"]:

                              item["tmdb_year"] = int(
                                  item["tmdb_release_date"][:4]
                              )

                          item["tmdb_overview"] = clean(
                              best.get("overview")
                          )

                          item["tmdb_poster_path"] = clean(
                              best.get("poster_path")
                          )

                          item["tmdb_backdrop_path"] = clean(
                              best.get("backdrop_path")
                          )

                          item["match_method"] = (
                              "TMDB_SEARCH"
                          )

                          title_score = SequenceMatcher(
                              None,
                              normalize(title),
                              normalize(item["tmdb_title"])
                          ).ratio()

                          if (
                              title_score >= 0.92
                              and (
                                  not year
                                  or not item["tmdb_year"]
                                  or abs(
                                      year - item["tmdb_year"]
                                  ) <= 1
                              )
                          ):

                              item["confidence"] = (
                                  "CONFIDENT"
                              )

                          elif title_score >= 0.80:

                              item["confidence"] = (
                                  "LIKELY"
                              )

                              item["review_required"] = True

                              item["review_reason"] = (
                                  "Likely match; manual confirmation recommended."
                              )

                          else:

                              item["confidence"] = (
                                  "REVIEW"
                              )

                              item["review_required"] = True

                              item["review_reason"] = (
                                  "TMDB match is uncertain."
                              )

                  except Exception as exc:

                      item["match_method"] = (
                          "SEARCH_ERROR"
                      )

                      item["confidence"] = (
                          "REVIEW"
                      )

                      item["review_required"] = True

                      item["review_reason"] = str(
                          exc
                      )

              output.append(item)

              time.sleep(0.1)

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print()
          print(
              "TMDB enrichment complete."
          )

          print(
              "Movies processed:",
              len(output)
          )

          print(
              "Manual reviews:",
              sum(
                  1
                  for item in output
                  if item["review_required"]
              )
          )
          PY

      - name: Upload enrichment result
        uses: actions/upload-artifact@v4
        with:
          name: digital-movie-tmdb-enrichment
          path: digital_movies_tmdb_enriched.json

      - name: Commit enrichment result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add digital_movies_tmdb_enriched.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Enrich digital movies with TMDB metadata"
            git push
