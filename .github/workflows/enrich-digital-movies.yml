name: Enrich Digital Movies with TMDB

on:
workflow_dispatch:

permissions:
contents: write

jobs:
enrich-digital-movies:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Enrich digital movie list
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    run: |
      set -e

      if [ -z "$TMDB_TOKEN" ]; then
        echo "ERROR: TMDB_READ_ACCESS_TOKEN secret is not configured."
        exit 1
      fi

      INPUT="digital_movies_normalized_for_tmdb.csv"
      OUTPUT="digital_movies_tmdb_enriched.json"
      REVIEW="digital_tmdb_review.html"

      if [ ! -f "$INPUT" ]; then
        echo "ERROR: $INPUT was not found."
        exit 1
      fi

      echo "========================================"
      echo "DIGITAL MOVIE TMDB ENRICHMENT"
      echo "========================================"
      echo ""
      echo "Input: $INPUT"
      echo ""

      python3 - <<'PY'
      import csv
      import json
      import os
      import time
      import html
      import urllib.parse
      import urllib.request

      INPUT = "digital_movies_normalized_for_tmdb.csv"
      OUTPUT = "digital_movies_tmdb_enriched.json"
      REVIEW = "digital_tmdb_review.html"

      TOKEN = os.environ["TMDB_TOKEN"]

      BASE_URL = "https://api.themoviedb.org/3"

      HEADERS = {
          "Authorization": f"Bearer {TOKEN}",
          "Content-Type": "application/json;charset=utf-8"
      }


      def tmdb_get(path, params=None):
          if params is None:
              params = {}

          url = BASE_URL + path

          if params:
              url += "?" + urllib.parse.urlencode(params)

          request = urllib.request.Request(
              url,
              headers=HEADERS,
              method="GET"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              return json.loads(response.read().decode("utf-8"))


      def clean(value):
          if value is None:
              return ""

          return str(value).strip()


      def normalize_title(title):
          title = clean(title).lower()

          title = title.replace("&", "and")
          title = title.replace("’", "'")
          title = title.replace("–", "-")
          title = title.replace("—", "-")

          import re

          title = re.sub(r"[^a-z0-9]+", " ", title)

          return re.sub(r"\s+", " ", title).strip()


      def get_year(value):
          import re

          value = clean(value)

          match = re.search(
              r"\b(19\d{2}|20\d{2})\b",
              value
          )

          if match:
              return int(match.group(1))

          return None


      def year_from_result(result):
          release_date = clean(
              result.get("release_date")
          )

          if len(release_date) >= 4:
              try:
                  return int(release_date[:4])
              except ValueError:
                  pass

          return None


      def score_result(title, year, result):
          candidate_title = clean(
              result.get("title")
          )

          title_a = normalize_title(title)
          title_b = normalize_title(candidate_title)

          if title_a and title_a == title_b:
              title_score = 1.0
          else:
              from difflib import SequenceMatcher

              title_score = SequenceMatcher(
                  None,
                  title_a,
                  title_b
              ).ratio()

          candidate_year = year_from_result(result)

          year_difference = None

          if year and candidate_year:
              year_difference = abs(
                  year - candidate_year
              )

          score = title_score

          if year_difference == 0:
              score += 0.10
          elif year_difference == 1:
              score += 0.04
          elif year_difference is not None:
              score -= min(
                  0.15,
                  year_difference * 0.03
              )

          return {
              "title_score": round(title_score, 4),
              "score": round(score, 4),
              "year_difference": year_difference
          }


      def enrich_movie(row, index):
          title = clean(row.get("title"))
          year = get_year(
              row.get("year")
              or row.get("release_year")
          )

          existing_id = clean(
              row.get("tmdbId")
              or row.get("tmdb_id")
          )

          result = {
              "source_row": index,
              "digital_title": title,
              "digital_year": year,
              "digital": clean(row.get("digital")),
              "original_status": clean(row.get("status")),
              "original_existing_match": clean(
                  row.get("existing_match")
              ),
              "original_notes": clean(
                  row.get("notes")
              ),
              "tmdb_id": None,
              "tmdb_title": "",
              "tmdb_original_title": "",
              "tmdb_year": None,
              "tmdb_release_date": "",
              "tmdb_overview": "",
              "tmdb_poster_path": "",
              "tmdb_backdrop_path": "",
              "match_method": "",
              "confidence": "",
              "title_score": None,
              "year_difference": None,
              "review_required": False,
              "review_reason": "",
              "alternatives": []
          }

          if existing_id:
              try:
                  movie = tmdb_get(
                      f"/movie/{existing_id}"
                  )

                  result["tmdb_id"] = movie.get("id")
                  result["tmdb_title"] = clean(
                      movie.get("title")
                  )
                  result["tmdb_original_title"] = clean(
                      movie.get("original_title")
                  )
                  result["tmdb_release_date"] = clean(
                      movie.get("release_date")
                  )
                  result["tmdb_year"] = year_from_result(
                      movie
                  )
                  result["tmdb_overview"] = clean(
                      movie.get("overview")
                  )
                  result["tmdb_poster_path"] = clean(
                      movie.get("poster_path")
                  )
                  result["tmdb_backdrop_path"] = clean(
                      movie.get("backdrop_path")
                  )

                  result["match_method"] = "EXISTING_TMDB_ID"
                  result["confidence"] = "CONFIDENT"

                  if year and result["tmdb_year"]:
                      result["year_difference"] = abs(
                          year - result["tmdb_year"]
                      )

                      if result["year_difference"] > 1:
                          result["review_required"] = True
                          result["confidence"] = "REVIEW"
                          result["review_reason"] = (
                              "Existing TMDB ID has a different release year."
                          )

                  return result

              except Exception as exc:
                  result["match_method"] = "TMDB_ID_ERROR"
                  result["confidence"] = "REVIEW"
                  result["review_required"] = True
                  result["review_reason"] = (
                      f"Could not retrieve TMDB ID {existing_id}: {exc}"
                  )
                  return result

          query_params = {
              "query": title,
              "include_adult": "false",
              "language": "en-US",
              "page": 1
          }

          if year:
              query_params["year"] = year

          try:
              search = tmdb_get(
                  "/search/movie",
                  query_params
              )

          except Exception as exc:
              result["match_method"] = "SEARCH_ERROR"
              result["confidence"] = "REVIEW"
              result["review_required"] = True
              result["review_reason"] = str(exc)
              return result

          results = search.get("results", [])

          if not results:
              result["match_method"] = "NO_RESULT"
              result["confidence"] = "REVIEW"
              result["review_required"] = True
              result["review_reason"] = (
                  "TMDB returned no movie search results."
              )
              return result

          scored = []

          for candidate in results[:10]:
              scores = score_result(
                  title,
                  year,
                  candidate
              )

              scored.append({
                  "result": candidate,
                  "scores": scores
              })

          scored.sort(
              key=lambda x: x["scores"]["score"],
              reverse=True
          )

          best = scored[0]

          best_result = best["result"]
          best_scores = best["scores"]

          result["tmdb_id"] = best_result.get("id")
          result["tmdb_title"] = clean(
              best_result.get("title")
          )
          result["tmdb_original_title"] = clean(
              best_result.get("original_title")
          )
          result["tmdb_release_date"] = clean(
              best_result.get("release_date")
          )
          result["tmdb_year"] = year_from_result(
              best_result
          )
          result["tmdb_overview"] = clean(
              best_result.get("overview")
          )
          result["tmdb_poster_path"] = clean(
              best_result.get("poster_path")
          )
          result["tmdb_backdrop_path"] = clean(
              best_result.get("backdrop_path")
          )

          result["title_score"] = best_scores[
              "title_score"
          ]

          result["year_difference"] = best_scores[
              "year_difference"
          ]

          result["match_method"] = "TMDB_SEARCH"

          for alternative in scored[1:4]:
              alt = alternative["result"]
              alt_scores = alternative["scores"]

              result["alternatives"].append({
                  "tmdb_id": alt.get("id"),
                  "title": clean(
                      alt.get("title")
                  ),
                  "year": year_from_result(
                      alt
                  ),
                  "title_score": alt_scores[
                      "title_score"
                  ],
                  "score": alt_scores[
                      "score"
                  ]
              })

          if (
              best_scores["title_score"] >= 0.92
              and (
                  best_scores["year_difference"] is None
                  or best_scores["year_difference"] <= 1
              )
          ):
              result["confidence"] = "CONFIDENT"

          elif (
              best_scores["title_score"] >= 0.80
              and (
                  best_scores["year_difference"] is None
                  or best_scores["year_difference"] <= 1
              )
          ):
              result["confidence"] = "LIKELY"
              result["review_required"] = True
              result["review_reason"] = (
                  "Likely TMDB match, but manual confirmation is recommended."
              )

          else:
              result["confidence"] = "REVIEW"
              result["review_required"] = True
              result["review_reason"] = (
                  "TMDB search result is not sufficiently certain."
              )

          return result


      print("Loading digital CSV...")

      with open(
          INPUT,
          "r",
          encoding="utf-8-sig",
          newline=""
      ) as f:
          reader = csv.DictReader(f)
          rows = list(reader)

      print(f"Digital rows loaded: {len(rows)}")

      enriched = []

      for index, row in enumerate(rows, start=2):

          title = clean(row.get("title"))

          if not title:
              continue

          print(
              f"[{len(enriched) + 1}/{len(rows)}] "
              f"{title}"
          )

          enriched.append(
              enrich_movie(
                  row,
                  index
              )
          )

          time.sleep(0.15)

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:
          json.dump(
              enriched,
              f,
              indent=2,
              ensure_ascii=False
          )

      print("")
      print(
          f"Wrote {OUTPUT}"
      )


      review_items = [
          item
          for item in enriched
          if item["review_required"]
      ]


      def esc(value):
          return html.escape(
              clean(value)
          )


      html_parts = []

      html_parts.append("""
      <!DOCTYPE html>
      <html>
      <head>
      <meta charset="utf-8">
      <title>Digital Movie TMDB Review</title>
      <style>
      body {
          font-family: Arial, sans-serif;
          margin: 30px;
          background: #f5f5f5;
          color: #222;
      }

      h1 {
          margin-bottom: 5px;
      }

      .summary {
          margin-bottom: 25px;
          padding: 15px;
          background: white;
          border-radius: 8px;
      }

      .movie {
          background: white;
          margin-bottom: 20px;
          padding: 20px;
          border-radius: 8px;
          border-left: 6px solid #777;
      }

      .review {
          border-left-color: #c44;
      }

      .confident {
          color: #287a28;
          font-weight: bold;
      }

      .likely {
          color: #9a6900;
          font-weight: bold;
      }

      .review-label {
          color: #b00000;
          font-weight: bold;
      }

      table {
          border-collapse: collapse;
          width: 100%;
          margin-top: 12px;
      }

      th, td {
          border: 1px solid #ccc;
          padding: 8px;
          text-align: left;
      }

      th {
          background: #eee;
      }

      .alternative {
          margin-top: 8px;
          padding: 8px;
          background: #f7f7f7;
      }

      .small {
          color: #666;
          font-size: 13px;
      }
      </style>
      </head>
      <body>
      """)

      html_parts.append(
          "<h1>Digital Movie TMDB Review</h1>"
      )

      html_parts.append(
          "<div class='summary'>"
          f"<strong>Total digital movies:</strong> {len(enriched)}<br>"
          f"<strong>Manual review required:</strong> {len(review_items)}"
          "</div>"
      )

      if not review_items:
          html_parts.append(
              "<div class='summary'>"
              "<strong>No manual reviews were required.</strong>"
              "</div>"
          )

      for item in review_items:

          confidence = item["confidence"]

          html_parts.append(
              "<div class='movie review'>"
          )

          html_parts.append(
              f"<h2>{esc(item['digital_title'])}</h2>"
          )

          html_parts.append(
              f"<p>Digital year: "
              f"{esc(item['digital_year']) or 'Unknown'}</p>"
          )

          html_parts.append(
              f"<p class='review-label'>"
              f"REVIEW: {esc(item['review_reason'])}"
              f"</p>"
          )

          html_parts.append(
              "<table>"
              "<tr>"
              "<th>Field</th>"
              "<th>TMDB Suggestion</th>"
              "</tr>"
          )

          html_parts.append(
              "<tr>"
              "<td>TMDB ID</td>"
              f"<td>{esc(item['tmdb_id'])}</td>"
              "</tr>"
          )

          html_parts.append(
              "<tr>"
              "<td>Title</td>"
              f"<td>{esc(item['tmdb_title'])}</td>"
              "</tr>"
          )

          html_parts.append(
              "<tr>"
              "<td>Year</td>"
              f"<td>{esc(item['tmdb_year'])}</td>"
              "</tr>"
          )

          html_parts.append(
              "<tr>"
              "<td>Title score</td>"
              f"<td>{esc(item['title_score'])}</td>"
              "</tr>"
          )

          html_parts.append(
              "<tr>"
              "<td>Year difference</td>"
              f"<td>{esc(item['year_difference'])}</td>"
              "</tr>"
          )

          html_parts.append(
              "</table>"
          )

          if item["alternatives"]:

              html_parts.append(
                  "<h3>Other TMDB possibilities</h3>"
              )

              for alt in item["alternatives"]:

                  html_parts.append(
                      "<div class='alternative'>"
                      f"<strong>{esc(alt['title'])}</strong>"
                      f" — {esc(alt['year']) or 'Unknown year'}"
                      f" — TMDB ID {esc(alt['tmdb_id'])}"
                      f" — score {esc(alt['score'])}"
                      "</div>"
                  )

          html_parts.append(
              f"<p class='small'>"
              f"Original CSV status: "
              f"{esc(item['original_status'])}"
              "</p>"
          )

          html_parts.append(
              "</div>"
          )

      html_parts.append(
          "</body></html>"
      )

      with open(
          REVIEW,
          "w",
          encoding="utf-8"
      ) as f:
          f.write(
              "\n".join(html_parts)
          )

      print(
          f"Wrote {REVIEW}"
      )

      print("")
      print("========================================")
      print("TMDB ENRICHMENT COMPLETE")
      print("========================================")
      print(f"Total movies: {len(enriched)}")
      print(
          "Confident: "
          + str(
              sum(
                  1
                  for x in enriched
                  if x["confidence"] == "CONFIDENT"
              )
          )
      )
      print(
          "Likely / review: "
          + str(
              sum(
                  1
                  for x in enriched
                  if x["confidence"] == "LIKELY"
              )
          )
      )
      print(
          "Manual review: "
          + str(len(review_items))
      )
      PY

  - name: Upload TMDB enrichment reports
    uses: actions/upload-artifact@v4
    with:
      name: digital-tmdb-enrichment
      path: |
        digital_movies_tmdb_enriched.json
        digital_tmdb_review.html

  - name: Commit enrichment files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add digital_movies_tmdb_enriched.json
      git add digital_tmdb_review.html

      if git diff --cached --quiet; then
        echo "No enrichment changes to commit."
      else
        git commit -m "Enrich digital movie list with TMDB metadata"
        git push
      fi
```
