name: Enrich Digital Movies with TMDB

on:
workflow_dispatch:

permissions:
contents: write

jobs:
enrich:
runs-on: ubuntu-latest

```
steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Enrich digital movies
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_API_KEY }}
    run: |
      python3 - <<'PY'
      import csv
      import json
      import os
      import time
      import urllib.parse
      import urllib.request
      import re
      from difflib import SequenceMatcher

      INPUT = "digital_movies_import_queue.csv"
      OUTPUT = "digital_movies_tmdb_enriched.json"

      TOKEN = os.environ.get("TMDB_TOKEN", "")

      if not TOKEN:
          raise SystemExit(
              "TMDB_API_KEY secret is missing."
          )

      HEADERS = {
          "Authorization": "Bearer " + TOKEN,
          "Content-Type": "application/json"
      }

      BASE_URL = "https://api.themoviedb.org/3"


      def clean(value):
          if value is None:
              return ""
          return str(value).strip()


      def normalize_title(title):
          title = clean(title).lower()

          title = title.replace("&", "and")
          title = title.replace("’", "'")
          title = title.replace("–", "-")
          title = title.replace("—", "-")

          title = re.sub(
              r"[^a-z0-9]+",
              " ",
              title
          )

          return re.sub(
              r"\s+",
              " ",
              title
          ).strip()


      def get_year(value):
          value = clean(value)

          match = re.search(
              r"\b(19\d{2}|20\d{2})\b",
              value
          )

          if match:
              return int(match.group(1))

          return None


      def tmdb_get(path, params=None):

          url = BASE_URL + path

          if params:
              url += "?" + urllib.parse.urlencode(
                  params
              )

          request = urllib.request.Request(
              url,
              headers=HEADERS,
              method="GET"
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              return json.loads(
                  response.read().decode("utf-8")
              )


      def year_from_movie(movie):

          release_date = clean(
              movie.get("release_date")
          )

          if len(release_date) >= 4:

              try:
                  return int(
                      release_date[:4]
                  )
              except ValueError:
                  pass

          return None


      def score_candidate(
          digital_title,
          digital_year,
          candidate
      ):

          candidate_title = clean(
              candidate.get("title")
          )

          title_score = SequenceMatcher(
              None,
              normalize_title(digital_title),
              normalize_title(candidate_title)
          ).ratio()

          candidate_year = year_from_movie(
              candidate
          )

          year_difference = None

          if (
              digital_year
              and candidate_year
          ):

              year_difference = abs(
                  digital_year - candidate_year
              )

          score = title_score

          if year_difference == 0:
              score += 0.10

          elif year_difference == 1:
              score += 0.04

          elif (
              year_difference is not None
              and year_difference >= 3
          ):

              score -= 0.10

          return {
              "title_score": round(
                  title_score,
                  4
              ),
              "score": round(
                  score,
                  4
              ),
              "year_difference":
                  year_difference
          }


      print(
          "========================================"
      )
      print(
          "DIGITAL MOVIE TMDB ENRICHMENT"
      )
      print(
          "========================================"
      )

      if not os.path.exists(INPUT):

          raise SystemExit(
              "Could not find input file: "
              + INPUT
          )


      print("")
      print(
          "Loading:",
          INPUT
      )

      with open(
          INPUT,
          "r",
          encoding="utf-8-sig",
          newline=""
      ) as f:

          reader = csv.DictReader(f)

          rows = list(reader)


      print(
          "Rows loaded:",
          len(rows)
      )

      print("")


      enriched = []


      for number, row in enumerate(
          rows,
          start=1
      ):

          title = clean(
              row.get("title")
          )

          if not title:
              continue

          year = get_year(
              row.get("year")
          )

          supplied_tmdb_id = clean(
              row.get("tmdbId")
          )

          item = {
              "source_title": title,
              "source_year": year,
              "source_digital": clean(
                  row.get("digital")
              ),
              "source_status": clean(
                  row.get("status")
              ),
              "source_existing_match": clean(
                  row.get("existing_match")
              ),
              "source_notes": clean(
                  row.get("notes")
              ),

              "tmdb_id": None,
              "tmdb_title": "",
              "tmdb_original_title": "",
              "tmdb_year": None,
              "tmdb_release_date": "",
              "tmdb_overview": "",
              "tmdb_poster_path": "",
              "tmdb_backdrop_path": "",

              "match_method": "",
              "confidence": "",
              "title_score": None,
              "year_difference": None,

              "review_required": False,
              "review_reason": "",

              "alternatives": []
          }


          print(
              f"[{number}/{len(rows)}] {title}"
          )


          # ------------------------------------------------
          # Existing TMDB ID
          # ------------------------------------------------

          if supplied_tmdb_id:

              try:

                  movie = tmdb_get(
                      "/movie/" +
                      supplied_tmdb_id
                  )

                  item["tmdb_id"] = movie.get(
                      "id"
                  )

                  item["tmdb_title"] = clean(
                      movie.get("title")
                  )

                  item["tmdb_original_title"] = clean(
                      movie.get("original_title")
                  )

                  item["tmdb_release_date"] = clean(
                      movie.get("release_date")
                  )

                  item["tmdb_year"] = (
                      year_from_movie(movie)
                  )

                  item["tmdb_overview"] = clean(
                      movie.get("overview")
                  )

                  item["tmdb_poster_path"] = clean(
                      movie.get("poster_path")
                  )

                  item["tmdb_backdrop_path"] = clean(
                      movie.get("backdrop_path")
                  )

                  item["match_method"] = (
                      "EXISTING_TMDB_ID"
                  )

                  item["confidence"] = (
                      "CONFIDENT"
                  )

                  if (
                      year
                      and item["tmdb_year"]
                  ):

                      item["year_difference"] = abs(
                          year -
                          item["tmdb_year"]
                      )

                      if (
                          item["year_difference"]
                          > 1
                      ):

                          item["review_required"] = True

                          item["confidence"] = (
                              "REVIEW"
                          )

                          item["review_reason"] = (
                              "Supplied TMDB ID "
                              "has a different "
                              "release year."
                          )


              except Exception as exc:

                  item["match_method"] = (
                      "TMDB_ID_ERROR"
                  )

                  item["confidence"] = (
                      "REVIEW"
                  )

                  item["review_required"] = True

                  item["review_reason"] = (
                      "Could not retrieve supplied "
                      "TMDB ID: "
                      + str(exc)
                  )


          # ------------------------------------------------
          # No TMDB ID - search TMDB
          # ------------------------------------------------

          else:

              try:

                  params = {
                      "query": title,
                      "include_adult": "false",
                      "language": "en-US",
                      "page": 1
                  }

                  if year:

                      params["year"] = year


                  search = tmdb_get(
                      "/search/movie",
                      params
                  )

                  candidates = search.get(
                      "results",
                      []
                  )


                  if not candidates:

                      item["match_method"] = (
                          "NO_RESULT"
                      )

                      item["confidence"] = (
                          "REVIEW"
                      )

                      item["review_required"] = True

                      item["review_reason"] = (
                          "TMDB returned no "
                          "movie results."
                      )


                  else:

                      scored = []


                      for candidate in candidates[:10]:

                          scores = score_candidate(
                              title,
                              year,
                              candidate
                          )

                          scored.append({
                              "movie": candidate,
                              "scores": scores
                          })


                      scored.sort(
                          key=lambda x:
                              x["scores"]["score"],
                          reverse=True
                      )


                      best = scored[0]

                      movie = best["movie"]
                      scores = best["scores"]


                      item["tmdb_id"] = movie.get(
                          "id"
                      )

                      item["tmdb_title"] = clean(
                          movie.get("title")
                      )

                      item["tmdb_original_title"] = clean(
                          movie.get(
                              "original_title"
                          )
                      )

                      item["tmdb_release_date"] = clean(
                          movie.get(
                              "release_date"
                          )
                      )

                      item["tmdb_year"] = (
                          year_from_movie(movie)
                      )

                      item["tmdb_overview"] = clean(
                          movie.get("overview")
                      )

                      item["tmdb_poster_path"] = clean(
                          movie.get("poster_path")
                      )

                      item["tmdb_backdrop_path"] = clean(
                          movie.get("backdrop_path")
                      )

                      item["title_score"] = (
                          scores["title_score"]
                      )

                      item["year_difference"] = (
                          scores["year_difference"]
                      )

                      item["match_method"] = (
                          "TMDB_SEARCH"
                      )


                      # Store the next three
                      # possibilities for review.

                      for alternative in scored[1:4]:

                          alt_movie = (
                              alternative["movie"]
                          )

                          alt_scores = (
                              alternative["scores"]
                          )

                          item["alternatives"].append({
                              "tmdb_id":
                                  alt_movie.get("id"),

                              "title":
                                  clean(
                                      alt_movie.get(
                                          "title"
                                      )
                                  ),

                              "year":
                                  year_from_movie(
                                      alt_movie
                                  ),

                              "title_score":
                                  alt_scores[
                                      "title_score"
                                  ],

                              "score":
                                  alt_scores[
                                      "score"
                                  ]
                          })


                      # ----------------------------------------
                      # Confidence rules
                      # ----------------------------------------

                      if (
                          scores["title_score"] >= 0.92
                          and (
                              year is None
                              or item["tmdb_year"] is None
                              or scores[
                                  "year_difference"
                              ] <= 1
                          )
                      ):

                          item["confidence"] = (
                              "CONFIDENT"
                          )


                      elif (
                          scores["title_score"] >= 0.80
                          and (
                              year is None
                              or item["tmdb_year"] is None
                              or scores[
                                  "year_difference"
                              ] <= 1
                          )
                      ):

                          item["confidence"] = (
                              "LIKELY"
                          )

                          item["review_required"] = True

                          item["review_reason"] = (
                              "Likely TMDB match; "
                              "manual confirmation "
                              "recommended."
                          )


                      else:

                          item["confidence"] = (
                              "REVIEW"
                          )

                          item["review_required"] = True

                          item["review_reason"] = (
                              "TMDB search result "
                              "is uncertain."
                          )


              except Exception as exc:

                  item["match_method"] = (
                      "SEARCH_ERROR"
                  )

                  item["confidence"] = (
                      "REVIEW"
                  )

                  item["review_required"] = True

                  item["review_reason"] = (
                      "TMDB search failed: "
                      + str(exc)
                  )


          enriched.append(item)

          time.sleep(0.1)


      # ------------------------------------------------------
      # Write JSON
      # ------------------------------------------------------

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:

          json.dump(
              enriched,
              f,
              indent=2,
              ensure_ascii=False
          )


      confident = sum(
          1
          for item in enriched
          if item["confidence"] == "CONFIDENT"
      )

      likely = sum(
          1
          for item in enriched
          if item["confidence"] == "LIKELY"
      )

      reviews = sum(
          1
          for item in enriched
          if item["review_required"]
      )


      print("")
      print(
          "========================================"
      )
      print(
          "TMDB ENRICHMENT COMPLETE"
      )
      print(
          "========================================"
      )

      print(
          "Movies processed:",
          len(enriched)
      )

      print(
          "Confident:",
          confident
      )

      print(
          "Likely:",
          likely
      )

      print(
          "Manual review:",
          reviews
      )

      print(
          "Output:",
          OUTPUT
      )

      PY

  - name: Upload enrichment result
    uses: actions/upload-artifact@v4
    with:
      name: digital-movie-tmdb-enrichment
      path: digital_movies_tmdb_enriched.json

  - name: Commit enrichment result
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add digital_movies_tmdb_enriched.json

      git commit -m "Enrich digital movies with TMDB metadata" || echo "Nothing new to commit"

      git push
```
