name: Repair TMDB Movie Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-tmdb:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECK OUT REPOSITORY
      # ==========================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # ==========================================================
      # SET UP PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ==========================================================
      # INSTALL REQUESTS
      # ==========================================================

      - name: Install requests
        run: |
          pip install requests


      # ==========================================================
      # REPAIR / UPDATE CATALOG
      # ==========================================================

      - name: Repair TMDB data and add missing TV seasons
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

        run: |

          python <<'PYTHON'

          import json
          import os
          import re
          import requests
          import sys
          from collections import Counter


          # ======================================================
          # SETTINGS
          # ======================================================

          API_KEY = os.environ.get("TMDB_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "TMDB_API_KEY secret is not configured."
              )

          API_BASE = "https://api.themoviedb.org/3"

          POSTER_BASE = "https://image.tmdb.org/t/p/w500"

          session = requests.Session()


          # ======================================================
          # VERIFIED MOVIE TMDB IDs
          # ======================================================

          REPAIRS = {

              "Don't Say a Word": 12103,
              "Dirty Work": 14577,
              "Dickie Roberts": 13778,
              "Chitty Chitty Bang Bang": 11708,
              "Bull Durham": 287,
              "Eight Men Out": 13554,
              "Field of Dreams": 2323,
              "Ghost Town": 12797,
              "Gone in 60 Seconds": 9679,
              "Home Alone": 771,
              "In Her Shoes": 11931,
              "Johnny Dangerously": 16806,
              "Kickboxer": 10222,
              "Laws of Attraction": 11141,
              "Major League": 9942,
              "Major League 2": 11067,
              "McLintock": 15263,
              "Men in Black": 607,
              "Men in Black 2": 608,
              "Mr. Destiny": 2612,
              "Loaded Weapon 1": 9644,
              "Overboard": 10780,
              "Point Break": 1089,
              "Red Eye": 11460,
              "Rudolph": 13382,
              "School for Scoundrels": 9842,
              "Stealth": 10048,
              "Swimfan": 20616,
              "Swingers": 10218,
              "The Dukes of Hazzard": 6519,
              "The Ex": 13171,
              "The Fan": 9566,
              "The Invention of Lying": 23082,
              "The Lion King": 8587,
              "The Natural": 11393,
              "The Object of My Affection": 17127,
              "The Program": 18133,
              "The Recruit": 1647,
              "The Scout": 35233,
              "The Tick": 14651,
              "Toys": 11597,
              "Under Suspicion": 10562,
              "Road House": 10135,
              "Breach": 4169,
              "Eye See You": 10375,
              "Benchwarmer": 9957,
              "Hush": 17941
          }


          # ======================================================
          # MOVIES THAT SHOULD BE ADDED IF MISSING
          # ======================================================

          NEW_MOVIES = {

              "The Ex": {
                  "tmdbId": 13171,
                  "physical": ["DVD"],
                  "digital": []
              },

              "F1": {
                  "tmdbId": 911430,
                  "physical": [
                      "4K",
                      "Blu-ray"
                  ],
                  "digital": []
              }

          }


          # ======================================================
          # TV SERIES THAT MUST HAVE EVERY SEASON
          # ======================================================

          TV_SERIES = {

              "Scrubs": {
                  "tmdbId": 4556,
                  "seasons": 9
              },

              "Friends": {
                  "tmdbId": 1668,
                  "seasons": 10
              },

              "House": {
                  "tmdbId": 1408,
                  "seasons": 8
              },

              "Everybody Loves Raymond": {
                  "tmdbId": 2140,
                  "seasons": 9
              },

              "Justified": {
                  "tmdbId": 1436,
                  "seasons": 6
              }

          }


          # ======================================================
          # TITLE NORMALIZATION
          # ======================================================

          def normalize_title(title):

              if not title:
                  return ""

              title = str(title).lower()

              title = title.replace("&", "and")

              title = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  title
              )

              return " ".join(
                  title.split()
              )


          # ======================================================
          # NORMALIZE ROMAN NUMERALS
          # ======================================================

          ROMAN_NUMERALS = {
              "i": "1",
              "ii": "2",
              "iii": "3",
              "iv": "4",
              "v": "5",
              "vi": "6",
              "vii": "7",
              "viii": "8",
              "ix": "9",
              "x": "10"
          }


          def normalize_numbers(text):

              words = normalize_title(text).split()

              words = [
                  ROMAN_NUMERALS.get(
                      word,
                      word
                  )
                  for word in words
              ]

              return " ".join(words)


          # ======================================================
          # REMOVE "THE"
          # ======================================================

          def remove_the(title):

              value = normalize_numbers(title)

              if value.startswith("the "):
                  value = value[4:]

              if value.endswith(" the"):
                  value = value[:-4]

              return value


          # ======================================================
          # FIND MOVIE
          # ======================================================

          def find_movie_index(
              movies,
              requested_title,
              tmdb_id
          ):

              requested_normalized = normalize_numbers(
                  requested_title
              )

              requested_without_the = remove_the(
                  requested_title
              )


              # --------------------------------------------------
              # Exact title
              # --------------------------------------------------

              for index, movie in enumerate(movies):

                  title = movie.get(
                      "title",
                      ""
                  )

                  if normalize_numbers(title) == requested_normalized:
                      return index


              # --------------------------------------------------
              # Title with "The" moved
              # --------------------------------------------------

              for index, movie in enumerate(movies):

                  title = movie.get(
                      "title",
                      ""
                  )

                  if remove_the(title) == requested_without_the:
                      return index


              # --------------------------------------------------
              # TMDB ID fallback
              # --------------------------------------------------

              for index, movie in enumerate(movies):

                  existing_id = movie.get(
                      "tmdbId"
                  )

                  if existing_id is not None:

                      try:

                          if int(existing_id) == int(tmdb_id):
                              return index

                      except Exception:
                          pass


              # --------------------------------------------------
              # Partial title fallback
              #
              # Only accept if there is exactly one candidate.
              # --------------------------------------------------

              candidates = []

              for index, movie in enumerate(movies):

                  title = remove_the(
                      movie.get(
                          "title",
                          ""
                      )
                  )

                  if (
                      requested_without_the in title
                      or
                      title in requested_without_the
                  ):

                      candidates.append(index)


              if len(candidates) == 1:
                  return candidates[0]


              return None


          # ======================================================
          # FORMAT "THE" TITLES
          #
          # The catalog convention is:
          #
          # "The Fan" -> "Fan, The"
          # "The Natural" -> "Natural, The"
          #
          # Do not move "The" if it is not at the beginning.
          # ======================================================

          def catalog_title(tmdb_title):

              title = (tmdb_title or "").strip()

              if title.lower().startswith("the "):

                  return (
                      title[4:].strip()
                      + ", The"
                  )

              return title


          # ======================================================
          # LOAD MOVIES.JS
          # ======================================================

          with open(
              "movies.js",
              "r",
              encoding="utf-8"
          ) as f:

              source = f.read()


          start = source.find("[")

          end = source.rfind("]")


          if start == -1 or end == -1:

              raise SystemExit(
                  "Could not locate movies array in movies.js."
              )


          try:

              movies = json.loads(
                  source[start:end + 1]
              )

          except json.JSONDecodeError as e:

              raise SystemExit(
                  f"Could not parse movies.js: {e}"
              )


          print(
              f"Loaded {len(movies)} catalog entries."
          )


          # ======================================================
          # FETCH MOVIE DATA
          # ======================================================

          def fetch_movie(tmdb_id):

              response = session.get(
                  f"{API_BASE}/movie/{tmdb_id}",
                  params={
                      "api_key": API_KEY,
                      "append_to_response": "credits"
                  },
                  timeout=30
              )


              if response.status_code != 200:

                  raise SystemExit(
                      f"TMDB request failed for movie "
                      f"{tmdb_id}: "
                      f"HTTP {response.status_code}"
                  )


              data = response.json()


              if int(data.get("id", 0)) != int(tmdb_id):

                  raise SystemExit(
                      f"TMDB returned the wrong ID "
                      f"for requested movie {tmdb_id}."
                  )


              return data


          # ======================================================
          # APPLY MOVIE METADATA
          # ======================================================

          def update_movie(
              movie,
              data,
              preserve_title=False
          ):

              # --------------------------------------------------
              # TMDB ID
              # --------------------------------------------------

              movie["tmdbId"] = data.get(
                  "id"
              )


              # --------------------------------------------------
              # TMDB title
              # --------------------------------------------------

              tmdb_title = data.get(
                  "title"
              )


              if tmdb_title:

                  movie["tmdbTitle"] = tmdb_title


                  if not preserve_title:

                      movie["title"] = catalog_title(
                          tmdb_title
                      )


              # --------------------------------------------------
              # Poster
              # --------------------------------------------------

              poster_path = data.get(
                  "poster_path"
              )


              if poster_path:

                  movie["poster"] = (
                      POSTER_BASE
                      + poster_path
                  )


              # --------------------------------------------------
              # Year
              # --------------------------------------------------

              release_date = data.get(
                  "release_date"
              )


              if release_date:

                  movie["year"] = str(
                      release_date
                  )[:4]


              # --------------------------------------------------
              # Runtime
              # --------------------------------------------------

              runtime = data.get(
                  "runtime"
              )


              if runtime:

                  movie["runtime"] = (
                      f"{runtime}m"
                  )


              # --------------------------------------------------
              # Genre
              # --------------------------------------------------

              genres = data.get(
                  "genres",
                  []
              )


              genre_names = [
                  g.get("name")
                  for g in genres
                  if g.get("name")
              ]


              if genre_names:

                  movie["genre"] = (
                      " / ".join(
                          genre_names
                      )
                  )


              # --------------------------------------------------
              # Director
              # --------------------------------------------------

              credits = data.get(
                  "credits",
                  {}
              )


              crew = credits.get(
                  "crew",
                  []
              )


              directors = [
                  person.get("name")
                  for person in crew
                  if person.get("job") == "Director"
                  and person.get("name")
              ]


              if directors:

                  movie["director"] = (
                      ", ".join(
                          directors
                      )
                  )


              # --------------------------------------------------
              # Cast
              # --------------------------------------------------

              cast = credits.get(
                  "cast",
                  []
              )


              cast_names = [
                  person.get("name")
                  for person in cast
                  if person.get("name")
              ]


              if cast_names:

                  movie["cast"] = (
                      ", ".join(
                          cast_names[:6]
                      )
                  )


              # --------------------------------------------------
              # Synopsis
              # --------------------------------------------------

              overview = data.get(
                  "overview"
              )


              if overview:

                  movie["synopsis"] = overview


          # ======================================================
          # REPAIR EXISTING MOVIES
          # ======================================================

          print("")
          print("========================================")
          print("REPAIRING VERIFIED MOVIES")
          print("========================================")


          repaired = 0

          missing_repairs = []


          for requested_title, tmdb_id in REPAIRS.items():

              index = find_movie_index(
                  movies,
                  requested_title,
                  tmdb_id
              )


              if index is None:

                  # The Ex is handled below as a new movie.

                  if requested_title == "The Ex":
                      continue

                  missing_repairs.append(
                      requested_title
                  )

                  print(
                      f"NOT FOUND: {requested_title}"
                  )

                  continue


              movie = movies[index]


              print(
                  f"UPDATING: "
                  f"{requested_title}"
                  f" -> "
                  f"{movie.get('title', '')}"
                  f" -> TMDB {tmdb_id}"
              )


              data = fetch_movie(
                  tmdb_id
              )


              update_movie(
                  movie,
                  data,
                  preserve_title=False
              )


              repaired += 1


          if missing_repairs:

              print("")
              print(
                  "The following repair items "
                  "could not be matched:"
              )

              for title in missing_repairs:

                  print(
                      f"  - {title}"
                  )

              raise SystemExit(
                  "Repair aborted because "
                  "one or more verified movies "
                  "could not be safely matched."
              )


          # ======================================================
          # ADD MISSING MOVIES
          # ======================================================

          print("")
          print("========================================")
          print("ADDING MISSING MOVIES")
          print("========================================")


          added_movies = 0


          for requested_title, config in NEW_MOVIES.items():

              tmdb_id = config[
                  "tmdbId"
              ]


              existing_index = None


              for index, movie in enumerate(movies):

                  try:

                      if int(
                          movie.get("tmdbId", -1)
                      ) == int(tmdb_id):

                          existing_index = index
                          break

                  except Exception:
                      pass


              if existing_index is not None:

                  movie = movies[
                      existing_index
                  ]


                  print(
                      f"ALREADY EXISTS: "
                      f"{requested_title}"
                  )


                  # For F1, make sure the physical formats
                  # include both 4K and Blu-ray.

                  if requested_title == "F1":

                      physical = movie.get(
                          "physical",
                          []
                      ) or []


                      for fmt in [
                          "4K",
                          "Blu-ray"
                      ]:

                          if fmt not in physical:

                              physical.append(
                                  fmt
                              )


                      movie["physical"] = physical


                  continue


              print(
                  f"ADDING: {requested_title}"
                  f" -> TMDB {tmdb_id}"
              )


              data = fetch_movie(
                  tmdb_id
              )


              new_movie = {

                  "title": catalog_title(
                      data.get(
                          "title",
                          requested_title
                      )
                  ),

                  "tmdbTitle": data.get(
                      "title",
                      requested_title
                  ),

                  "type": "movie",

                  "tmdbId": data.get(
                      "id"
                  ),

                  "poster": "",

                  "year": "",

                  "runtime": "",

                  "genre": "",

                  "director": "",

                  "cast": "",

                  "synopsis": data.get(
                      "overview",
                      ""
                  ),

                  "physical": config[
                      "physical"
                  ],

                  "digital": config[
                      "digital"
                  ]

              }


              update_movie(
                  new_movie,
                  data,
                  preserve_title=True
              )


              movies.append(
                  new_movie
              )


              added_movies += 1


          # ======================================================
          # TV HELPERS
          # ======================================================

          ORDINALS = {

              1: "First",
              2: "Second",
              3: "Third",
              4: "Fourth",
              5: "Fifth",
              6: "Sixth",
              7: "Seventh",
              8: "Eighth",
              9: "Ninth",
              10: "Tenth"

          }


          def season_title(
              show_name,
              season_number
          ):

              ordinal = ORDINALS.get(
                  season_number,
                  str(season_number)
              )

              return (
                  f"{show_name} - "
                  f"Complete {ordinal} Season"
              )


          def existing_seasons(
              show_id
          ):

              seasons = {}


              for movie in movies:

                  try:

                      if int(
                          movie.get("tmdbId", -1)
                      ) != int(show_id):

                          continue

                  except Exception:

                      continue


                  if movie.get("type") != "tv":

                      continue


                  title = movie.get(
                      "title",
                      ""
                  )


                  match = re.search(
                      r"(?:season|complete)\s+"
                      r"(first|second|third|fourth|fifth|"
                      r"sixth|seventh|eighth|ninth|tenth|\d+)",
                      title,
                      re.IGNORECASE
                  )


                  if not match:
                      continue


                  value = match.group(
                      1
                  ).lower()


                  reverse_ordinals = {
                      v.lower(): k
                      for k, v in ORDINALS.items()
                  }


                  if value in reverse_ordinals:

                      number = reverse_ordinals[
                          value
                      ]

                  else:

                      number = int(
                          value
                      )


                  seasons[
                      number
                  ] = movie


              return seasons


          def infer_physical_format(
              show_id
          ):

              formats = []


              for movie in movies:

                  try:

                      if int(
                          movie.get("tmdbId", -1)
                      ) != int(show_id):

                          continue

                  except Exception:

                      continue


                  if movie.get("type") != "tv":

                      continue


                  physical = movie.get(
                      "physical",
                      []
                  ) or []


                  if physical:

                      formats.extend(
                          physical
                      )


              if not formats:

                  return [
                      "DVD"
                  ]


              counts = Counter(
                  formats
              )


              # Preserve the most common physical format.

              return [
                  counts.most_common(1)[0][0]
              ]


          # ======================================================
          # FETCH TV SERIES
          # ======================================================

          def fetch_tv(
              show_id
          ):

              response = session.get(
                  f"{API_BASE}/tv/{show_id}",
                  params={
                      "api_key": API_KEY,
                      "append_to_response": "credits"
                  },
                  timeout=30
              )


              if response.status_code != 200:

                  raise SystemExit(
                      f"TMDB TV request failed "
                      f"for {show_id}: "
                      f"HTTP {response.status_code}"
                  )


              return response.json()


          # ======================================================
          # FETCH TV SEASON
          # ======================================================

          def fetch_season(
              show_id,
              season_number
          ):

              response = session.get(
                  f"{API_BASE}/tv/"
                  f"{show_id}/season/"
                  f"{season_number}",
                  params={
                      "api_key": API_KEY
                  },
                  timeout=30
              )


              if response.status_code != 200:

                  raise SystemExit(
                      f"TMDB season request failed "
                      f"for show {show_id}, "
                      f"season {season_number}: "
                      f"HTTP {response.status_code}"
                  )


              return response.json()


          # ======================================================
          # ADD MISSING TV SEASONS
          # ======================================================

          print("")
          print("========================================")
          print("CHECKING TV SEASONS")
          print("========================================")


          added_seasons = 0


          for show_name, config in TV_SERIES.items():

              show_id = config[
                  "tmdbId"
              ]

              expected_seasons = config[
                  "seasons"
              ]


              print("")
              print(
                  f"{show_name}: "
                  f"checking seasons 1-{expected_seasons}"
              )


              existing = existing_seasons(
                  show_id
              )


              physical_format = infer_physical_format(
                  show_id
              )


              print(
                  f"Existing seasons: "
                  f"{sorted(existing.keys())}"
              )


              show_data = fetch_tv(
                  show_id
              )


              show_title = show_data.get(
                  "name",
                  show_name
              )


              # --------------------------------------------------
              # Get common series information
              # --------------------------------------------------

              genres = show_data.get(
                  "genres",
                  []
              )


              genre_names = [
                  g.get("name")
                  for g in genres
                  if g.get("name")
              ]


              genre_text = (
                  " / ".join(
                      genre_names
                  )
              )


              credits = show_data.get(
                  "credits",
                  {}
              )


              cast = credits.get(
                  "cast",
                  []
              )


              cast_names = [
                  person.get("name")
                  for person in cast
                  if person.get("name")
              ]


              cast_text = ", ".join(
                  cast_names[:6]
              )


              # TV shows do not have one useful movie-style
              # director, so leave director blank unless the
              # existing catalog already has one.


              for season_number in range(
                  1,
                  expected_seasons + 1
              ):

                  if season_number in existing:

                      print(
                          f"  Season "
                          f"{season_number}: EXISTS"
                      )

                      continue


                  print(
                      f"  Season "
                      f"{season_number}: ADDING"
                  )


                  season_data = fetch_season(
                      show_id,
                      season_number
                  )


                  air_date = season_data.get(
                      "air_date",
                      ""
                  )


                  poster_path = season_data.get(
                      "poster_path"
                  )


                  if poster_path:

                      poster = (
                          POSTER_BASE
                          + poster_path
                      )

                  else:

                      poster_path = show_data.get(
                          "poster_path"
                      )


                      if poster_path:

                          poster = (
                              POSTER_BASE
                              + poster_path
                          )

                      else:

                          poster = ""


                  new_tv = {

                      "title": season_title(
                          show_name,
                          season_number
                      ),

                      "tmdbTitle": show_title,

                      "type": "tv",

                      "tmdbId": show_id,

                      "poster": poster,

                      "year": (
                          str(air_date)[:4]
                          if air_date
                          else ""
                      ),

                      "runtime": "",

                      "genre": genre_text,

                      "director": "",

                      "cast": cast_text,

                      "synopsis": show_data.get(
                          "overview",
                          ""
                      ),

                      "physical": list(
                          physical_format
                      ),

                      "digital": []

                  }


                  movies.append(
                      new_tv
                  )


                  added_seasons += 1


          # ======================================================
          # WRITE MOVIES.JS
          # ======================================================

          formatted_json = json.dumps(
              movies,
              indent=2,
              ensure_ascii=False
          )


          new_source = (
              "const movies = "
              + formatted_json
              + ";\n"
          )


          with open(
              "movies.js",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_source
              )


          # ======================================================
          # SUMMARY
          # ======================================================

          print("")
          print("========================================")
          print("CATALOG UPDATE COMPLETE")
          print("========================================")
          print("")
          print(
              f"Existing movies repaired: "
              f"{repaired}"
          )
          print(
              f"New movies added: "
              f"{added_movies}"
          )
          print(
              f"Missing TV seasons added: "
              f"{added_seasons}"
          )
          print("")
          print(
              "Existing physical, digital, and "
              "category fields were preserved."
          )
          print(
              "TMDB metadata and posters were refreshed "
              "from verified IDs."
          )
          print("")

          PYTHON


      # ==========================================================
      # SHOW CHANGES
      # ==========================================================

      - name: Show movies.js changes
        run: |
          git diff --stat -- movies.js
          git diff -- movies.js


      # ==========================================================
      # COMMIT EVERYTHING
      # ==========================================================

      - name: Commit updated movies.js
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Repair TMDB data and complete TV seasons"

          git push
