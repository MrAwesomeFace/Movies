name: Normalize Movie Titles - Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create title review tool
        run: |
          cat > title_review.py <<'PYTHON'
          import json
          import html

          # ------------------------------------------------------
          # LOAD MOVIES.JS
          # ------------------------------------------------------

          with open("movies.js", "r", encoding="utf-8") as f:
              source = f.read()

          start = source.find("[")
          end = source.rfind("]")

          if start == -1 or end == -1:
              raise SystemExit(
                  "Could not locate movies array in movies.js"
              )

          try:
              movies = json.loads(source[start:end + 1])
          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"Could not parse movies.js: {e}"
              )

          # ------------------------------------------------------
          # FIND TITLES STARTING WITH "THE "
          # ------------------------------------------------------

          suggestions = []

          for index, movie in enumerate(movies):

              title = str(movie.get("title", "")).strip()

              if title.lower().startswith("the "):

                  new_title = (
                      title[4:].strip()
                      + ", The"
                  )

                  suggestions.append({
                      "index": index,
                      "oldTitle": title,
                      "newTitle": new_title,
                      "tmdbId": movie.get("tmdbId")
                  })

          # ------------------------------------------------------
          # BUILD REVIEW PAGE
          # ------------------------------------------------------

          rows = []

          for item in suggestions:

              old_title = html.escape(
                  item["oldTitle"]
              )

              new_title = html.escape(
                  item["newTitle"]
              )

              tmdb = item.get("tmdbId")

              tmdb_text = ""

              if tmdb is not None:
                  tmdb_text = (
                      f"<span class='tmdb'>"
                      f"TMDB {html.escape(str(tmdb))}"
                      f"</span>"
                  )

              rows.append(f"""
              <div class="row">

                <label class="check">
                  <input
                    type="checkbox"
                    class="title-check"
                    data-index="{item['index']}"
                    data-old="{html.escape(item['oldTitle'], quote=True)}"
                    data-new="{html.escape(item['newTitle'], quote=True)}"
                    checked
                  >
                </label>

                <div class="old">
                  {old_title}
                </div>

                <div class="arrow">
                  →
                </div>

                <div class="new">
                  {new_title}
                  <br>
                  {tmdb_text}
                </div>

              </div>
              """)

          page = f"""<!DOCTYPE html>

          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
          >

          <title>Movie Title Cleanup</title>

          <style>

          * {{
            box-sizing: border-box;
          }}

          body {{
            margin: 0;
            padding: 25px;
            background: #111;
            color: #eee;
            font-family:
              Arial,
              Helvetica,
              sans-serif;
          }}

          .container {{
            max-width: 1100px;
            margin: auto;
          }}

          h1 {{
            margin-bottom: 5px;
          }}

          .subtitle {{
            color: #aaa;
            margin-bottom: 25px;
          }}

          .instructions {{
            background: #202a36;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.5;
          }}

          .toolbar {{
            position: sticky;
            top: 0;
            z-index: 5;
            background: #111;
            padding: 12px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
          }}

          button {{
            padding: 10px 15px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            background: #333;
            color: #fff;
            margin-right: 6px;
          }}

          button:hover {{
            background: #444;
          }}

          .save {{
            background: #eee;
            color: #111;
            font-weight: bold;
          }}

          .stats {{
            color: #aaa;
            margin-top: 10px;
          }}

          .header {{
            display: grid;
            grid-template-columns: 50px 1fr 50px 1fr;
            gap: 15px;
            padding: 10px 15px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
          }}

          .row {{
            display: grid;
            grid-template-columns: 50px 1fr 50px 1fr;
            gap: 15px;
            align-items: center;
            padding: 14px 15px;
            background: #1b1b1b;
            border-bottom: 1px solid #303030;
          }}

          .row:nth-child(even) {{
            background: #181818;
          }}

          .check {{
            text-align: center;
          }}

          .check input {{
            width: 20px;
            height: 20px;
          }}

          .old {{
            color: #ddd;
          }}

          .new {{
            color: #fff;
            font-weight: bold;
          }}

          .arrow {{
            text-align: center;
            color: #777;
            font-size: 20px;
          }}

          .tmdb {{
            color: #777;
            font-size: 12px;
            font-weight: normal;
          }}

          .bottom {{
            margin-top: 25px;
            padding: 20px;
            background: #1b1b1b;
            border-radius: 10px;
          }}

          @media (max-width: 700px) {{

            body {{
              padding: 12px;
            }}

            .header {{
              display: none;
            }}

            .row {{
              grid-template-columns: 40px 1fr;
              gap: 10px;
            }}

            .arrow {{
              display: none;
            }}

            .new {{
              grid-column: 2;
            }}

          }}

          </style>

          </head>

          <body>

          <div class="container">

            <h1>
              Movie Title Cleanup
            </h1>

            <div class="subtitle">
              {len(suggestions)} titles found beginning with "The "
            </div>

            <div class="instructions">

              <strong>
                Review the proposed title changes.
              </strong>

              <br><br>

              Checked items will be changed from:

              <strong>
                The Movie
              </strong>

              to:

              <strong>
                Movie, The
              </strong>

              <br><br>

              Only the movie's
              <strong>title</strong>
              field will be changed.

              TMDB IDs, posters, categories,
              formats, cast, directors, and all
              other information remain untouched.

            </div>

            <div class="toolbar">

              <button
                onclick="checkAll(true)"
              >
                Check All
              </button>

              <button
                onclick="checkAll(false)"
              >
                Uncheck All
              </button>

              <button
                class="save"
                onclick="downloadApproved()"
              >
                Download Approved Changes
              </button>

              <div
                class="stats"
                id="stats"
              >
                {len(suggestions)} changes selected
              </div>

            </div>

            <div class="header">

              <div></div>
              <div>Current Title</div>
              <div></div>
              <div>New Title</div>

            </div>

            <div id="rows">

              {''.join(rows)}

            </div>

            <div class="bottom">

              <strong>
                Nothing has been changed in GitHub yet.
              </strong>

              <br><br>

              Download the approved changes,
              upload the resulting
              <code>approved-title-changes.json</code>
              to the repository, and then run
              the Apply workflow.

            </div>

          </div>


          <script>

          function updateStats() {{

            const checks =
              document.querySelectorAll(
                ".title-check"
              );

            let selected = 0;

            checks.forEach(
              function(check) {{

                if (check.checked) {{
                  selected++;
                }}

              }}
            );

            document.getElementById(
              "stats"
            ).textContent =
              selected
              + " changes selected";

          }}


          function checkAll(value) {{

            document
              .querySelectorAll(
                ".title-check"
              )
              .forEach(
                function(check) {{
                  check.checked = value;
                }}
              );

            updateStats();

          }}


          document
            .querySelectorAll(
              ".title-check"
            )
            .forEach(
              function(check) {{

                check.addEventListener(
                  "change",
                  updateStats
                );

              }}
            );


          function downloadApproved() {{

            const results = [];

            document
              .querySelectorAll(
                ".title-check"
              )
              .forEach(
                function(check) {{

                  if (!check.checked) {{
                    return;
                  }}

                  results.push({{

                    index:
                      Number(
                        check.dataset.index
                      ),

                    oldTitle:
                      check.dataset.old,

                    newTitle:
                      check.dataset.new,

                    tmdbId:
                      check.dataset.tmdb || null

                  }});

                }}
              );


            const blob =
              new Blob(
                [
                  JSON.stringify(
                    results,
                    null,
                    2
                  )
                ],
                {{
                  type:
                    "application/json"
                }}
              );


            const url =
              URL.createObjectURL(
                blob
              );


            const link =
              document.createElement(
                "a"
              );


            link.href = url;

            link.download =
              "approved-title-changes.json";

            document.body.appendChild(
              link
            );

            link.click();

            document.body.removeChild(
              link
            );

            URL.revokeObjectURL(
              url
            );


            alert(
              "Approved title changes exported."
            );

          }}

          </script>

          </body>

          </html>
          """

          with open(
              "title-review.html",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)

          print("")
          print("========================================")
          print("TITLE REVIEW CREATED")
          print("========================================")
          print("")
          print(
              f"Titles beginning with 'The ': "
              f"{len(suggestions)}"
          )
          print("")
          print(
              "movies.js was NOT modified."
          )
          print("")

          PYTHON

          python title_review.py

      - name: Upload title review
        uses: actions/upload-artifact@v4
        with:
          name: movie-title-review
          path: title-review.html
          retention-days: 7
