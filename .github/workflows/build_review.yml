name: Build Movie Fixes Review

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull TMDB data and build review.html
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_review.py

      - name: Upload review files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-fixes-review
          path: |
            review.html
            review_data.json
          retention-days: 14

  # NOTE: this job never checks anything back into the repo.
  # It only reads movies.js and movie_fixes.json and uploads an artifact.
