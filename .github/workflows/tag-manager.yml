name: Movie Tag Manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Analyze movies.js for tags
        run: |
          cat > tag_manager.py <<'PYTHON'
          import json

          TAGS = ["baseball", "animated", "christmas"]

          with open("movies.js", "r", encoding="utf-8") as f:
              text = f.read()

          start = text.find("[")
          end = text.rfind("]")

          if start == -1 or end == -1:
              raise SystemExit("Could not locate movies array in movies.js")

          movies = json.loads(text[start:end + 1])

          def combined(movie):
              return " ".join([
                  str(movie.get("title", "")),
                  str(movie.get("tmdbTitle", "")),
                  str(movie.get("genre", "")),
                  str(movie.get("synopsis", "")),
                  str(movie.get("cast", "")),
              ]).lower()

          def guess_tags(movie):
              text = combined(movie)
              title = str(movie.get("title", "")).lower()
              guesses = []

              # Animated
              if movie.get("animated") or "animation" in text:
                  guesses.append("animated")

              # Baseball
              baseball_terms = [
                  "baseball",
                  "major league",
                  "field of dreams",
                  "moneyball",
                  "bull durham",
                  "the natural",
                  "sandlot",
                  "rookie of the year",
                  "a league of their own",
                  "eight men out",
                  "61*",
                  "mr. baseball",
                  "bang the drum slowly",
                  "hardball",
                  "the scout",
                  "pride of the yankees",
                  "fever pitch"
              ]

              if any(
                  term in text or term in title
                  for term in baseball_terms
              ):
                  guesses.append("baseball")

              # Christmas
              christmas_terms = [
                  "christmas",
                  "santa clause",
                  "scrooge",
                  "grinch",
                  "rudolph",
                  "frosty",
                  "white christmas",
                  "home alone",
                  "jingle all the way",
                  "bad santa",
                  "deck the halls",
                  "family stone",
                  "four christmas",
                  "surviving christmas",
                  "love actually",
                  "polar express",
                  "christmas story",
                  "christmas with the kranks",
                  "fred claus",
                  "arthur christmas",
                  "night before",
                  "holdovers",
                  "violent night",
                  "elf"
              ]

              if any(
                  term in text or term in title
                  for term in christmas_terms
              ):
                  guesses.append("christmas")

              return guesses

          suggestions = []

          for movie in movies:
              guessed = guess_tags(movie)

              existing = movie.get("categories", []) or []

              if isinstance(existing, str):
                  existing = [existing]

              for tag in guessed:
                  if tag not in existing:
                      suggestions.append({
                          "title": movie.get("title", ""),
                          "tmdbId": movie.get("tmdbId"),
                          "tag": tag
                      })

          with open(
              "tag-suggestions.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  suggestions,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("========================================")
          print("TAG ANALYSIS COMPLETE")
          print("========================================")
          print(f"Movies scanned: {len(movies)}")
          print(f"Suggestions:    {len(suggestions)}")
          print("")

          for item in suggestions:
              print(
                  f"{item['tag']:10} | "
                  f"{item['title']} | "
                  f"TMDB {item['tmdbId']}"
              )

          print("")
          print("NO MOVIES WERE CHANGED.")
          print("Review tag-suggestions.json before approving changes.")
          PYTHON

          python tag_manager.py

      - name: Upload suggestions for review
        uses: actions/upload-artifact@v4
        with:
          name: tag-suggestions
          path: tag-suggestions.json

      - name: Stop before making changes
        run: |
          echo "Tag suggestions have been generated."
          echo "Review the artifact before approving changes."
