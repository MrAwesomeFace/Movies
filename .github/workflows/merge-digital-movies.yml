name: Merge Digital Movies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-digital-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge digital movies
        run: |
          node <<'NODE'
          const fs = require('fs');

          const MOVIES_FILE = 'movies.js';
          const DIGITAL_FILE = 'digital_movies_enriched.csv';
          const OUTPUT_FILE = 'movies_digital_merged.json';
          const REVIEW_FILE = 'movies_digital_merge_review.csv';

          function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let quoted = false;

            for (let i = 0; i < text.length; i++) {
              const c = text[i];

              if (c === '"') {
                if (quoted && text[i + 1] === '"') {
                  cell += '"';
                  i++;
                } else {
                  quoted = !quoted;
                }
              } else if (c === ',' && !quoted) {
                row.push(cell);
                cell = '';
              } else if ((c === '\n' || c === '\r') && !quoted) {
                if (c === '\r' && text[i + 1] === '\n') i++;
                row.push(cell);
                cell = '';

                if (row.some(v => v.trim() !== '')) {
                  rows.push(row);
                }

                row = [];
              } else {
                cell += c;
              }
            }

            if (cell !== '' || row.length > 0) {
              row.push(cell);
              if (row.some(v => v.trim() !== '')) {
                rows.push(row);
              }
            }

            if (rows.length === 0) return [];

            const headers = rows[0].map(h => h.trim());

            return rows.slice(1).map(values => {
              const obj = {};
              headers.forEach((h, i) => {
                obj[h] = (values[i] || '').trim();
              });
              return obj;
            });
          }

          function csvEscape(value) {
            value = value == null ? '' : String(value);
            if (value.includes('"') || value.includes(',') || value.includes('\n')) {
              return '"' + value.replace(/"/g, '""') + '"';
            }
            return value;
          }

          function normalizeId(value) {
            if (value === undefined || value === null) return '';
            return String(value).trim().replace(/\.0$/, '');
          }

          function extractMoviesJS(text) {
            let cleaned = text.trim();

            cleaned = cleaned
              .replace(/^export\s+default\s+/m, '')
              .replace(/^const\s+\w+\s*=\s*/m, '')
              .replace(/^let\s+\w+\s*=\s*/m, '')
              .replace(/^var\s+\w+\s*=\s*/m, '');

            cleaned = cleaned.replace(/;\s*$/, '');

            try {
              return JSON.parse(cleaned);
            } catch (e) {
              console.log('Direct JSON parse failed. Trying to locate the array...');

              const start = cleaned.indexOf('[');
              const end = cleaned.lastIndexOf(']');

              if (start === -1 || end === -1) {
                throw new Error('Could not find movie array in movies.js');
              }

              let arrayText = cleaned.substring(start, end + 1);

              try {
                return JSON.parse(arrayText);
              } catch (e2) {
                throw new Error(
                  'movies.js could not be parsed as JSON. The file may contain JavaScript syntax that this workflow cannot safely parse.'
                );
              }
            }
          }

          function findTmdbId(movie) {
            const possible = [
              movie.tmdbId,
              movie.tmdbID,
              movie.tmdb_id,
              movie.tmdb
            ];

            for (const value of possible) {
              const id = normalizeId(value);
              if (id) return id;
            }

            return '';
          }

          function addDigitalToMovie(movie, digitalSource) {
            if (!digitalSource) return;

            if (movie.digital === undefined || movie.digital === null || movie.digital === '') {
              movie.digital = digitalSource;
              return;
            }

            let existing = [];

            if (Array.isArray(movie.digital)) {
              existing = movie.digital.flatMap(v =>
                String(v)
                  .split('|')
                  .map(x => x.trim())
                  .filter(Boolean)
              );
            } else {
              existing = String(movie.digital)
                .split('|')
                .map(x => x.trim())
                .filter(Boolean);
            }

            const additions = String(digitalSource)
              .split('|')
              .map(x => x.trim())
              .filter(Boolean);

            for (const item of additions) {
              if (!existing.includes(item)) {
                existing.push(item);
              }
            }

            movie.digital = existing.join(' | ');
          }

          function makeNewMovie(row) {
            const tmdbId = normalizeId(row.tmdbId || row.source_tmdbId);
            const title = row.tmdbTitle || row.title || '';
            const year = row.tmdbYear || row.year || row.source_year || '';

            const movie = {
              title: title,
              year: year ? Number(year) : '',
              tmdbId: tmdbId,
              digital: row.digital || ''
            };

            if (row.tmdbOriginalTitle) movie.originalTitle = row.tmdbOriginalTitle;
            if (row.tmdbReleaseDate) movie.releaseDate = row.tmdbReleaseDate;
            if (row.tmdbOverview) movie.overview = row.tmdbOverview;
            if (row.tmdbPosterPath) movie.posterPath = row.tmdbPosterPath;
            if (row.tmdbBackdropPath) movie.backdropPath = row.tmdbBackdropPath;

            return movie;
          }

          if (!fs.existsSync(MOVIES_FILE)) {
            throw new Error(`Missing ${MOVIES_FILE}`);
          }

          if (!fs.existsSync(DIGITAL_FILE)) {
            throw new Error(`Missing ${DIGITAL_FILE}`);
          }

          const moviesText = fs.readFileSync(MOVIES_FILE, 'utf8');
          const digitalText = fs.readFileSync(DIGITAL_FILE, 'utf8');

          const movies = extractMoviesJS(moviesText);
          const digitalRows = parseCSV(digitalText);

          if (!Array.isArray(movies)) {
            throw new Error('movies.js did not contain an array of movie records.');
          }

          console.log(`Existing movies: ${movies.length}`);
          console.log(`Digital rows: ${digitalRows.length}`);

          /*
           * IMPORTANT:
           * We clone the existing records so the original movies.js
           * information remains the source of truth.
           */
          const merged = movies.map(movie => ({ ...movie }));

          const byTmdbId = new Map();

          for (let i = 0; i < merged.length; i++) {
            const id = findTmdbId(merged[i]);

            if (id && !byTmdbId.has(id)) {
              byTmdbId.set(id, i);
            }
          }

          const reviewRows = [];

          let matched = 0;
          let added = 0;
          let reviewed = 0;

          for (const row of digitalRows) {
            const sourceId = normalizeId(row.tmdbId || row.source_tmdbId);

            /*
             * No TMDB ID means we cannot safely connect this to the
             * existing catalog. Keep it for manual review.
             */
            if (!sourceId) {
              reviewed++;

              reviewRows.push({
                status: 'REVIEW',
                title: row.title || '',
                digital: row.digital || '',
                tmdbId: '',
                tmdbTitle: row.tmdbTitle || '',
                year: row.tmdbYear || row.year || row.source_year || '',
                reason: 'No TMDB ID available'
              });

              continue;
            }

            /*
             * PRIMARY MATCH:
             * TMDB ID, NOT title.
             *
             * This is what allows:
             *   Skyfall -> 007: Skyfall
             *   renamed Fast & Furious records -> existing records
             * etc.
             */
            if (byTmdbId.has(sourceId)) {
              const index = byTmdbId.get(sourceId);

              addDigitalToMovie(
                merged[index],
                row.digital || ''
              );

              matched++;

              continue;
            }

            /*
             * No existing movie has this TMDB ID.
             *
             * Create a completely new movie record rather than
             * throwing it away.
             */
            const newMovie = makeNewMovie(row);

            merged.push(newMovie);

            byTmdbId.set(sourceId, merged.length - 1);

            added++;
          }

          /*
           * Write merged JSON.
           */
          fs.writeFileSync(
            OUTPUT_FILE,
            JSON.stringify(merged, null, 2) + '\n',
            'utf8'
          );

          /*
           * Write review CSV.
           */
          const reviewHeaders = [
            'status',
            'title',
            'digital',
            'tmdbId',
            'tmdbTitle',
            'year',
            'reason'
          ];

          const reviewLines = [
            reviewHeaders.join(','),
            ...reviewRows.map(row =>
              reviewHeaders.map(h => csvEscape(row[h])).join(',')
            )
          ];

          fs.writeFileSync(
            REVIEW_FILE,
            reviewLines.join('\n') + '\n',
            'utf8'
          );

          console.log('');
          console.log('======================================');
          console.log('DIGITAL MOVIE MERGE COMPLETE');
          console.log('======================================');
          console.log(`Original movies:       ${movies.length}`);
          console.log(`Digital rows:          ${digitalRows.length}`);
          console.log(`Matched by TMDB ID:    ${matched}`);
          console.log(`New movies added:      ${added}`);
          console.log(`Manual review:         ${reviewed}`);
          console.log(`Final merged records:  ${merged.length}`);
          console.log('');
          console.log(`Created: ${OUTPUT_FILE}`);
          console.log(`Created: ${REVIEW_FILE}`);
          console.log('======================================');

          /*
           * Sanity checks.
           */
          if (merged.length < movies.length) {
            throw new Error(
              'SANITY CHECK FAILED: merged catalog is smaller than the original catalog.'
            );
          }

          if (!fs.existsSync(OUTPUT_FILE) || fs.statSync(OUTPUT_FILE).size < 10) {
            throw new Error('SANITY CHECK FAILED: merged JSON is empty.');
          }

          /*
           * Verify that digital information was actually incorporated.
           */
          const digitalCount = merged.filter(movie =>
            movie.digital !== undefined &&
            movie.digital !== null &&
            String(movie.digital).trim() !== ''
          ).length;

          console.log(`Records containing digital information: ${digitalCount}`);

          NODE

      - name: Commit merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies_digital_merged.json movies_digital_merge_review.csv

          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Create merged digital movie catalog"
          git push
