name: Merge Digital Movies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-digital-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge digital movies
        run: |
          node <<'NODE'
          const fs = require('fs');

          const MOVIES_FILE = 'movies.js';
          const DIGITAL_FILE = 'digital_movies_tmdb_enriched.csv';
          const OUTPUT_FILE = 'movies_digital_merged.json';
          const REVIEW_FILE = 'movies_digital_merge_review.csv';

          function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let quoted = false;

            for (let i = 0; i < text.length; i++) {
              const c = text[i];

              if (c === '"') {
                if (quoted && text[i + 1] === '"') {
                  cell += '"';
                  i++;
                } else {
                  quoted = !quoted;
                }
              } else if (c === ',' && !quoted) {
                row.push(cell);
                cell = '';
              } else if ((c === '\n' || c === '\r') && !quoted) {
                if (c === '\r' && text[i + 1] === '\n') {
                  i++;
                }

                row.push(cell);
                cell = '';

                if (row.some(v => v.trim() !== '')) {
                  rows.push(row);
                }

                row = [];
              } else {
                cell += c;
              }
            }

            if (cell !== '' || row.length > 0) {
              row.push(cell);

              if (row.some(v => v.trim() !== '')) {
                rows.push(row);
              }
            }

            if (rows.length === 0) {
              return [];
            }

            const headers = rows[0].map(h => h.trim());

            return rows.slice(1).map(values => {
              const obj = {};

              headers.forEach((header, i) => {
                obj[header] = (values[i] || '').trim();
              });

              return obj;
            });
          }

          function csvEscape(value) {
            value = value == null ? '' : String(value);

            if (
              value.includes('"') ||
              value.includes(',') ||
              value.includes('\n')
            ) {
              return '"' + value.replace(/"/g, '""') + '"';
            }

            return value;
          }

          function normalizeId(value) {
            if (value === undefined || value === null) {
              return '';
            }

            return String(value)
              .trim()
              .replace(/\.0$/, '');
          }

          function findTmdbId(movie) {
            const possibleIds = [
              movie.tmdbId,
              movie.tmdbID,
              movie.tmdb_id,
              movie.tmdb
            ];

            for (const value of possibleIds) {
              const id = normalizeId(value);

              if (id) {
                return id;
              }
            }

            return '';
          }

          function extractMoviesJS(text) {
            let cleaned = text.trim();

            cleaned = cleaned.replace(
              /^export\s+default\s+/m,
              ''
            );

            cleaned = cleaned.replace(
              /^const\s+\w+\s*=\s*/m,
              ''
            );

            cleaned = cleaned.replace(
              /^let\s+\w+\s*=\s*/m,
              ''
            );

            cleaned = cleaned.replace(
              /^var\s+\w+\s*=\s*/m,
              ''
            );

            cleaned = cleaned.replace(/;\s*$/, '');

            try {
              return JSON.parse(cleaned);
            } catch (error) {
              const start = cleaned.indexOf('[');
              const end = cleaned.lastIndexOf(']');

              if (start === -1 || end === -1) {
                throw new Error(
                  'Could not find the movie array in movies.js.'
                );
              }

              const arrayText = cleaned.substring(
                start,
                end + 1
              );

              try {
                return JSON.parse(arrayText);
              } catch (error2) {
                throw new Error(
                  'movies.js could not be parsed as JSON.'
                );
              }
            }
          }

          function addDigitalToMovie(movie, digitalSource) {
            if (!digitalSource) {
              return;
            }

            if (
              movie.digital === undefined ||
              movie.digital === null ||
              String(movie.digital).trim() === ''
            ) {
              movie.digital = digitalSource;
              return;
            }

            let existing = [];

            if (Array.isArray(movie.digital)) {
              existing = movie.digital.flatMap(value =>
                String(value)
                  .split('|')
                  .map(item => item.trim())
                  .filter(Boolean)
              );
            } else {
              existing = String(movie.digital)
                .split('|')
                .map(item => item.trim())
                .filter(Boolean);
            }

            const additions = String(digitalSource)
              .split('|')
              .map(item => item.trim())
              .filter(Boolean);

            for (const item of additions) {
              if (!existing.includes(item)) {
                existing.push(item);
              }
            }

            movie.digital = existing.join(' | ');
          }

          function makeNewMovie(row) {
            const tmdbId = normalizeId(
              row.tmdbId || row.source_tmdbId
            );

            const title =
              row.tmdbTitle ||
              row.title ||
              '';

            const year =
              row.tmdbYear ||
              row.year ||
              row.source_year ||
              '';

            const movie = {
              title: title,
              year: year ? Number(year) : '',
              tmdbId: tmdbId,
              digital: row.digital || ''
            };

            if (row.tmdbOriginalTitle) {
              movie.originalTitle =
                row.tmdbOriginalTitle;
            }

            if (row.tmdbReleaseDate) {
              movie.releaseDate =
                row.tmdbReleaseDate;
            }

            if (row.tmdbOverview) {
              movie.overview =
                row.tmdbOverview;
            }

            if (row.tmdbPosterPath) {
              movie.posterPath =
                row.tmdbPosterPath;
            }

            if (row.tmdbBackdropPath) {
              movie.backdropPath =
                row.tmdbBackdropPath;
            }

            return movie;
          }

          if (!fs.existsSync(MOVIES_FILE)) {
            throw new Error(
              `Missing ${MOVIES_FILE}`
            );
          }

          if (!fs.existsSync(DIGITAL_FILE)) {
            throw new Error(
              `Missing ${DIGITAL_FILE}`
            );
          }

          const moviesText =
            fs.readFileSync(
              MOVIES_FILE,
              'utf8'
            );

          const digitalText =
            fs.readFileSync(
              DIGITAL_FILE,
              'utf8'
            );

          const movies =
            extractMoviesJS(moviesText);

          const digitalRows =
            parseCSV(digitalText);

          if (!Array.isArray(movies)) {
            throw new Error(
              'movies.js did not contain an array.'
            );
          }

          console.log(
            `Existing movies: ${movies.length}`
          );

          console.log(
            `Digital rows: ${digitalRows.length}`
          );

          const merged =
            movies.map(movie => ({
              ...movie
            }));

          const byTmdbId = new Map();

          for (
            let i = 0;
            i < merged.length;
            i++
          ) {
            const id =
              findTmdbId(merged[i]);

            if (
              id &&
              !byTmdbId.has(id)
            ) {
              byTmdbId.set(id, i);
            }
          }

          const reviewRows = [];

          let matched = 0;
          let added = 0;
          let reviewed = 0;

          for (const row of digitalRows) {
            const sourceId =
              normalizeId(
                row.tmdbId ||
                row.source_tmdbId
              );

            if (!sourceId) {
              reviewed++;

              reviewRows.push({
                status: 'REVIEW',
                title: row.title || '',
                digital: row.digital || '',
                tmdbId: '',
                tmdbTitle:
                  row.tmdbTitle || '',
                year:
                  row.tmdbYear ||
                  row.year ||
                  row.source_year ||
                  '',
                reason:
                  'No TMDB ID available'
              });

              continue;
            }

            if (byTmdbId.has(sourceId)) {
              const index =
                byTmdbId.get(sourceId);

              addDigitalToMovie(
                merged[index],
                row.digital || ''
              );

              matched++;

              continue;
            }

            const newMovie =
              makeNewMovie(row);

            merged.push(newMovie);

            byTmdbId.set(
              sourceId,
              merged.length - 1
            );

            added++;
          }

          fs.writeFileSync(
            OUTPUT_FILE,
            JSON.stringify(
              merged,
              null,
              2
            ) + '\n',
            'utf8'
          );

          const reviewHeaders = [
            'status',
            'title',
            'digital',
            'tmdbId',
            'tmdbTitle',
            'year',
            'reason'
          ];

          const reviewLines = [
            reviewHeaders.join(','),
            ...reviewRows.map(row =>
              reviewHeaders
                .map(header =>
                  csvEscape(row[header])
                )
                .join(',')
            )
          ];

          fs.writeFileSync(
            REVIEW_FILE,
            reviewLines.join('\n') + '\n',
            'utf8'
          );

          console.log('');
          console.log(
            '======================================'
          );
          console.log(
            'DIGITAL MOVIE MERGE COMPLETE'
          );
          console.log(
            '======================================'
          );

          console.log(
            `Original movies:      ${movies.length}`
          );

          console.log(
            `Digital rows:         ${digitalRows.length}`
          );

          console.log(
            `Matched by TMDB ID:   ${matched}`
          );

          console.log(
            `New movies added:     ${added}`
          );

          console.log(
            `Manual review:        ${reviewed}`
          );

          console.log(
            `Final records:        ${merged.length}`
          );

          console.log('');
          console.log(
            `Created: ${OUTPUT_FILE}`
          );

          console.log(
            `Created: ${REVIEW_FILE}`
          );

          console.log(
            '======================================'
          );

          if (merged.length < movies.length) {
            throw new Error(
              'SANITY CHECK FAILED: merged catalog is smaller than the original catalog.'
            );
          }

          if (
            !fs.existsSync(OUTPUT_FILE) ||
            fs.statSync(OUTPUT_FILE).size < 10
          ) {
            throw new Error(
              'SANITY CHECK FAILED: merged JSON is empty.'
            );
          }

          let digitalCount = 0;

          for (const movie of merged) {
            if (
              movie.digital !== undefined &&
              movie.digital !== null &&
              String(movie.digital).trim() !== ''
            ) {
              digitalCount++;
            }
          }

          console.log(
            `Records containing digital information: ${digitalCount}`
          );

          NODE

      - name: Commit merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies_digital_merged.json movies_digital_merge_review.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Create merged digital movie catalog"
          git push
