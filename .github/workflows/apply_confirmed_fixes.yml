name: Apply Confirmed Movie Fixes

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-confirmed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply confirmed_fixes.json to movies.js
        run: python scripts/apply_confirmed_fixes.py

      - name: Open pull request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Apply confirmed movie catalog fixes"
          branch: movie-fixes/apply-confirmed
          delete-branch: true
          title: "Apply confirmed movie catalog fixes"
          body: |
            Applies the entries you approved in review.html (see
            confirmed_fixes.json). No TMDB calls were made in this step —
            every value here was already pulled and reviewed.

            Check the job summary for any entries that couldn't be matched
            (movies.js may have changed since you built the review).
          add-paths: |
            movies.js
