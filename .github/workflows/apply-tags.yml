name: Apply Movie Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-tags:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check approved tags file
        run: |

          if [ ! -f "approved-tags.json" ]; then

            echo ""
            echo "========================================"
            echo "ERROR: approved-tags.json NOT FOUND"
            echo "========================================"
            echo ""
            echo "Upload approved-tags.json to the"
            echo "repository before running Apply Movie Tags."
            echo ""

            exit 1

          fi


      - name: Create tag application script
        run: |

          cat > apply_tags.py <<'PYTHON'

          import json
          import shutil
          from datetime import datetime


          MOVIES_FILE = "movies.js"
          APPROVED_FILE = "approved-tags.json"


          # =====================================================
          # LOAD CURRENT MOVIES.JS
          # =====================================================

          with open(
              MOVIES_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              source = f.read()


          start = source.find("[")
          end = source.rfind("]")


          if start == -1 or end == -1:

              raise SystemExit(
                  "Could not locate movies array in movies.js"
              )


          movies_text = source[
              start:end + 1
          ]


          try:

              movies = json.loads(
                  movies_text
              )

          except json.JSONDecodeError as e:

              raise SystemExit(
                  f"Could not parse movies.js: {e}"
              )


          # =====================================================
          # LOAD APPROVED TAGS
          # =====================================================

          with open(
              APPROVED_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              approved = json.load(f)


          if not isinstance(
              approved,
              list
          ):

              raise SystemExit(
                  "approved-tags.json must contain a list."
              )


          # =====================================================
          # INDEX MOVIES BY TMDB ID AND TITLE
          # =====================================================

          tmdb_lookup = {}
          title_lookup = {}


          for movie in movies:

              tmdb_id = movie.get(
                  "tmdbId"
              )


              if tmdb_id is not None:

                  tmdb_lookup[
                      str(tmdb_id)
                  ] = movie


              title = str(
                  movie.get(
                      "title",
                      ""
                  )
              ).strip().lower()


              if title:

                  title_lookup.setdefault(
                      title,
                      []
                  ).append(movie)


          # =====================================================
          # CREATE BACKUP
          # =====================================================

          timestamp = datetime.now().strftime(
              "%Y%m%d-%H%M%S"
          )


          backup_file = (
              f"movies-backup-{timestamp}.js"
          )


          shutil.copy2(
              MOVIES_FILE,
              backup_file
          )


          print(
              f"Backup created: {backup_file}"
          )


          # =====================================================
          # APPLY APPROVED TAGS
          # =====================================================

          applied = []
          skipped = []
          errors = []


          for item in approved:

              if not isinstance(
                  item,
                  dict
              ):

                  errors.append(
                      "Invalid item in approved-tags.json"
                  )

                  continue


              title = str(
                  item.get(
                      "title",
                      ""
                  )
              ).strip()


              tmdb_id = item.get(
                  "tmdbId"
              )


              tag = str(
                  item.get(
                      "tag",
                      ""
                  )
              ).strip().lower()


              if not tag:

                  errors.append(
                      f"{title}: missing tag"
                  )

                  continue


              # =================================================
              # FIND MOVIE
              #
              # TMDB ID is preferred.
              # Title is fallback only if there is no TMDB ID.
              # =================================================

              movie = None


              if tmdb_id is not None:

                  movie = tmdb_lookup.get(
                      str(tmdb_id)
                  )


              if movie is None and title:

                  matches = title_lookup.get(
                      title.lower(),
                      []
                  )


                  if len(matches) == 1:

                      movie = matches[0]


                  elif len(matches) > 1:

                      errors.append(
                          f"{title}: multiple title matches; "
                          "TMDB ID did not identify it"
                      )

                      continue


              if movie is None:

                  errors.append(
                      f"{title}: movie not found"
                  )

                  continue


              # =================================================
              # ADD CATEGORY
              # =================================================

              categories = movie.get(
                  "categories",
                  []
              )


              if categories is None:

                  categories = []


              if isinstance(
                  categories,
                  str
              ):

                  categories = [
                      categories
                  ]


              if not isinstance(
                  categories,
                  list
              ):

                  errors.append(
                      f"{title}: categories field is invalid"
                  )

                  continue


              if tag in categories:

                  skipped.append(
                      f"{title} already has {tag}"
                  )

                  continue


              categories.append(tag)


              movie["categories"] = categories


              applied.append({
                  "title":
                      movie.get(
                          "title",
                          title
                      ),

                  "tag":
                      tag
              })


          # =====================================================
          # SAFETY CHECK
          # =====================================================

          if errors:

              print("")
              print("========================================")
              print("ERRORS FOUND")
              print("========================================")
              print("")


              for error in errors:

                  print(
                      f"  {error}"
                  )


              print("")
              print(
                  "NO CHANGES WERE COMMITTED."
              )


              # Restore original file.

              shutil.copy2(
                  backup_file,
                  MOVIES_FILE
              )


              raise SystemExit(
                  "Tag application stopped because errors occurred."
              )


          # =====================================================
          # WRITE MOVIES.JS
          # =====================================================

          updated_array = json.dumps(
              movies,
              indent=2,
              ensure_ascii=False
          )


          updated_source = (
              source[:start]
              + updated_array
              + source[end + 1:]
          )


          with open(
              MOVIES_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  updated_source
              )


          # =====================================================
          # REPORT
          # =====================================================

          print("")
          print("========================================")
          print("TAG APPLICATION COMPLETE")
          print("========================================")
          print("")
          print(
              f"Movies in catalog: {len(movies)}"
          )
          print(
              f"Approved tags:      {len(approved)}"
          )
          print(
              f"Tags applied:       {len(applied)}"
          )
          print(
              f"Already present:    {len(skipped)}"
          )
          print(
              f"Errors:             {len(errors)}"
          )
          print("")


          if applied:

              print("APPLIED:")

              for item in applied:

                  print(
                      f"  {item['title']} "
                      f"→ {item['tag']}"
                  )


          print("")
          print(
              f"Backup: {backup_file}"
          )
          print(
              "movies.js has been updated."
          )

          PYTHON


      - name: Apply approved tags
        run: |

          python apply_tags.py


      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: movies-backup
          path: "movies-backup-*.js"
          retention-days: 30


      - name: Commit updated movies.js
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies.js

          git commit \
            -m "Apply approved movie tags" \
            || echo "No changes to commit."

          git push
