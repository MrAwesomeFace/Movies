name: Movie Tag Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-review:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECK OUT CURRENT MOVIE CATALOG
      # ==========================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # ==========================================================
      # SET UP PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ==========================================================
      # BUILD REVIEW PAGE
      # ==========================================================

      - name: Create tag review tool
        run: |

          cat > tag_review.py <<'PYTHON'

          import json
          import html


          # ======================================================
          # CATEGORIES
          #
          # Add future categories here.
          #
          # Example:
          #
          # "halloween",
          # "favorites",
          # "action",
          #
          # ======================================================

          CATEGORIES = [
              "baseball",
              "christmas",
              "animated"
          ]


          # ======================================================
          # LOAD MOVIES.JS
          # ======================================================

          with open(
              "movies.js",
              "r",
              encoding="utf-8"
          ) as f:

              source = f.read()


          start = source.find("[")
          end = source.rfind("]")


          if start == -1 or end == -1:

              raise SystemExit(
                  "Could not locate movies array in movies.js"
              )


          movies_text = source[
              start:end + 1
          ]


          try:

              movies = json.loads(
                  movies_text
              )

          except json.JSONDecodeError as e:

              raise SystemExit(
                  f"Could not parse movies.js: {e}"
              )


          # ======================================================
          # SORT MOVIES ALPHABETICALLY
          #
          # This only affects the review page.
          # It does NOT change movies.js.
          # ======================================================

          movies = sorted(
              movies,
              key=lambda movie:
                  str(
                      movie.get(
                          "title",
                          ""
                      )
                  ).lower()
          )


          # ======================================================
          # BUILD MOVIE ROWS
          # ======================================================

          movie_rows = []


          for index, movie in enumerate(movies):

              title = str(
                  movie.get(
                      "title",
                      ""
                  )
              )


              year = str(
                  movie.get(
                      "year",
                      ""
                  )
              )


              tmdb_id = movie.get(
                  "tmdbId"
              )


              existing = movie.get(
                  "categories",
                  []
              )


              if existing is None:

                  existing = []


              if isinstance(
                  existing,
                  str
              ):

                  existing = [
                      existing
                  ]


              if not isinstance(
                  existing,
                  list
              ):

                  existing = []


              # --------------------------------------------------
              # DISPLAY INFORMATION
              # --------------------------------------------------

              display_title = html.escape(
                  title
              )


              if year:

                  display_title += (
                      f" ({html.escape(year)})"
                  )


              if tmdb_id is not None:

                  display_title += (
                      f" "
                      f"<span class='tmdb'>"
                      f"TMDB {html.escape(str(tmdb_id))}"
                      f"</span>"
                  )


              checkboxes = []


              for category in CATEGORIES:

                  checked = (
                      category in existing
                  )


                  checked_text = (
                      "checked"
                      if checked
                      else ""
                  )


                  safe_category = html.escape(
                      category,
                      quote=True
                  )


                  checkboxes.append(f"""
                    <label class="category">
                      <input
                        type="checkbox"
                        class="category-check"
                        data-category="{safe_category}"
                        {checked_text}
                      >
                      <span>
                        {html.escape(category.title())}
                      </span>
                    </label>
                  """)


              movie_rows.append(f"""
                <div
                  class="movie-row"
                  data-title="{html.escape(title.lower(), quote=True)}"
                  data-tmdb="{html.escape(str(tmdb_id or ''), quote=True)}"
                >

                  <div class="movie-title">
                    {display_title}
                  </div>

                  <div class="categories">
                    {''.join(checkboxes)}
                  </div>

                </div>
              """)


          # ======================================================
          # BUILD HTML
          # ======================================================

          category_headers = []


          for category in CATEGORIES:

              category_headers.append(
                  f"<span>{html.escape(category.title())}</span>"
              )


          category_header_html = "".join(
              category_headers
          )


          page = f"""<!DOCTYPE html>

          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
          >

          <title>BW's Movie Tag Manager</title>


          <style>

          * {{
            box-sizing: border-box;
          }}


          body {{

            margin: 0;

            padding: 25px;

            font-family:
              Arial,
              Helvetica,
              sans-serif;

            background: #111;

            color: #eee;

          }}


          .container {{

            max-width: 1100px;

            margin: 0 auto;

          }}


          h1 {{

            margin-bottom: 5px;

          }}


          .subtitle {{

            color: #aaa;

            margin-bottom: 25px;

          }}


          .instructions {{

            background: #202a36;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 20px;

            line-height: 1.5;

          }}


          .toolbar {{

            position: sticky;

            top: 0;

            z-index: 10;

            background: #111;

            padding: 12px 0;

            border-bottom:
              1px solid #333;

            margin-bottom: 10px;

          }}


          #search {{

            width: 100%;

            padding: 12px;

            font-size: 16px;

            border-radius: 8px;

            border:
              1px solid #444;

            background: #222;

            color: #fff;

            margin-bottom: 12px;

          }}


          .toolbar-buttons {{

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

          }}


          button {{

            padding: 9px 14px;

            border: 0;

            border-radius: 7px;

            cursor: pointer;

            background: #333;

            color: #fff;

          }}


          button:hover {{

            background: #444;

          }}


          .save-button {{

            background: #eee;

            color: #111;

            font-weight: bold;

          }}


          .save-button:hover {{

            background: #ddd;

          }}


          .table-header {{

            display: grid;

            grid-template-columns:
              minmax(300px, 1fr)
              360px;

            gap: 20px;

            padding: 10px 14px;

            color: #aaa;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: .05em;

          }}


          .category-header {{

            display: grid;

            grid-template-columns:
              repeat(3, 1fr);

            gap: 8px;

            text-align: center;

          }}


          .movie-row {{

            display: grid;

            grid-template-columns:
              minmax(300px, 1fr)
              360px;

            gap: 20px;

            align-items: center;

            padding: 12px 14px;

            background: #1b1b1b;

            border-bottom:
              1px solid #303030;

          }}


          .movie-row:nth-child(even) {{

            background: #181818;

          }}


          .movie-title {{

            font-size: 15px;

          }}


          .tmdb {{

            color: #777;

            font-size: 12px;

          }}


          .categories {{

            display: grid;

            grid-template-columns:
              repeat(3, 1fr);

            gap: 8px;

          }}


          .category {{

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            padding: 7px 3px;

            border-radius: 6px;

            cursor: pointer;

            background: #252525;

            font-size: 13px;

          }}


          .category:hover {{

            background: #303030;

          }}


          .category input {{

            width: 17px;

            height: 17px;

          }}


          .stats {{

            color: #aaa;

            margin-top: 10px;

          }}


          .bottom {{

            margin-top: 25px;

            padding: 20px;

            background: #1b1b1b;

            border-radius: 10px;

          }}


          .warning {{

            color: #bbb;

            line-height: 1.5;

          }}


          @media (max-width: 750px) {{

            body {{

              padding: 12px;

            }}


            .table-header {{

              display: none;

            }}


            .movie-row {{

              display: block;

              padding: 15px;

            }}


            .movie-title {{

              margin-bottom: 10px;

            }}


            .categories {{

              width: 100%;

            }}


            .category {{

              padding: 10px 3px;

            }}

          }}

          </style>

          </head>


          <body>


          <div class="container">


            <h1>
              BW's Movie Tag Manager
            </h1>


            <div class="subtitle">

              {len(movies)} movies in catalog

            </div>


            <div class="instructions">

              <strong>
                Review your entire collection.
              </strong>

              <br>

              Check every category that applies
              to each movie.

              Existing categories are already
              checked.

              <br><br>

              Changes are not made to
              <code>movies.js</code> during this
              review.

              When finished, click
              <strong>Download Approved Tags</strong>.

            </div>


            <div class="toolbar">


              <input
                id="search"
                type="search"
                placeholder="Filter movies..."
                autocomplete="off"
              >


              <div class="toolbar-buttons">

                <button
                  type="button"
                  onclick="checkAll('baseball')"
                >
                  Check All Baseball
                </button>


                <button
                  type="button"
                  onclick="uncheckAll('baseball')"
                >
                  Clear Baseball
                </button>


                <button
                  type="button"
                  onclick="checkAll('christmas')"
                >
                  Check All Christmas
                </button>


                <button
                  type="button"
                  onclick="uncheckAll('christmas')"
                >
                  Clear Christmas
                </button>


                <button
                  type="button"
                  onclick="checkAll('animated')"
                >
                  Check All Animated
                </button>


                <button
                  type="button"
                  onclick="uncheckAll('animated')"
                >
                  Clear Animated
                </button>

              </div>


              <div
                class="stats"
                id="stats"
              >
                Showing {len(movies)} movies
              </div>


            </div>


            <div class="table-header">

              <div>
                Movie
              </div>

              <div class="category-header">

                {category_header_html}

              </div>

            </div>


            <div id="movies">

              {''.join(movie_rows)}

            </div>


            <div class="bottom">

              <p class="warning">

                When you click the button below,
                the current state of every movie's
                categories will be exported.

                <br><br>

                This does <strong>not</strong>
                update GitHub by itself.

                Upload the resulting
                <code>approved-tags.json</code>
                to the repository and then run
                <strong>Apply Movie Tags</strong>.

              </p>


              <button
                class="save-button"
                type="button"
                onclick="downloadApproved()"
              >
                Download Approved Tags
              </button>

            </div>


          </div>


          <script>


          // ====================================================
          // SEARCH
          // ====================================================

          const search =
            document.getElementById(
              "search"
            );


          const rows =
            document.querySelectorAll(
              ".movie-row"
            );


          const stats =
            document.getElementById(
              "stats"
            );


          search.addEventListener(
            "input",
            function() {{

              const query =
                search.value
                  .trim()
                  .toLowerCase();


              let visible = 0;


              rows.forEach(
                function(row) {{

                  const title =
                    row.dataset.title;


                  const matches =
                    !query ||
                    title.includes(query);


                  row.style.display =
                    matches
                    ? ""
                    : "grid";


                  if (
                    matches
                  ) {{

                    visible++;

                  }} else {{

                    row.style.display =
                      "none";

                  }}

                }}
              );


              stats.textContent =
                "Showing "
                + visible
                + " movies";

            }}
          );


          // ====================================================
          // CHECK / UNCHECK ENTIRE CATEGORY
          // ====================================================

          function setCategory(
            category,
            checked
          ) {{

            document
              .querySelectorAll(
                '.category-check[data-category="' +
                category +
                '"]'
              )
              .forEach(
                function(box) {{

                  box.checked =
                    checked;

                }}
              );

          }}


          function checkAll(
            category
          ) {{

            setCategory(
              category,
              true
            );

          }}


          function uncheckAll(
            category
          ) {{

            setCategory(
              category,
              false
            );

          }}


          // ====================================================
          // EXPORT
          // ====================================================

          function downloadApproved() {{

            const results = [];


            rows.forEach(
              function(row) {{

                const title =
                  row.dataset.title;


                const tmdbId =
                  row.dataset.tmdb ||
                  null;


                const categories = [];


                row
                  .querySelectorAll(
                    ".category-check"
                  )
                  .forEach(
                    function(box) {{

                      if (
                        box.checked
                      ) {{

                        categories.push(
                          box.dataset.category
                        );

                      }}

                    }}
                  );


                results.push({{

                  title:
                    row.querySelector(
                      ".movie-title"
                    ).innerText
                      .replace(
                        /\\s+TMDB.*$/,
                        ""
                      )
                      .trim(),

                  tmdbId:
                    tmdbId,

                  categories:
                    categories

                }});

              }}
            );


            const data =
              JSON.stringify(
                results,
                null,
                2
              );


            const blob =
              new Blob(
                [data],
                {{
                  type:
                    "application/json"
                }}
              );


            const url =
              URL.createObjectURL(
                blob
              );


            const link =
              document.createElement(
                "a"
              );


            link.href =
              url;


            link.download =
              "approved-tags.json";


            document.body.appendChild(
              link
            );


            link.click();


            document.body.removeChild(
              link
            );


            URL.revokeObjectURL(
              url
            );


            alert(
              "Approved tags exported for "
              + results.length
              + " movies."
            );

          }}


          </script>


          </body>

          </html>
          """


          # ======================================================
          # WRITE REVIEW PAGE
          # ======================================================

          with open(
              "tag-review.html",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)


          print("")
          print("========================================")
          print("FULL CATALOG TAG REVIEW CREATED")
          print("========================================")
          print("")
          print(
              f"Movies included: {len(movies)}"
          )
          print(
              f"Categories: {', '.join(CATEGORIES)}"
          )
          print("")
          print(
              "movies.js was NOT modified."
          )
          print("")
          print(
              "Download tag-review.html from the"
          )
          print(
              "workflow artifact."
          )

          PYTHON


          python tag_review.py


      # ==========================================================
      # UPLOAD HTML REVIEW TOOL
      # ==========================================================

      - name: Upload review page
        uses: actions/upload-artifact@v4
        with:
          name: movie-tag-review
          path: tag-review.html
          retention-days: 7
