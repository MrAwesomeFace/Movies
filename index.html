<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>BW's Movie Collection</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-top">
      <div>
        <h1>BW's Movie Collection</h1>
        <p id="movie-count">Loading collection...</p>
      </div>

      <button id="search-toggle" class="icon-button" aria-label="Search">
        🔍
      </button>
    </div>

    <div id="search-area" class="search-area hidden">
      <input
        type="search"
        id="search-input"
        placeholder="Search movies..."
        autocomplete="off"
      >
    </div>

    <nav class="filters" aria-label="Collection filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="physical">Physical</button>
      <button class="filter" data-filter="digital">Digital</button>
    </nav>
  </header>


  <main>

    <section class="collection-section">
      <div id="movie-grid" class="movie-grid">
        <!-- Movie cards are inserted here by app.js -->
      </div>

      <div id="no-results" class="no-results hidden">
        <p>No movies found.</p>
      </div>
    </section>

  </main>


  <!-- Movie detail window -->

  <div id="movie-modal" class="modal hidden">

    <div class="modal-backdrop"></div>

    <div class="modal-content">

      <button id="modal-close" class="modal-close" aria-label="Close">
        ×
      </button>

      <div class="movie-viewer">

        <div class="movie-flip-container" id="movie-flip-container">

          <div class="movie-flipper">

            <!-- FRONT -->

            <div class="movie-face movie-front">

              <div
                id="modal-cover"
                class="large-cover"
              ></div>

            </div>


            <!-- BACK -->

            <div class="movie-face movie-back">

              <div class="back-content">

                <h2 id="modal-title"></h2>

                <div class="movie-meta">
                  <span id="modal-year"></span>
                  <span>•</span>
                  <span id="modal-runtime"></span>
                </div>

                <div class="movie-info-section">
                  <h3>About</h3>
                  <p id="modal-synopsis"></p>
                </div>

                <div class="movie-info-section">
                  <h3>Starring</h3>
                  <p id="modal-cast"></p>
                </div>

                <div class="movie-info-section">
                  <h3>Directed by</h3>
                  <p id="modal-director"></p>
                </div>

                <div class="movie-info-section">
                  <h3>Where to find it</h3>

                  <div id="modal-formats" class="format-list">
                  </div>
                </div>

              </div>

            </div>

          </div>

        </div>


        <div class="movie-viewer-controls">

          <button id="flip-button" class="primary-button">
            Flip case
          </button>

          <p class="flip-hint">
            Tap the cover or swipe to flip
          </p>

        </div>

      </div>

    </div>

  </div>


  <!--
    The movie collection itself lives in movies.js.
    That means adding movies later won't require
    changing this HTML file.
  -->

  <script src="movies.js"></script>
  <script src="app.js"></script>

</body>
</html>
