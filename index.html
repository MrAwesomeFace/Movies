<!DOCTYPE html>

<html lang="en">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Mr. Movies Rewind</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Iceland&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

<div class="header-top">

  <div>
    <div class="site-title">

      <svg
        class="site-logo"
        width="36"
        height="36"
        viewBox="0 0 32 32"
        aria-hidden="true"
      >
        <path d="M16 16 L28 6 L28 26 Z" fill="#FBCD36"></path>
        <path d="M4 16 L16 6 L16 26 Z" fill="#FBCD36"></path>
      </svg>

      <h1>Mr. Movies <span class="site-title-rewind">Rewind</span></h1>

    </div>
    <p id="movie-count">Loading collection...</p>
  </div>

<button
id="search-toggle"
class="icon-button"
aria-label="Search"

>


🔍


  </button>

</div>

<!-- SEARCH -->

<div
  id="search-area"
  class="search-area hidden"
>

<input
type="search"
id="search-input"
placeholder="Search movies..."
autocomplete="off"

>

</div>

<!-- FILTERS -->

<nav
  class="filters"
  aria-label="Collection filters"
>

  <!-- =====================================================
       ROW 1: TYPE + MEDIA (left)
       STAFF PICKS / SHOW ALL + RESERVATIONS (right)
       ===================================================== -->

  <div class="filter-row filter-row-main">


<div class="filter-group">

  <!--
    No "All" buttons for Type or Media — clicking the
    active pill again turns it back off (same toggle
    behavior Genre/Category already use), so there's
    nothing dedicated to click for "all" instead.
  -->

  <button
    class="filter active"
    data-filter-group="type"
    data-filter-value="movie"
  >
    Movies
  </button>

  <button
    class="filter"
    data-filter-group="type"
    data-filter-value="tv"
  >
    TV
  </button>

  <button
    class="filter"
    data-filter-group="type"
    data-filter-value="misc"
  >
    Misc
  </button>

  <div class="filter-divider">
    |
  </div>

  <button
    class="filter"
    data-filter-group="media"
    data-filter-value="physical"
  >
    Physical
  </button>

  <button
    class="filter"
    data-filter-group="media"
    data-filter-value="digital"
  >
    Digital
  </button>

</div>


<!-- RIGHT SIDE: ACTIONS (top) + RESERVATIONS (bottom) -->

<div class="filter-group-actions">

  <div class="filter-group-actions-top">

    <button
      id="random-button"
      class="filter action-filter"
    >
      Staff Picks
    </button>

    <button
      id="show-all-button"
      class="filter action-filter"
    >
      Show All
    </button>

  </div>

  <div class="filter-group reservation-filter-wrapper">

    <label
      for="reservation-filter"
      class="reservation-filter-label"
    >
      <span class="reservation-label-full">Reservations</span>
      <span class="reservation-label-short">RSVP</span>
    </label>

    <select
      id="reservation-filter"
      class="filter reservation-filter"
      aria-label="Filter movies by reservation"
    >
      <option value="all">All Movies</option>
      <option value="Bryon">Bryon</option>
      <option value="Angie">Angie</option>
      <option value="Joey">Joey</option>
    </select>

  </div>

</div>


  </div>

  <!-- =====================================================
       ROW 2: GENRE DROPDOWN (left), CATEGORY + ANIMATED (right)
       ===================================================== -->

  <div class="filter-row genre-category-row">


<div class="filter-group">

  <label
    for="genre-filter"
    class="visually-hidden"
  >
    Genre
  </label>

  <select
    id="genre-filter"
    class="reservation-filter genre-filter-select"
    aria-label="Filter movies by genre"
  >
    <option value="">All Genres</option>
    <option value="action">Action</option>
    <option value="classic">Classic</option>
    <option value="comedy">Comedy</option>
    <option value="drama">Drama</option>
    <option value="horror">Horror</option>
    <option value="thriller">Thriller</option>
  </select>

</div>


<div class="filter-divider">
  |
</div>


<div class="filter-group">

  <button
    class="filter category-filter"
    data-filter-group="category"
    data-filter-value="baseball"
  >
    Baseball
  </button>

  <button
    class="filter category-filter"
    data-filter-group="category"
    data-filter-value="christmas"
  >
    Christmas
  </button>

  <button
    class="filter category-filter animated-filter"
    data-filter-group="animated"
    data-filter-value="mixed"
  >
    Animated: Hide
  </button>

</div>


  </div>

</nav>

  </header>

  <!-- =========================================================
       COLLECTION
       ========================================================= -->

  <main>

<section class="collection-section">

  <div
    id="movie-grid"
    class="movie-grid"
  >
    <!-- Movie cards are inserted here by app.js -->
  </div>

  <div
    id="no-results"
    class="no-results hidden"
  >
    <p>No movies found.</p>
  </div>

</section>

  </main>

  <!-- =========================================================
       MOVIE DETAIL WINDOW
       ========================================================= -->

  <div
    id="movie-modal"
    class="modal hidden"
  >

<div class="modal-backdrop"></div>

<div class="modal-content">

<button
id="modal-close"
class="modal-close"
aria-label="Close"

>


×


  </button>

  <div class="movie-viewer">


<div
  class="movie-flip-container"
  id="movie-flip-container"
>

  <div class="movie-flipper">


    <!-- FRONT COVER -->

    <div class="movie-face movie-front">

      <div
        id="modal-cover"
        class="large-cover"
      ></div>

    </div>


    <!-- BACK COVER -->

    <div class="movie-face movie-back">

      <div class="back-content">

        <h2 id="modal-title"></h2>


        <div class="movie-meta">

          <span id="modal-year"></span>

          <span>•</span>

          <span id="modal-runtime"></span>

          <span>•</span>

          <span id="modal-genre"></span>

        </div>


        <div class="movie-info-section">

          <h3>About</h3>

          <p id="modal-synopsis"></p>

        </div>


        <div class="movie-info-section">

          <h3>Starring</h3>

          <p id="modal-cast"></p>

        </div>


        <div class="movie-info-section">

          <h3>Directed by</h3>

          <p id="modal-director"></p>

        </div>


        <div class="movie-info-section">

          <h3>Where to find it</h3>

          <div
            id="modal-formats"
            class="format-list"
          ></div>

        </div>


        <!--
          RESERVATIONS ARE CREATED BY app.js

          Do not add reservation HTML here.
          app.js creates the reservation panel
          automatically and keeps it synchronized
          with the reservation API.
        -->

      </div>

    </div>


    <!-- CASE EDGES -->

    <div class="movie-edge movie-edge-left">

      <div class="movie-spine-title">

        <span id="modal-spine-title"></span>

      </div>

    </div>

    <div class="movie-edge movie-edge-right"></div>

    <div class="movie-edge movie-edge-top"></div>

    <div class="movie-edge movie-edge-bottom"></div>


  </div>

</div>


<div class="movie-viewer-controls">

  <button
    id="flip-button"
    class="primary-button"
  >
    Flip case
  </button>

  <p class="flip-hint">
    Tap the cover or swipe to flip
  </p>

</div>


  </div>

</div>

  </div>

  <!-- =========================================================
       MOVIE DATA
       ========================================================= -->

  <script src="movies.js"></script>

  <!-- =========================================================
       APP FUNCTIONALITY
       ========================================================= -->

  <script src="app.js"></script>

</body>

</html>
