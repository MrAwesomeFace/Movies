<!DOCTYPE html>

<html lang="en">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Mr. Movies Rewind</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Iceland&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
  (function () {
    if (localStorage.getItem("mrMoviesTheme") === "arcade") {
      document.documentElement.classList.add("theme-arcade");
      document.body.classList.add("theme-arcade");
    }
  })();
</script>

  <header class="site-header">

<div class="header-top">

  <div>
    <div class="marquee-frame">
      <div class="site-title">

        <svg
          class="site-logo"
          width="36"
          height="36"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >
          <path d="M16 16 L28 6 L28 26 Z" fill="#FBCD36"></path>
          <path d="M4 16 L16 6 L16 26 Z" fill="#FBCD36"></path>
        </svg>

        <h1>Mr. Movies <span class="site-title-rewind">Rewind</span></h1>

      </div>
    </div>
    <p id="movie-count">Loading collection...</p>
  </div>

<div class="header-icon-buttons">

<button
id="mobile-filters-toggle"
class="icon-button mobile-only-icon"
aria-label="Show filters"
aria-expanded="false"

>


☰


  </button>

<button
id="theme-toggle"
class="icon-button"
aria-label="Toggle arcade theme"
title="Toggle arcade theme"

>


🕹️


  </button>

<button
id="search-toggle"
class="icon-button"
aria-label="Search"

>


🔍


  </button>

<button
id="coin-slot-button-mobile"
class="coin-slot-button-mobile mobile-only-icon"
aria-label="Insert coin"

>
25&#162;
</button>

<button
id="marquee-reset-button-mobile"
class="marquee-reset-button-mobile mobile-only-icon"
aria-label="Reset marquee lights"

>


💡


  </button>

</div>

</div>

<!-- SEARCH -->

<div
  id="search-area"
  class="search-area hidden"
>

<input
type="search"
id="search-input"
placeholder="Search movies..."
autocomplete="off"

>

</div>

<!-- FILTERS -->

<nav
  class="filters"
  aria-label="Collection filters"
>

  <!-- =====================================================
       ROW 1: TYPE + MEDIA (left)
       STAFF PICKS / SHOW ALL + RESERVATIONS (right)
       ===================================================== -->

  <div class="filter-row filter-row-main">


<div class="filter-group">

  <!--
    No "All" buttons for Type or Media — clicking the
    active pill again turns it back off (same toggle
    behavior Genre/Category already use), so there's
    nothing dedicated to click for "all" instead.
  -->

  <div class="type-pills-wrap">

  <button
    class="filter active"
    data-filter-group="type"
    data-filter-value="movie"
  >
    Movies
  </button>

  <button
    class="filter"
    data-filter-group="type"
    data-filter-value="tv"
  >
    TV
  </button>

  <button
    class="filter"
    data-filter-group="type"
    data-filter-value="misc"
  >
    Misc
  </button>

  </div>

  <div class="filter-divider media-divider">
    |
  </div>

  <button
    class="filter media-pill"
    data-filter-group="media"
    data-filter-value="physical"
  >
    Physical
  </button>

  <button
    class="filter media-pill"
    data-filter-group="media"
    data-filter-value="digital"
  >
    Digital
  </button>

</div>


<!-- RIGHT SIDE: ACTIONS (top) + RESERVATIONS (bottom) -->

<div class="filter-group-actions">

  <div class="filter-group-actions-top">

    <button
      id="random-button"
      class="filter action-filter"
    >
      Staff Picks
    </button>

    <label
      for="media-filter-mobile"
      class="visually-hidden"
    >
      Format
    </label>

    <select
      id="media-filter-mobile"
      class="reservation-filter mobile-only-filter"
      aria-label="Filter movies by format"
    >
      <option value="all">All Formats</option>
      <option value="physical">Physical</option>
      <option value="digital">Digital</option>
    </select>

    <button
      id="coin-slot-button"
      class="coin-slot-button"
      aria-label="Insert coin"
    >
      <svg width="26" height="52" viewBox="0 0 40 80" aria-hidden="true">
        <rect x="2" y="2" width="36" height="76" rx="4" fill="none" stroke="#ff1428" stroke-width="2"></rect>
        <text x="20" y="16" text-anchor="middle" fill="#ff1428" font-size="11" font-family="monospace" font-weight="bold">25&#162;</text>
        <rect x="16.5" y="22" width="7" height="44" rx="3.5" fill="none" stroke="#ff1428" stroke-width="2"></rect>
      </svg>
    </button>

    <button
      id="marquee-reset-button"
      class="marquee-reset-button"
      aria-label="Reset marquee lights"
    >
      <svg width="24" height="32" viewBox="0 0 24 32" aria-hidden="true">
        <path d="M12 2 C7 2 4 6 4 10 C4 13 5.5 15 7 17 C7.8 17.8 8 18.5 8 19.5 L8 20 L16 20 L16 19.5 C16 18.5 16.2 17.8 17 17 C18.5 15 20 13 20 10 C20 6 17 2 12 2 Z" fill="none" stroke="#FBCD36" stroke-width="1.6"></path>
        <path d="M9 8 Q10.5 10.5 12 8 Q13.5 10.5 15 8" fill="none" stroke="#FBCD36" stroke-width="1.4"></path>
        <line x1="9" y1="8" x2="9" y2="17" stroke="#FBCD36" stroke-width="1.4"></line>
        <line x1="15" y1="8" x2="15" y2="17" stroke="#FBCD36" stroke-width="1.4"></line>
        <line x1="8.5" y1="21" x2="15.5" y2="21" stroke="#FBCD36" stroke-width="1.4"></line>
        <line x1="8.5" y1="23.5" x2="15.5" y2="23.5" stroke="#FBCD36" stroke-width="1.4"></line>
        <line x1="9" y1="26" x2="15" y2="26" stroke="#FBCD36" stroke-width="1.4"></line>
        <path d="M9.5 27.5 Q12 29 14.5 27.5" fill="none" stroke="#FBCD36" stroke-width="1.4"></path>
      </svg>
    </button>

  </div>

  <div class="filter-group reservation-filter-wrapper mobile-collapsible">

    <label
      for="reservation-filter"
      class="reservation-filter-label"
    >
      <span class="reservation-label-full">Reservations</span>
      <span class="reservation-label-short">RSVP</span>
    </label>

    <select
      id="reservation-filter"
      class="filter reservation-filter"
      aria-label="Filter movies by reservation"
    >
      <option value="all">All Movies</option>
      <option value="Bryon">Bryon</option>
      <option value="Angie">Angie</option>
      <option value="Joey">Joey</option>
    </select>

  </div>

</div>


  </div>

  <!-- =====================================================
       ROW 2: GENRE DROPDOWN (left), CATEGORY + ANIMATED (right)
       ===================================================== -->

  <div class="filter-row genre-category-row">


<div class="filter-group">

  <label
    for="genre-filter"
    class="visually-hidden"
  >
    Genre
  </label>

  <select
    id="genre-filter"
    class="reservation-filter genre-filter-select"
    aria-label="Filter movies by genre"
  >
    <option value="">All Genres</option>
    <option value="action">Action</option>
    <option value="classic">Classic</option>
    <option value="comedy">Comedy</option>
    <option value="drama">Drama</option>
    <option value="horror">Horror</option>
    <option value="thriller">Thriller</option>
  </select>

</div>


<div class="filter-divider category-divider mobile-collapsible">
  |
</div>


<div class="filter-group category-group mobile-collapsible">

  <button
    class="filter category-filter"
    data-filter-group="category"
    data-filter-value="baseball"
  >
    Baseball
  </button>

  <button
    class="filter category-filter"
    data-filter-group="category"
    data-filter-value="christmas"
  >
    Christmas
  </button>

  <button
    class="filter category-filter animated-filter"
    data-filter-group="animated"
    data-filter-value="mixed"
  >
    Animated: Hide
  </button>

</div>


  </div>

</nav>

  </header>

  <!-- =========================================================
       COLLECTION
       ========================================================= -->

  <main>

<section class="collection-section">

  <div
    id="movie-grid"
    class="movie-grid"
  >
    <!-- Movie cards are inserted here by app.js -->
  </div>

  <div
    id="no-results"
    class="no-results hidden"
  >
    <p>No movies found.</p>
  </div>

</section>

  </main>

  <!--
    Arcade theme only — populated by app.js with individually
    varied shapes (position, rotation, color, which template),
    since a single repeating CSS background tile can only ever
    look mechanical. Sitting outside main deliberately, so they
    aren't constrained by its max-width.
  -->

  <div id="arcade-side-lighting-left" class="arcade-side-lighting"></div>
  <div id="arcade-side-lighting-right" class="arcade-side-lighting right"></div>

  <!--
    Coin slot's power-surge flash — inert (opacity:0, no
    animation) until the coin slot's click handler adds
    .active. Sits outside the arcade-theme class scoping
    since it's naturally unreachable anyway: the button
    that triggers it is display:none outside arcade mode.
  -->

  <div id="coin-flicker-overlay" aria-hidden="true"></div>

  <!--
    Marquee lights' pop flash — same inert-until-.active
    mechanism as the coin slot's overlay above, just its own
    element with its own warm gold/white palette instead of
    arcade's cyan/magenta.
  -->

  <div id="marquee-pop-flash" aria-hidden="true"></div>

  <!-- =========================================================
       MOVIE DETAIL WINDOW
       ========================================================= -->

  <div
    id="movie-modal"
    class="modal hidden"
  >

<div class="modal-backdrop"></div>

<div class="modal-content">

<button
id="modal-close"
class="modal-close"
aria-label="Close"

>


×


  </button>

  <div class="movie-viewer">


<div
  class="movie-flip-container"
  id="movie-flip-container"
>

  <div class="movie-flipper">


    <!-- FRONT COVER -->

    <div class="movie-face movie-front">

      <div
        id="modal-cover"
        class="large-cover"
      ></div>

    </div>


    <!-- BACK COVER -->

    <div class="movie-face movie-back">

      <div class="back-content">

        <h2 id="modal-title"></h2>


        <div class="movie-meta">

          <span id="modal-year"></span>

          <span>•</span>

          <span id="modal-runtime"></span>

          <span>•</span>

          <span id="modal-genre"></span>

        </div>


        <div class="movie-info-section">

          <h3>About</h3>

          <p id="modal-synopsis"></p>

        </div>


        <div class="movie-info-section">

          <h3>Starring</h3>

          <p id="modal-cast"></p>

        </div>


        <div class="movie-info-section">

          <h3>Directed by</h3>

          <p id="modal-director"></p>

        </div>


        <div class="movie-info-section">

          <h3>Where to find it</h3>

          <div
            id="modal-formats"
            class="format-list"
          ></div>

        </div>


        <!--
          RESERVATIONS ARE CREATED BY app.js

          Do not add reservation HTML here.
          app.js creates the reservation panel
          automatically and keeps it synchronized
          with the reservation API.
        -->

      </div>

    </div>


    <!-- CASE EDGES -->

    <div class="movie-edge movie-edge-left">

      <div class="movie-spine-title">

        <span id="modal-spine-title"></span>

      </div>

    </div>

    <div class="movie-edge movie-edge-right"></div>

    <div class="movie-edge movie-edge-top"></div>

    <div class="movie-edge movie-edge-bottom"></div>


  </div>

</div>


<div class="movie-viewer-controls">

  <button
    id="flip-button"
    class="primary-button"
  >
    Flip case
  </button>

  <p class="flip-hint">
    Tap the cover or swipe to flip
  </p>

</div>


  </div>

</div>

  </div>

  <!-- =========================================================
       MOVIE DATA
       ========================================================= -->

  <script src="movies.js"></script>

  <!-- =========================================================
       APP FUNCTIONALITY
       ========================================================= -->

  <script src="app.js"></script>

</body>

</html>
